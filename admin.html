<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard v3</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    h2 {
      margin-bottom: 12px;
    }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filters button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #ddd;
      cursor: pointer;
      font-weight: bold;
    }

    .filters button.active {
      background: #3b82f6;
      color: white;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .badges {
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      margin-right: 5px;
      margin-bottom: 5px;
    }

    .green { background: #dcfce7; color: #166534; }
    .red { background: #fee2e2; color: #991b1b; }
    .orange { background: #ffedd5; color: #9a3412; }
    .blue { background: #dbeafe; color: #1d4ed8; }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .row input {
      flex: 1;
      min-width: 220px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    img {
      max-width: 120px;
      border-radius: 10px;
      border: 2px solid #eee;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .buttons button {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .saveBtn {
      background: #3b82f6;
      color: white;
    }

    .deleteBtn {
      background: #ef4444;
      color: white;
    }

    .qrBox {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

  </style>
</head>

<body>

<h2>🐾 Arkforge Admin Dashboard</h2>

<input id="search" placeholder="Search Tag ID or Pet Name...">

<div class="filters">

  <button class="active" onclick="setFilter('all', this)">All</button>
  <button onclick="setFilter('inactive', this)">Unactivated</button>
  <button onclick="setFilter('active', this)">Activated</button>
  <button onclick="setFilter('missingPhoto', this)">No Photo</button>
  <button onclick="setFilter('missingSecondary', this)">No Secondary</button>

</div>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const listDiv = document.getElementById("list");

let allPets = [];
let currentSearch = "";
let currentFilter = "all";

// AUTH
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  listenForPets();
});

// LIVE DATA
function listenForPets() {

  onSnapshot(collection(db, "pets"), (snap) => {

    allPets = [];

    snap.forEach((docSnap) => {
      allPets.push({
        id: docSnap.id,
        ...docSnap.data()
      });
    });

    render();

  });

}

// SEARCH
document.getElementById("search").addEventListener("input", (e) => {
  currentSearch = e.target.value.toLowerCase();
  render();
});

// FILTERS
window.setFilter = (filter, btn) => {
  currentFilter = filter;

  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  render();
};

// QR GENERATOR
function makeQR(id, container) {

  const url =
    `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`;

  new QRCode(container, {
    text: url,
    width: 90,
    height: 90
  });

}

// RENDER
function render() {

  listDiv.innerHTML = "";

  const filtered = allPets.filter((p) => {

    const matchesSearch =
      p.id.toLowerCase().includes(currentSearch) ||
      (p.name || "").toLowerCase().includes(currentSearch);

    if (!matchesSearch) return false;

    switch (currentFilter) {

      case "inactive":
        return !p.activatedAt;

      case "active":
        return !!p.activatedAt;

      case "missingPhoto":
        return !p.photo || p.photo.includes("placeholderpaw");

      case "missingSecondary":
        return !p.phone2;

      default:
        return true;

    }

  });

  filtered.forEach((p) => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `

      <div class="meta"><b>Tag ID:</b> ${p.id}</div>

      <div class="row">

        <input id="name-${p.id}" value="${p.name || ""}" placeholder="Pet Name">
        <input id="phone-${p.id}" value="${p.phone || ""}" placeholder="Primary">
        <input id="phone2-${p.id}" value="${p.phone2 || ""}" placeholder="Secondary">

      </div>

      <div class="qrBox">

        ${p.photo ? `<img src="${p.photo}">` : ""}

        <div id="qr-${p.id}"></div>

      </div>

      <div class="buttons">

        <button class="saveBtn" onclick="savePet('${p.id}')">💾 Save</button>
        <button class="deleteBtn" onclick="deletePet('${p.id}')">🗑 Delete</button>

      </div>

    `;

    listDiv.appendChild(div);

    setTimeout(() => {

      const qrBox = document.getElementById("qr-" + p.id);

      if (qrBox) {
        qrBox.innerHTML = "";
        makeQR(p.id, qrBox);
      }

    }, 0);

  });

}

// SAVE
window.savePet = async (id) => {

  await updateDoc(doc(db, "pets", id), {
    name: document.getElementById("name-" + id).value,
    phone: document.getElementById("phone-" + id).value,
    phone2: document.getElementById("phone2-" + id).value
  });

};

// DELETE
window.deletePet = async (id) => {

  if (!confirm("Delete this pet tag?")) return;

  await deleteDoc(doc(db, "pets", id));

};

</script>

</body>
</html>
