<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Manage Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
    }

    .container {
      max-width: 460px;
      margin: auto;
      background: #fff;
      padding: 16px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .contextBox {
      text-align:center;
      background:#eef6ff;
      padding:10px;
      border-radius:12px;
      font-weight:bold;
      margin-bottom: 10px;
    }

    .section {
      margin-top: 12px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }

    button {
      width: 50%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-top: 8px;

      display: block;
      margin-left: auto;
      margin-right: auto;
      background: #999; /* default fallback */
    }

    /* STATUS BUTTONS */
    .lostBtn {
      background: #ef4444 !important;
    }

    .safeBtn {
      background: #28c76f !important;
    }

    .saveBtn {
      background: #3b82f6 !important;
    }

    #preview {
      width:160px;
      height:160px;
      border-radius:18px;
      object-fit:cover;
      display:block;
      margin:auto;
    }

    #fileInput { display:none; }

    .primaryBtn {
      flex:1;
      padding:12px;
      border-radius:14px;
      border:none;
      cursor:pointer;
      font-weight:600;
      color:white;
      background:#3b82f6;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .primaryBtn:hover { background:#2563eb; }

    .btnRow {
      display:flex;
      gap:10px;
      margin-top:10px;
    }
  </style>
</head>

<body>

<div class="container" id="main">

  <h2 style="text-align:center;">ArkLink - Manage Pet</h2>

  <div class="contextBox">
    You are editing:<br>
    <span id="petNameLabel">Loading...</span><br>
    <small>ID: <span id="tagIdLabel"></span></small>
  </div>

  <div class="section">
    <label><i class="fa-solid fa-heart-crack"></i> Status</label>
    <button class="lostBtn" onclick="setStatus('lost')">Mark Lost</button>
    <button class="safeBtn" onclick="setStatus('safe')">Mark Safe</button>
  </div>

  <div class="section">
    <label><i class="fa-solid fa-phone"></i> Primary Phone</label>
    <input id="phone">

    <label><i class="fa-solid fa-phone"></i> Secondary Phone</label>
    <input id="phone2">
  </div>

  <div class="section">
    <label><i class="fa-solid fa-dog"></i> Pet Name</label>
    <input id="petNameInput" readonly>

    <label style="margin-top:10px;">
      <i class="fa-solid fa-microchip"></i> Microchip
    </label>
    <input id="microchipInput" readonly>
  </div>

  <div class="section">
    <label><i class="fa-solid fa-image"></i> Photo</label>

    <img id="preview">

    <input type="file" id="fileInput" accept="image/*">

    <div class="btnRow">
      <button type="button" class="primaryBtn" onclick="openCamera()">
        <i class="fa-solid fa-camera"></i> Camera
      </button>

      <button type="button" class="primaryBtn" onclick="openGallery()">
        <i class="fa-solid fa-upload"></i> Upload
      </button>
    </div>
  </div>

  <button class="saveBtn" onclick="save()">Save Changes</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(location.search).get("id");
const main = document.getElementById("main");

let ref;
let petData;
let selectedFile = null;

function init() {
  if (!id) {
    document.getElementById("petNameLabel").innerText = "Missing ID";
    main.style.opacity = "1";
    return;
  }

  ref = doc(db, "pets", id);
  document.getElementById("tagIdLabel").innerText = id;

  load();
}

async function load() {
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    document.getElementById("petNameLabel").innerText = "Not found";
    main.style.opacity = "1";
    return;
  }

  petData = snap.data();

  const status = String(petData.status || "").toLowerCase().trim();

  if (status === "inactive") {
    location.href = "activate.html?id=" + id;
    return;
  }

  document.getElementById("petNameLabel").innerText = petData.name || "";
  document.getElementById("phone").value = petData.phone || "";
  document.getElementById("phone2").value = petData.phone2 || "";
  document.getElementById("petNameInput").value = petData.name || "";
  document.getElementById("microchipInput").value = petData.microchip || "";
  document.getElementById("preview").src = petData.photo || "";

  main.style.opacity = "1";
}

window.setStatus = async (status) => {
  await updateDoc(ref, {
    petStatus: status,
    updatedAt: new Date()
  });

  petData.petStatus = status;
};

document.getElementById("fileInput").addEventListener("change", (e) => {
  selectedFile = e.target.files[0];
  if (!selectedFile) return;

  document.getElementById("preview").src =
    URL.createObjectURL(selectedFile);
});

window.openCamera = () => {
  const i = document.getElementById("fileInput");
  i.setAttribute("capture","environment");
  i.click();
};

window.openGallery = () => {
  const i = document.getElementById("fileInput");
  i.removeAttribute("capture");
  i.click();
};

window.save = async () => {
  await updateDoc(ref, {
    name: document.getElementById("petNameInput").value,
    microchip: document.getElementById("microchipInput").value,
    phone: document.getElementById("phone").value,
    phone2: document.getElementById("phone2").value,
    updatedAt: new Date()
  });

  alert("Saved");
};

init();
</script>

</body>
</html>
