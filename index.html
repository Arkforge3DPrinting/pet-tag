<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
      color: #222;
    }

    #scanIntro {
      position: fixed;
      inset: 0;
      background: rgba(245, 247, 250, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }

    .scanCircle {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      box-shadow: 0 0 25px rgba(59,130,246,0.25);
      animation: pulse 1.2s infinite;
    }

    .scanText {
      margin-top: 14px;
      font-weight: bold;
      color: #3b82f6;
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: linear-gradient(180deg, #ffffff, #fbfcfd);
      padding: 16px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
      position: relative;
    }

    h1 { font-size: 24px; margin: 0 0 6px 0; }
    p { font-size: 15px; color: #666; margin: 0 0 10px 0; }

    .photoWrap {
      position: relative;
      display: inline-block;
    }

    #petPhoto {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      margin: 10px auto;
      transition: 0.3s ease;
    }

    .safePhoto {
      box-shadow: 0 0 0 3px rgba(34,197,94,0.4);
      animation: glowGreen 3s infinite;
    }

    @keyframes glowGreen {
      0% { box-shadow: 0 0 0 2px rgba(34,197,94,0.2); }
      50% { box-shadow: 0 0 0 5px rgba(34,197,94,0.4); }
      100% { box-shadow: 0 0 0 2px rgba(34,197,94,0.2); }
    }

    .lostPhoto {
      box-shadow: 0 0 0 3px rgba(239,68,68,0.5);
      animation: glowRed 1.4s infinite;
    }

    @keyframes glowRed {
      0% { box-shadow: 0 0 0 2px rgba(239,68,68,0.25); }
      50% { box-shadow: 0 0 0 6px rgba(239,68,68,0.6); }
      100% { box-shadow: 0 0 0 2px rgba(239,68,68,0.25); }
    }

    .statusBadge {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      color: white;
      z-index: 10;
    }

    .status-lost { background: #ef4444; }
    .status-safe { background: #22c55e; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .single { grid-template-columns: 1fr !important; }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    #callBtn, #callBtn2 { background: #28c76f; }
    #textBtn, #textBtn2 { background: #3b82f6; }
    #locBtn, #locBtn2 { background: #ff9f43; }

    .hidden { display: none !important; }

    #gpsStatus {
      margin-top: 8px;
      font-weight: bold;
      color: #22c55e;
      letter-spacing: 2px;
      display: none;
    }

    #gpsText {
      margin-top: 4px;
      font-size: 11px;
      color: #777;
      display: none;
    }

    #lastUpdated {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>

<div id="scanIntro">
  <div class="scanCircle"></div>
  <div class="scanText">Scanning ArkLink Tag...</div>
</div>

<div class="container" id="main">

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <div class="photoWrap">
    <div id="statusBadge" class="statusBadge hidden"></div>
    <img id="petPhoto">
  </div>

  <div id="btnGrid" class="grid">
    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call Secondary</button>
    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text Secondary</button>
    <button id="locBtn">📍 Send Location</button>
    <button id="locBtn2">📍 Send Location Secondary</button>
  </div>

  <div id="gpsStatus">●○○</div>
  <div id="gpsText">Acquiring your location...</div>

  <div id="lastUpdated">Last updated: —</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);
const id = new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");
const scanIntro = document.getElementById("scanIntro");

let gpsBusy = false;

/* START STATE */
main.style.display = "none";

/* SIMPLE SCAN TIMER (reliable UX) */
setTimeout(() => {
  scanIntro.style.opacity = "0";
  scanIntro.style.transition = "opacity 0.4s ease";

  setTimeout(() => {
    scanIntro.style.display = "none";
  }, 400);
}, 1200);

/* FIXED TIME AGO */
function timeAgo(date) {
  const seconds = Math.floor((Date.now() - date) / 1000);

  if (seconds < 60) return `${seconds}s ago`;
  const mins = Math.floor(seconds / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  return `${hrs}h ago`;
}

/* GPS */
function getGPS() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 12000
    });
  });
}

/* LIVE */
function loadPet() {
  const ref = doc(db, "pets", id);

  onSnapshot(ref, (snap) => {
    if (!snap.exists()) return;

    const pet = snap.data();
    if (!pet) return;

    /* SHOW MAIN ONLY WHEN DATA IS READY */
    main.style.display = "block";

    document.getElementById("title").innerText = "🐾 You found " + pet.name;
    document.getElementById("message").innerText = "Help get them home safely.";

    /* MICROCHIP */
    if (pet.microchip) {
      let chip = document.getElementById("microchipText");

      if (!chip) {
        chip = document.createElement("div");
        chip.id = "microchipText";
        chip.style.marginTop = "8px";
        chip.style.fontSize = "12px";
        chip.style.color = "#666";
        chip.style.fontWeight = "600";
        document.getElementById("main").insertBefore(chip, document.getElementById("btnGrid"));
      }

      chip.innerHTML = "Microchip: <strong>" + pet.microchip.toUpperCase() + "</strong>";
    }

    const photo = document.getElementById("petPhoto");
    const badge = document.getElementById("statusBadge");

    photo.classList.remove("lostPhoto", "safePhoto");
    badge.classList.add("hidden");
    badge.classList.remove("status-lost", "status-safe");

    const status = pet.petStatus;

    if (status === "lost") {
      badge.innerText = "🔴 LOST";
      badge.classList.remove("hidden");
      badge.classList.add("status-lost");
      photo.classList.add("lostPhoto");
    } else {
      photo.classList.add("safePhoto");
    }

    if (pet.photo) photo.src = pet.photo;

    /* LAST UPDATED */
    const raw = pet.updatedAt;

    let last = null;

    if (raw?.toDate) last = raw.toDate();
    else if (raw?.seconds) last = new Date(raw.seconds * 1000);
    else last = new Date(raw);

    if (!isNaN(last.getTime())) {
      document.getElementById("lastUpdated").innerText =
        "Last updated: " + timeAgo(last);
    }

    /* BUTTONS */
    document.getElementById("callBtn").onclick =
      () => window.location.href = "tel:" + pet.phone;

    document.getElementById("callBtn2").onclick =
      () => window.location.href = "tel:" + pet.phone2;

    document.getElementById("textBtn").onclick =
      () => window.open(
        `sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
        "_self"
      );

    document.getElementById("textBtn2").onclick =
      () => window.open(
        `sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
        "_self"
      );

    function bindGPS(btnId, phone) {
      const btn = document.getElementById(btnId);

      btn.onclick = async () => {
        if (gpsBusy) return;
        gpsBusy = true;

        const gpsStatus = document.getElementById("gpsStatus");
        const gpsText = document.getElementById("gpsText");

        const frames = ["●○○", "●●○", "●●●"];
        let i = 0;

        gpsStatus.style.display = "block";
        gpsText.style.display = "block";

        const anim = setInterval(() => {
          gpsStatus.innerText = frames[i++ % frames.length];
        }, 350);

        try {
          const pos = await getGPS();

          window.open(
            `sms:${phone}?body=${encodeURIComponent(
              "I found " + pet.name +
              " https://maps.google.com/?q=" +
              pos.coords.latitude + "," + pos.coords.longitude
            )}`,
            "_self"
          );
        } finally {
          clearInterval(anim);
          gpsStatus.style.display = "none";
          gpsText.style.display = "none";
          gpsBusy = false;
        }
      };
    }

    bindGPS("locBtn", pet.phone);
    if (pet.phone2?.trim()) bindGPS("locBtn2", pet.phone2);
  });
}

loadPet();
</script>

</body>
</html>
