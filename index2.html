<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Found Pet</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background: radial-gradient(circle at top,#ffffff 0%,#eef4ff 30%,#dfe9f7 100%);
  color:#111827;
}

.container{
  max-width:460px;
  margin:auto;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(22px);
  border-radius:34px;
  overflow:hidden;
  display:none;
}

/* HERO */
.hero{
  padding:30px 24px 18px;
  text-align:center;
}

/* IMAGE WRAPPER */
#petPhotoWrapper{
  position:relative;
  width:250px;
  height:250px;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* PET IMAGE */
#petPhoto{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:34px;
  opacity:0;
  transition:opacity .3s ease;
  border:6px solid white;
}

/* 🟢 LIVE DOT (NEW) */
.live-dot{
  position:absolute;
  top:14px;
  right:14px;
  width:14px;
  height:14px;
  background:#22c55e;
  border-radius:50%;
  box-shadow:0 0 10px #22c55e, 0 0 18px #22c55e;
  animation:livePulse 1.6s infinite;
}

@keyframes livePulse{
  0%{transform:scale(1); opacity:1;}
  50%{transform:scale(1.4); opacity:.6;}
  100%{transform:scale(1); opacity:1;}
}

/* 📡 GPS RINGS */
.pulse-ring{
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  border:2px solid rgba(34,197,94,.55);
  opacity:0;
  transform:scale(.6);
}

.pulse-ring.active{
  animation:radar 1.4s ease-out infinite;
}

@keyframes radar{
  0%{transform:scale(.6); opacity:.8;}
  70%{opacity:.2;}
  100%{transform:scale(1.6); opacity:0;}
}

/* TEXT */
h1{
  font-size:32px;
  font-weight:800;
  margin-bottom:6px;
}

/* MOVED UP (your request) */
.notice{
  margin:0 18px 14px;
  padding:14px;
  border-radius:18px;
  background:rgba(59,130,246,.08);
  border:1px solid rgba(59,130,246,.15);
  font-weight:600;
  text-align:center;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:0 18px 18px;
}

button{
  border:none;
  border-radius:20px;
  padding:16px;
  color:white;
  font-weight:700;
  cursor:pointer;
  min-height:76px;
}

/* COLORS */
#callBtn,#callBtn2{background:#22c55e;}
#textBtn,#textBtn2{background:#3b82f6;}
#locBtn,#locBtn2{background:#f59e0b;}

.footer{
  text-align:center;
  padding:10px 0 18px;
  font-size:12px;
  color:#9ca3af;
}
</style>
</head>

<body>

<div class="container" id="main">

  <div class="hero">

    <div id="petPhotoWrapper">
      <img id="petPhoto">
      <div class="pulse-ring" id="gpsPulse"></div>

      <!-- 🟢 LIVE DOT -->
      <div class="live-dot"></div>
    </div>

    <h1 id="title">Loading...</h1>
  </div>

  <!-- MOVED UP -->
  <div class="notice" id="message">
    Help return this pet safely.
  </div>

  <div class="grid">
    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call 2</button>

    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text 2</button>

    <button id="locBtn">📍 Location</button>
    <button id="locBtn2">📍 Location 2</button>
  </div>

  <div class="footer">Powered by Arkforge 3D Printing ®</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let pet={name:"Pet",phone:"",phone2:""};

const gpsPulse=document.getElementById("gpsPulse");

/* 🔊 SOUND */
function ping(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type="sine";
    o.frequency.value=880;
    g.gain.value=0.2;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.2);
  }catch{}
}

/* 📡 GPS */
function gps(phone,label,btn){

  btn.disabled=true;
  btn.innerText="Locating...";

  gpsPulse.classList.add("active");

  navigator.geolocation.getCurrentPosition(pos=>{

    gpsPulse.classList.remove("active");

    ping();

    if(navigator.vibrate){
      navigator.vibrate([200,100,200]);
    }

    const msg=
      "I found "+pet.name+
      " https://maps.google.com/?q="+
      pos.coords.latitude+","+pos.coords.longitude;

    btn.disabled=false;
    btn.innerText=label;

    location.href=`sms:${phone}?body=${encodeURIComponent(msg)}`;

  },()=>{

    gpsPulse.classList.remove("active");
    btn.disabled=false;
    btn.innerText=label;

    alert("GPS failed.");
  },{
    enableHighAccuracy:true
  });
}

/* LOAD */
async function load(){

  document.getElementById("main").style.display="block";

  const id=new URLSearchParams(window.location.search).get("id");

  const snap=await getDoc(doc(db,"pets",id));
  if(!snap.exists()) return;

  pet=snap.data();

  document.getElementById("title").innerText=pet.name;

  const img=document.getElementById("petPhoto");

  if(pet.photo){
    img.src=pet.photo;
    img.onload=()=>img.style.opacity="1";
  }

  bind();
}

function bind(){

  document.getElementById("callBtn").onclick=()=>location.href="tel:"+pet.phone;
  document.getElementById("callBtn2").onclick=()=>location.href="tel:"+pet.phone2;

  document.getElementById("textBtn").onclick=()=>location.href=`sms:${pet.phone}?body=${encodeURIComponent("I found your pet "+pet.name)}`;
  document.getElementById("textBtn2").onclick=()=>location.href=`sms:${pet.phone2}?body=${encodeURIComponent("I found your pet "+pet.name)}`;

  document.getElementById("locBtn").onclick=(e)=>gps(pet.phone,"Location",e.target);
  document.getElementById("locBtn2").onclick=(e)=>gps(pet.phone2,"Location 2",e.target);
}

load();
</script>

</body>
</html>
