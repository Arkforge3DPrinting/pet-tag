<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Manage Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 460px;
      margin: auto;
      background: linear-gradient(180deg, #ffffff, #fbfcfd);
      padding: 16px;
      border-radius: 22px;
      border: 1px solid rgba(59,130,246,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
      text-align: center;
    }

    p {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 10px;
    }

    .contextBox {
      margin: 10px auto 14px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #eef6ff;
      border: 1px solid rgba(59,130,246,0.25);
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      color: #1f2937;
    }

    .section {
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    label {
      font-size: 12px;
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #444;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-top: 8px;
    }

    .lostBtn { background: #ef4444; }
    .safeBtn { background: #28c76f; }
    .saveBtn { background: #3b82f6; }

    .statusBox {
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 10px;
    }

    .safe { background: #eafff1; color: #1a7f3c; }
    .lost { background: #ffecec; color: #a31212; }

    #preview {
      width: 160px;
      height: 160px;
      border-radius: 18px;
      object-fit: cover;
      border: 3px solid rgba(34,197,94,0.35);
      margin-top: 10px;
    }

    input[type="file"] { display: none; }

    .microchipBox {
      margin-top: 8px;
      padding: 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 13px;
      font-family: monospace;
    }

    .microchipEditToggle {
      margin-top: 6px;
      font-size: 12px;
      color: #2563eb;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }

    #microchipInput,
    #petNameInput {
      display: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Manage Portal Test 1</h1>
  <p>Update your pet’s details instantly</p>

  <div class="contextBox">
    You are editing: <span id="petNameLabel">Loading...</span><br>
    Tag ID: <span id="tagIdLabel"></span>
  </div>

  <div id="statusDisplay" class="statusBox">Loading...</div>

  <div class="section">
    <button class="lostBtn" onclick="setStatus('lost')">🔴 Mark as Lost</button>
    <button class="safeBtn" onclick="setStatus('safe')">🟢 Mark as Safe</button>
  </div>

  <div class="section">
    <label>Primary Phone</label>
    <input id="phone">

    <label>Secondary Phone</label>
    <input id="phone2">
  </div>

  <!-- PET NAME -->
  <div class="section">
    <label>Pet Name</label>

    <div class="microchipEditToggle" onclick="togglePetNameEdit()">
      Incorrect? Update pet name
    </div>

    <input id="petNameInput" placeholder="Enter corrected pet name">
  </div>

  <!-- MICROCHIP -->
  <div class="section">
    <label>Microchip</label>

    <div class="microchipBox" id="microchipDisplay">Loading...</div>

    <div class="microchipEditToggle" onclick="toggleMicrochipEdit()">
      Incorrect? Update microchip
    </div>

    <input id="microchipInput" placeholder="Enter corrected microchip number">
  </div>

  <!-- PHOTO -->
  <div class="section">
    <label>Photo</label>

    <img id="preview">

    <input type="file" id="fileInput" accept="image/*">
    <button onclick="document.getElementById('fileInput').click()">Upload Photo</button>
  </div>

  <button class="saveBtn" id="saveBtn" onclick="save()">💾 Save Changes</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(location.search).get("id");
const ref = doc(db, "pets", id);

let petData = null;
let selectedFile = null;

/* CLOUDINARY */
const CLOUD_NAME = "ddsp7ps7p";
const UPLOAD_PRESET = "YOUR_UNSIGNED_PRESET";

async function uploadToCloudinary(file) {
  const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  const res = await fetch(url, {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  if (!data.secure_url) {
    console.error(data);
    throw new Error("Cloudinary upload failed");
  }

  return data.secure_url;
}

/* LOAD */
async function load() {
  const snap = await getDoc(ref);
  petData = snap.data();

  document.getElementById("phone").value = petData.phone || "";
  document.getElementById("phone2").value = petData.phone2 || "";
  document.getElementById("preview").src = petData.photo || "";

  document.getElementById("petNameLabel").innerText = petData.name || "";
  document.getElementById("tagIdLabel").innerText = id;

  document.getElementById("microchipDisplay").innerText = petData.microchip || "";

  updateStatusUI();
}

/* STATUS */
window.setStatus = async (status) => {
  await updateDoc(ref, { petStatus: status, updatedAt: new Date() });
  petData.petStatus = status;
  updateStatusUI();
};

function updateStatusUI() {
  const box = document.getElementById("statusDisplay");
  if (!petData) return;

  box.className = petData.petStatus === "lost" ? "statusBox lost" : "statusBox safe";
  box.innerText = petData.petStatus === "lost" ? "Status: LOST" : "Status: SAFE";
}

/* TOGGLES */
window.togglePetNameEdit = () => {
  const i = document.getElementById("petNameInput");
  i.style.display = i.style.display === "block" ? "none" : "block";
  i.value = petData.name || "";
};

window.toggleMicrochipEdit = () => {
  const i = document.getElementById("microchipInput");
  i.style.display = i.style.display === "block" ? "none" : "block";
  i.value = petData.microchip || "";
};

/* FILE */
document.getElementById("fileInput").addEventListener("change", (e) => {
  selectedFile = e.target.files[0];
});

/* SAVE */
window.save = async () => {

  const btn = document.getElementById("saveBtn");
  btn.disabled = true;

  let photoURL = petData.photo || "";

  if (selectedFile) {
    photoURL = await uploadToCloudinary(selectedFile);
  }

  const nameVal = document.getElementById("petNameInput").style.display === "block"
    ? document.getElementById("petNameInput").value
    : petData.name;

  const chipVal = document.getElementById("microchipInput").style.display === "block"
    ? document.getElementById("microchipInput").value
    : petData.microchip;

  await updateDoc(ref, {
    phone: document.getElementById("phone").value,
    phone2: document.getElementById("phone2").value,
    photo: photoURL,
    name: nameVal,
    microchip: chipVal,
    updatedAt: new Date()
  });

  document.getElementById("preview").src = photoURL;
  btn.disabled = false;
};

load();
</script>

</body>
</html>
