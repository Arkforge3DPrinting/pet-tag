<!DOCTYPE html>
<html>
<head>
  <title>Create Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 18px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
    }

    input {
      border: 1px solid #ddd;
    }

    button {
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Create Pet Tag</h2>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Phone">
  <input id="phone2" placeholder="Secondary (optional)">

  <button id="createBtn">Generate & Save</button>

  <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user = null;
let authReady = false;

/* IMPORTANT: persist session */
await setPersistence(auth, browserLocalPersistence);

/* WAIT FOR AUTH PROPERLY */
await new Promise(resolve => {
  const unsub = onAuthStateChanged(auth, (u) => {
    user = u;
    authReady = true;
    unsub();
    resolve(u);
  });
});

/* ID GENERATOR */
function idGen(len = 10) {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  return Array.from({ length: len }, () =>
    chars[Math.floor(Math.random() * chars.length)]
  ).join("");
}

/* CREATE */
document.getElementById("createBtn").onclick = async () => {

  const status = document.getElementById("status");

  // wait until auth is actually ready
  if (!authReady) {
    status.innerText = "Loading authentication...";
    return;
  }

  // FINAL truth check (this is the important part)
  if (!auth.currentUser) {
    status.innerText = "Not logged in. Please refresh or sign in again.";
    return;
  }

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();

  if (!name || !phone) {
    status.innerText = "Enter name and phone";
    return;
  }

  const id = idGen();

  const url =
    `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`;

  try {

    await setDoc(doc(db, "pets", id), {
      name,
      phone,
      phone2: phone2 || "",
      photo: "https://res.cloudinary.com/ddsp7ps7p/image/upload/v1776062761/placeholderpaw_a29ok1.jpg",
      status: "inactive",
      createdAt: new Date().toISOString()
    });

    status.innerHTML =
      `✅ Created<br><b>ID:</b> ${id}<br>${url}`;

  } catch (e) {
    status.innerText = "Error: " + e.message;
  }
};

</script>

</body>
</html>
