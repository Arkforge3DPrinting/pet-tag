<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Manage Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 460px;
      margin: auto;
      background: linear-gradient(180deg, #ffffff, #fbfcfd);
      padding: 16px;
      border-radius: 22px;
      border: 1px solid rgba(59,130,246,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
      text-align: center;
    }

    p {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 10px;
    }

    .contextBox {
      margin: 10px auto 14px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #eef6ff;
      border: 1px solid rgba(59,130,246,0.25);
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      color: #1f2937;
    }

    .smallId {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
    }

    .section {
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    label {
      font-size: 12px;
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #444;
    }

    /* =========================
       FIXED INPUT STYLE (THIS IS THE CHANGE)
    ========================= */
    input {
      width: 100%;
      padding: 10px 11px;   /* was 12px */
      border-radius: 10px;
      border: 1px solid #e5e7eb; /* softer */
      font-size: 13px;      /* was 14px */
      margin-bottom: 6px;   /* reduced */
      background: #fff;
      box-sizing: border-box;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: rgba(59,130,246,0.5);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-top: 8px;
    }

    .lostBtn { background: #ef4444; }
    .safeBtn { background: #28c76f; }
    .saveBtn { background: #3b82f6; }

    .statusBox {
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 10px;
    }

    .safe { background: #eafff1; color: #1a7f3c; }
    .lost { background: #ffecec; color: #a31212; }

    .photoWrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #preview {
      width: 160px;
      height: 160px;
      border-radius: 18px;
      object-fit: cover;
      border: 3px solid rgba(34,197,94,0.35);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.12);
      animation: pulseGlow 2.8s infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
      50% { box-shadow: 0 0 18px rgba(34,197,94,0.35); }
      100% { box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
    }

    .photoBtns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .photoBtn {
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
    }

    .photoBtn.cam { background: #f97316; }
    .photoBtn.up { background: #2563eb; }

    input[type="file"] { display: none; }

    .fileInfo {
      font-size: 12px;
      color: #555;
      text-align: center;
      margin-top: 6px;
    }

    .uploadProgressWrap {
      width: 100%;
      margin-top: 6px;
      display: none;
    }

    .progressBar {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progressFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#3b82f6,#22c55e);
      transition: width 0.2s ease;
    }

    .uploadText {
      font-size: 12px;
      text-align: center;
      margin-top: 6px;
      color: #2563eb;
      font-weight: 700;
    }

    .microchipBox {
      margin-top: 8px;
      padding: 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 13px;
      font-family: monospace;
    }

    .microchipEditToggle {
      margin-top: 6px;
      font-size: 12px;
      color: #2563eb;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      user-select: none;
    }

    #microchipInput,
    #petNameInput {
      display: none;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .successMsg {
      margin-top: 12px;
      font-weight: 900;
      color: #16a34a;
      text-align: center;
      display: none;
    }

    .successSub {
      font-size: 12px;
      color: #15803d;
      text-align: center;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Manage Portal PLS 3</h1>
  <p>Update your pet’s details instantly</p>

  <div class="contextBox">
    You are editing: <span id="petNameLabel">Loading...</span><br>
    <span class="smallId">Tag ID: <span id="tagIdLabel"></span></span>
  </div>

  <div id="statusDisplay" class="statusBox">Loading...</div>

  <div class="section">
    <label>Status</label>
    <button class="lostBtn" onclick="setStatus('lost')">🔴 Mark as Lost</button>
    <button class="safeBtn" onclick="setStatus('safe')">🟢 Mark as Safe</button>
  </div>

  <div class="section">
    <label>Primary Phone</label>
    <input id="phone">

    <label>Secondary Phone</label>
    <input id="phone2">
  </div>

  <div class="section">
    <label>Pet Name</label>
    <div class="microchipEditToggle" onclick="togglePetNameEdit()">Update pet name</div>
    <input id="petNameInput">
  </div>

  <div class="section">
    <label>Microchip</label>
    <div class="microchipBox" id="microchipDisplay">Loading...</div>
    <div class="microchipEditToggle" onclick="toggleMicrochipEdit()">Update microchip</div>
    <input id="microchipInput">
  </div>

  <div class="section">
    <label>Photo</label>

    <div class="photoWrap">
      <img id="preview">

      <div class="photoBtns">
        <button class="photoBtn cam" onclick="openCamera()">📷 Camera</button>
        <button class="photoBtn up" onclick="openGallery()">📁 Upload</button>
      </div>

      <input type="file" id="fileInput" accept="image/*">
      <div class="fileInfo" id="fileInfo"></div>

      <div class="uploadProgressWrap" id="uploadBox">
        <div class="progressBar">
          <div class="progressFill" id="progressFill"></div>
        </div>
        <div class="uploadText" id="uploadText"></div>
      </div>

    </div>
  </div>

  <button class="saveBtn" id="saveBtn" onclick="save()">💾 Save Changes</button>

  <div class="successMsg" id="successMsg">Saved successfully</div>
  <div class="successSub" id="successSub">Please reload if needed.</div>

</div>

<script type="module">
/* unchanged JS */
</script>

</body>
</html>
