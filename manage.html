<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Manage Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 460px;
      margin: auto;
      background: linear-gradient(180deg, #ffffff, #fbfcfd);
      padding: 16px;
      border-radius: 22px;
      border: 1px solid rgba(59,130,246,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
      text-align: center;
    }

    p {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 10px;
    }

    .contextBox {
      margin: 10px auto 14px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #eef6ff;
      border: 1px solid rgba(59,130,246,0.25);
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      color: #1f2937;
    }

    .smallId {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
    }

    .section {
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    label {
      font-size: 12px;
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #444;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-top: 8px;
    }

    .lostBtn { background: #ef4444; }
    .safeBtn { background: #28c76f; }
    .saveBtn { background: #3b82f6; }

    .statusBox {
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 10px;
    }

    .safe { background: #eafff1; color: #1a7f3c; }
    .lost { background: #ffecec; color: #a31212; }

    .microchipBox {
      margin-top: 8px;
      padding: 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 13px;
      font-family: monospace;
    }

    .microchipEditToggle {
      margin-top: 6px;
      font-size: 12px;
      color: #2563eb;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      user-select: none;
    }

    #microchipInput,
    #petNameInput {
      display: none;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #saveProgressWrap {
      margin-top: 12px;
      display: none;
    }

    #saveProgressBar {
      height: 10px;
      width: 0%;
      background: #3b82f6;
      border-radius: 999px;
      transition: 0.25s ease;
    }

    .barOuter {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .successMsg {
      margin-top: 12px;
      font-weight: 900;
      color: #16a34a;
      text-align: center;
      display: none;
    }

    .successSub {
      font-size: 12px;
      color: #15803d;
      text-align: center;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>ArkLink ID Tag - Owner Portal</h1>

  <div class="contextBox">
    You are editing: <span id="petNameLabel">Loading...</span><br>
    <span class="smallId">Tag ID: <span id="tagIdLabel"></span></span>
  </div>

  <div id="statusDisplay" class="statusBox">Loading...</div>

  <div class="section">
    <button class="lostBtn" onclick="setStatus('lost')">🔴 Mark as Lost</button>
    <button class="safeBtn" onclick="setStatus('safe')">🟢 Mark as Safe</button>
  </div>

  <div class="section">
    <label>Primary Phone</label>
    <input id="phone">

    <label>Secondary Phone</label>
    <input id="phone2">
  </div>

  <div class="section">
    <label>Microchip</label>
    <div class="microchipBox" id="microchipDisplay">Loading...</div>

    <input id="microchipInput" placeholder="Edit microchip">
  </div>

  <button class="saveBtn" id="saveBtn" onclick="save()">💾 Save Changes</button>

  <div id="saveProgressWrap">
    <div style="margin-bottom:6px;font-size:12px;" id="saveProgressText">Preparing...</div>
    <div class="barOuter">
      <div id="saveProgressBar"></div>
    </div>
  </div>

  <div class="successMsg" id="successMsg">Saved!</div>
  <div class="successSub" id="successSub">You can close this page.</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);
const id = new URLSearchParams(location.search).get("id");
const ref = doc(db, "pets", id);

let petData = null;

function setProgress(p, text) {
  document.getElementById("saveProgressWrap").style.display = "block";
  document.getElementById("saveProgressBar").style.width = p + "%";
  document.getElementById("saveProgressText").innerText = text;
}

/* LOAD FIXED */
async function load() {
  const snap = await getDoc(ref);
  if (!snap.exists()) return;

  petData = snap.data();

  document.getElementById("petNameLabel").innerText = petData.name || "Unknown";
  document.getElementById("tagIdLabel").innerText = id;

  document.getElementById("phone").value = petData.phone || "";
  document.getElementById("phone2").value = petData.phone2 || "";

  document.getElementById("microchipDisplay").innerText =
    petData.microchip || "Not set";

  updateStatusUI();
}

/* STATUS */
window.setStatus = async (status) => {
  await updateDoc(ref, {
    petStatus: status,
    updatedAt: new Date()
  });

  petData.petStatus = status;
  updateStatusUI();
};

function updateStatusUI() {
  const box = document.getElementById("statusDisplay");

  if (petData?.petStatus === "lost") {
    box.className = "statusBox lost";
    box.innerText = "Status: LOST";
  } else {
    box.className = "statusBox safe";
    box.innerText = "Status: SAFE";
  }
}

/* SAVE FIXED */
window.save = async () => {
  const btn = document.getElementById("saveBtn");

  if (btn.disabled) return;
  btn.disabled = true;

  try {
    setProgress(10, "Saving...");

    await updateDoc(ref, {
      phone: document.getElementById("phone").value,
      phone2: document.getElementById("phone2").value,
      microchip: document.getElementById("microchipInput").value || petData.microchip,
      updatedAt: new Date()
    });

    setProgress(100, "Done");

    document.getElementById("successMsg").style.display = "block";
    document.getElementById("successSub").style.display = "block";

  } finally {
    btn.disabled = false;
  }
};

load();   // ✅ FIXED (was loadPet)
</script>

</body>
</html>
