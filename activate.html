<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Activate Ark Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h2 { margin-bottom: 4px; }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
    }

    .camera { background: #ff9f43; }
    .gallery { background: #3b82f6; }
    .activate { background: #3b82f6; font-size: 18px; }

    .tos-box {
      text-align: left;
      font-size: 13px;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      margin: 12px 0;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
      min-height: 20px;
    }

    .error { color: #d11a2a; }
    .ok { color: #0a7a2f; }
  </style>
</head>

<body>

<div class="container">

  <h2>Activate Pet Tag</h2>

  <div class="tagid">
    Tag ID: <span id="tagIdDisplay"></span>
  </div>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">
  <input id="microchip" placeholder="Microchip number (optional)">
  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <div class="tos-box">
    <label>
      <input type="checkbox" id="tosCheckbox">
      I agree to Terms of Service and understand this profile may be publicly visible when scanned.
    </label>
  </div>

  <button class="btn activate" id="activateBtn">Activate</button>

  <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const statusEl = document.getElementById("status");
const activateBtn = document.getElementById("activateBtn");
const photoInput = document.getElementById("photoInput");

const urlId = new URLSearchParams(window.location.search).get("id");

function setStatus(msg, type = "") {
  statusEl.innerText = msg;
  statusEl.className = type;
}

if (!urlId) {
  setStatus("❌ Invalid activation link", "error");
} else {
  document.getElementById("tagIdDisplay").innerText = urlId;
}

/* CAMERA / GALLERY */
document.getElementById("cameraBtn").onclick = () => {
  photoInput.setAttribute("capture", "environment");
  photoInput.click();
};

document.getElementById("galleryBtn").onclick = () => {
  photoInput.removeAttribute("capture");
  photoInput.click();
};

/* IMAGE COMPRESSION (FIX FOR 9MB ISSUE) */
async function compressImage(file, maxMB = 2) {
  return new Promise((resolve) => {
    const reader = new FileReader();

    reader.onload = (e) => {
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement("canvas");

        const scale = Math.sqrt((maxMB * 1024 * 1024) / file.size);

        canvas.width = img.width * scale;
        canvas.height = img.height * scale;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name, { type: "image/jpeg" }));
        }, "image/jpeg", 0.85);
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}

let isRunning = false;

activateBtn.onclick = async () => {

  /* FIXED: validation BEFORE locking UI */
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();
  const tos = document.getElementById("tosCheckbox").checked;

  if (!name || !phone) {
    setStatus("⚠ Fill required fields", "error");
    return;
  }

  if (!tos) {
    setStatus("⚠ Please accept Terms of Service", "error");
    return;
  }

  if (isRunning) return;
  isRunning = true;

  activateBtn.disabled = true;
  activateBtn.innerText = "⏳ Activating...";

  try {

    const ref = doc(db, "pets", urlId);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      throw new Error("Tag not found in database");
    }

    const existing = snap.data();

    let photoURL = "";
    let file = photoInput.files[0];

    /* FIX: compress large images */
    if (file) {
      setStatus("Optimising image...");
      file = await compressImage(file, 2);
    }

    /* UPLOAD */
    if (file) {

      setStatus("📤 Uploading photo...");

      const form = new FormData();
      form.append("file", file);
      form.append("upload_preset", "arkforge-pets");

      const res = await fetch(
        "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",
        { method: "POST", body: form }
      );

      const data = await res.json();

      /* FIX: proper error handling */
      if (!res.ok || !data.secure_url) {
        console.error(data);
        throw new Error("Photo upload failed (file may be too large)");
      }

      photoURL = data.secure_url;
    }

    setStatus("💾 Saving profile...");

    const payload = {
      name,
      phone,
      phone2: phone2 || existing.phone2 || "",
      microchip: document.getElementById("microchip").value.trim() || existing.microchip || "",
      photo: photoURL || existing.photo || "",
      status: "active",
      tosAccepted: true,
      activatedAt: new Date().toISOString()
    };

    await setDoc(ref, payload, { merge: true });

    setStatus("🎉 Activated successfully! Redirecting...", "ok");

    setTimeout(() => {
      window.location.href =
        `https://arkforge3dprinting.github.io/pet-tag/index.html?id=${urlId}`;
    }, 3000);

    activateBtn.innerText = "Activated";

  } catch (err) {

    console.error(err);
    setStatus("❌ " + err.message, "error");

    isRunning = false;
    activateBtn.disabled = false;
    activateBtn.innerText = "Activate";
  }
};

</script>

</body>
</html>
