<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard v5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    h2 { margin-bottom: 10px; }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filters button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #ddd;
      cursor: pointer;
      font-weight: bold;
    }

    .filters button.active {
      background: #3b82f6;
      color: white;
    }

    .card {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .badges { margin-bottom: 10px; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-right: 5px;
    }

    .green { background: #dcfce7; color: #166534; }
    .red { background: #fee2e2; color: #991b1b; }
    .orange { background: #ffedd5; color: #9a3412; }
    .blue { background: #dbeafe; color: #1d4ed8; }
    .purple { background: #ede9fe; color: #5b21b6; }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .row input {
      flex: 1;
      min-width: 200px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .buttons button {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .saveBtn { background: #3b82f6; color: white; }
    .disableBtn { background: #7c3aed; color: white; }
    .deleteBtn { background: #ef4444; color: white; }
    .undoBtn { background: #16a34a; color: white; }

    .auditPanel {
      margin-top: 30px;
      background: white;
      padding: 14px;
      border-radius: 14px;
    }

    .auditItem {
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }

  </style>
</head>

<body>

<h2>🐾 Arkforge Admin Dashboard</h2>

<input id="search" placeholder="Search Tag ID or Pet Name...">

<div class="filters">

  <button class="active" onclick="setFilter('all', this)">All</button>
  <button onclick="setFilter('inactive', this)">Inactive</button>
  <button onclick="setFilter('active', this)">Active</button>
  <button onclick="setFilter('disabled', this)">Disabled</button>

  <button onclick="toggleWorkMode(this)">⚡ Work Mode</button>

</div>

<div id="list"></div>

<div class="auditPanel">
  <h3>📜 Audit Log</h3>
  <div id="auditList">Loading...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);
const auth = getAuth(app);

let pets = [];
let audit = [];
let filter = "all";
let search = "";
let workMode = false;

const list = document.getElementById("list");
const auditList = document.getElementById("auditList");

onAuthStateChanged(auth, u => {
  if (!u) return (location.href = "login.html");
  listen();
  listenAudit();
});

function listen() {
  onSnapshot(collection(db, "pets"), snap => {
    pets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

function listenAudit() {
  onSnapshot(collection(db, "audit_logs"), snap => {
    audit = snap.docs.map(d => d.data());
    renderAudit();
  });
}

function log(action, id) {
  addDoc(collection(db, "audit_logs"), {
    action,
    tagId: id,
    time: serverTimestamp()
  });
}

window.setFilter = (f, btn) => {
  filter = f;
  document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
};

window.toggleWorkMode = (btn) => {
  workMode = !workMode;
  btn.classList.toggle("active");
};

function render() {

  list.innerHTML = "";

  pets
    .filter(p => {
      if (search &&
        !p.id.toLowerCase().includes(search) &&
        !(p.name || "").toLowerCase().includes(search)) return false;

      if (workMode) return !p.activatedAt;

      if (filter === "disabled") return p.status === "disabled";
      if (filter === "active") return p.activatedAt;
      if (filter === "inactive") return !p.activatedAt;

      return true;
    })
    .forEach(p => {

      const div = document.createElement("div");
      div.className = "card";

      const status =
        p.status === "disabled"
          ? `<span class="badge purple">Disabled</span>`
          : p.activatedAt
            ? `<span class="badge green">Active</span>`
            : `<span class="badge red">Inactive</span>`;

      div.innerHTML = `
        <div class="meta"><b>${p.id}</b></div>
        <div class="badges">${status}</div>

        <div class="row">
          <input id="n-${p.id}" value="${p.name || ""}">
          <input id="p-${p.id}" value="${p.phone || ""}">
        </div>

        <div class="buttons">

          <button class="saveBtn" onclick="save('${p.id}')">Save</button>

          <button class="disableBtn" onclick="toggle('${p.id}', '${p.status || ""}')">
            ${p.status === "disabled" ? "Enable" : "Disable"}
          </button>

          <button class="undoBtn" onclick="restore('${p.id}')">Undo</button>

          <button class="deleteBtn" onclick="remove('${p.id}')">Delete</button>

        </div>
      `;

      list.appendChild(div);
    });
}

function renderAudit() {
  auditList.innerHTML = audit.slice(-20).reverse().map(a =>
    `<div class="auditItem">
      ${a.action} → ${a.tagId}
    </div>`
  ).join("");
}

window.save = async (id) => {
  await updateDoc(doc(db, "pets", id), {
    name: document.getElementById("n-" + id).value,
    phone: document.getElementById("p-" + id).value
  });
  log("update", id);
};

window.toggle = async (id, status) => {
  const disabling = status !== "disabled";

  await updateDoc(doc(db, "pets", id), {
    status: disabling ? "disabled" : "active"
  });

  log(disabling ? "disabled" : "enabled", id);
};

window.restore = async (id) => {
  await updateDoc(doc(db, "pets", id), {
    status: "active"
  });
  log("restore", id);
};

window.remove = async (id) => {
  if (!confirm("Delete?")) return;
  await deleteDoc(doc(db, "pets", id));
  log("delete", id);
};

document.getElementById("search").oninput = e => {
  search = e.target.value.toLowerCase();
  render();
};

</script>

</body>
</html>
