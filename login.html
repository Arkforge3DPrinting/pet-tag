<!DOCTYPE html>
<html>
<head>
  <title>Admin Login Portal</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f6f8, #e9eef5);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 26px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .brand {
      margin-bottom: 18px;
    }

    .brand h1 {
      font-size: 20px;
      margin: 0;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #777;
    }

    h2 {
      margin-bottom: 18px;
      font-size: 18px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #togglePw {
      margin-top: 6px;
      margin-bottom: 10px;
      background: #eee;
      color: #333;
      font-weight: normal;
    }

    #status {
      margin-top: 14px;
      font-size: 13px;
      color: #555;
      min-height: 18px;
      word-break: break-word;
    }

  </style>
</head>

<body>

<div class="card">

  <!-- BRAND -->
  <div class="brand">
    <h1>Arkforge 3D Printing</h1>
    <p>Admin Control Panel</p>
  </div>

  <h2>🔐 Login</h2>

  <input id="email" placeholder="Email">

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button id="togglePw" type="button">
    👁 Show Password
  </button>

  <button id="loginBtn">
    Login
  </button>

  <p id="status"></p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// FIREBASE CONFIG
const firebaseConfig = {

  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",

  authDomain: "arkforge-pets.firebaseapp.com",

  projectId: "arkforge-pets"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

// ELEMENTS
const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const status =
  document.getElementById("status");

const btn =
  document.getElementById("loginBtn");

// LOGIN
btn.onclick = async () => {

  const em =
    email.value.trim();

  const pw =
    password.value;

  if (!em || !pw) {

    status.innerText =
      "Please enter email and password";

    return;
  }

  btn.disabled = true;

  btn.innerText =
    "Logging in...";

  status.innerText =
    "Authenticating...";

  try {

    await signInWithEmailAndPassword(
      auth,
      em,
      pw
    );

    status.innerText =
      "Success! Redirecting...";

    setTimeout(() => {

      window.location.href =
        "admin.html";

    }, 700);

  } catch (e) {

    status.innerText =
      e.code + " - " + e.message;

  } finally {

    btn.disabled = false;

    btn.innerText =
      "Login";

  }

};

// ENTER KEY SUPPORT
document.addEventListener("keydown", (e) => {

  if (e.key === "Enter") {

    btn.click();

  }

});

// SHOW/HIDE PASSWORD
document.getElementById("togglePw").onclick = () => {

  if (password.type === "password") {

    password.type = "text";

    document.getElementById("togglePw").innerText =
      "🙈 Hide Password";

  } else {

    password.type = "password";

    document.getElementById("togglePw").innerText =
      "👁 Show Password";

  }

};

</script>

</body>
</html>
