<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
</head>

<body style="font-family: Arial; text-align:center; padding:20px;">

<h2>Activate Your Pet Tag</h2>

<p><b>Tag Code:</b> <span id="tagId"></span></p>

<input id="name" placeholder="Pet Name"><br><br>
<input id="microchip" placeholder="000000000000000"><br><br>  
<input id="phone" placeholder="Your Phone Number"><br><br>

<p style="margin-bottom:5px;">
  <b>📸 Upload a picture of your pet</b><br>
  <span style="font-size:12px; color:gray;">
    This helps people identify your pet if found
  </span>
</p>

<input type="file" id="photo" accept="image/*"><br><br>

<button id="activateBtn">Activate</button>
<progress id="uploadProgress" value="0" max="100" style="width:100%; display:none;"></progress>
<p id="progressText"></p>  

<p id="status"></p>

<script type="module">
const cloudName = "ddsp7ps7p";
const uploadPreset = "arkforge-pets";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// 🔥 YOUR REAL CONFIG HERE
const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🧠 Get tag ID from URL
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// Show ID on page
if (!id) {
  document.getElementById("status").innerText = "Invalid tag link";
  throw new Error("Missing ID");
}

document.getElementById("tagId").innerText = id;

// 🚀 Activate button
document.getElementById("activateBtn").onclick = async () => {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const file = document.getElementById("photo").files[0];

  if (!name || !phone) {
    document.getElementById("status").innerText = "Please fill all fields";
    return;
  }

  try {
    document.getElementById("status").innerText = "Uploading...";

    let photoURL = "";

    // 📸 Upload photo if provided
if (file) {
  document.getElementById("status").innerText = "Uploading image...";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", uploadPreset);

  const xhr = new XMLHttpRequest();

  xhr.open(
    "POST",
    "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload"
  );

  // show progress UI
  const progressBar = document.getElementById("uploadProgress");
  const progressText = document.getElementById("progressText");

  progressBar.style.display = "block";

  xhr.upload.onprogress = (event) => {
    if (event.lengthComputable) {
      const percent = Math.round((event.loaded / event.total) * 100);

      progressBar.value = percent;
      progressText.innerText = `Uploading: ${percent}%`;
    }
  };

  const response = await new Promise((resolve, reject) => {
    xhr.onload = () => resolve(JSON.parse(xhr.responseText));
    xhr.onerror = () => reject("Upload failed");
    xhr.send(formData);
  });

  photoURL = response.secure_url;
}
    // 💾 Save pet data
    await setDoc(doc(db, "pets", id), {
      name: name,
      phone: phone,
      photo: photoURL
    });

    document.getElementById("status").innerText = "✅ Activated successfully!";

  } catch (e) {
    console.log(e);
    document.getElementById("status").innerText = "❌ " + e.message;
  }
};

</script>

</body>
</html>
