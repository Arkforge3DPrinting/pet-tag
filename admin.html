<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard v5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    h2 { margin-bottom: 12px; }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filters button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #ddd;
      cursor: pointer;
      font-weight: bold;
    }

    .filters button.active {
      background: #3b82f6;
      color: white;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-right: 5px;
    }

    .green { background:#dcfce7; color:#166534; }
    .red { background:#fee2e2; color:#991b1b; }
    .orange { background:#ffedd5; color:#9a3412; }
    .blue { background:#dbeafe; color:#1d4ed8; }
    .purple { background:#ede9fe; color:#5b21b6; }

    .row {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:10px;
    }

    .row input {
      flex:1;
      min-width:200px;
      padding:10px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    .buttons {
      display:flex;
      gap:8px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .buttons button {
      flex:1;
      min-width:120px;
      padding:10px;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .saveBtn { background:#3b82f6; color:white; }
    .disableBtn { background:#7c3aed; color:white; }
    .restoreBtn { background:#10b981; color:white; }
    .deleteBtn { background:#ef4444; color:white; }

    .footer {
      display:flex;
      justify-content:space-between;
      margin-top:12px;
    }

    .leftSide img {
      width:100px;
      border-radius:10px;
    }

    .audit {
      font-size:11px;
      background:#111827;
      color:white;
      padding:10px;
      border-radius:10px;
      margin-top:20px;
      max-height:200px;
      overflow:auto;
    }
  </style>
</head>

<body>

<h2>🐾 Arkforge Admin Dashboard</h2>

<input id="search" placeholder="Search Tag ID or Pet Name...">

<div class="filters">

  <button class="active" onclick="setFilter('all', this)">All</button>
  <button onclick="setFilter('active', this)">Active</button>
  <button onclick="setFilter('inactive', this)">Inactive</button>
  <button onclick="setFilter('disabled', this)">Disabled</button>
  <button onclick="setFilter('deleted', this)">Deleted</button>
  <button onclick="setFilter('missingPhoto', this)">No Photo</button>
  <button onclick="setFilter('missingSecondary', this)">No Secondary</button>

</div>

<div id="list"></div>

<h3>📜 Audit Log</h3>
<div class="audit" id="audit"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let pets = [];
let filter = "all";
let search = "";

const list = document.getElementById("list");
const audit = document.getElementById("audit");

function log(msg) {
  audit.innerHTML = msg + "<br>" + audit.innerHTML;
}

/* AUTH FIX (no loop) */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  listen();
});

function listen() {
  onSnapshot(collection(db, "pets"), (snap) => {
    pets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

window.setFilter = (f, btn) => {
  filter = f;
  document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
};

document.getElementById("search").oninput = (e) => {
  search = e.target.value.toLowerCase();
  render();
};

function makeQR(id, el) {
  new QRCode(el, {
    text: `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`,
    width: 90,
    height: 90
  });
}

function render() {
  list.innerHTML = "";

  const filtered = pets.filter(p => {

    if (!p.id.includes(search) && !(p.name||"").toLowerCase().includes(search))
      return false;

    if (filter === "active") return p.status === "active";
    if (filter === "inactive") return !p.activatedAt;
    if (filter === "disabled") return p.status === "disabled";
    if (filter === "deleted") return p.status === "deleted";
    if (filter === "missingPhoto") return !p.photo;
    if (filter === "missingSecondary") return !p.phone2;

    return true;
  });

  filtered.forEach(p => {

    const div = document.createElement("div");
    div.className = "card";

    const statusBadge =
      p.status === "disabled"
        ? `<span class="badge purple">Disabled</span>`
        : p.status === "deleted"
        ? `<span class="badge red">Deleted</span>`
        : p.activatedAt
        ? `<span class="badge green">Active</span>`
        : `<span class="badge orange">Inactive</span>`;

    div.innerHTML = `
      <div class="meta"><b>${p.id}</b></div>

      ${statusBadge}

      <div class="row">
        <input id="n-${p.id}" value="${p.name||""}">
        <input id="p-${p.id}" value="${p.phone||""}">
        <input id="p2-${p.id}" value="${p.phone2||""}">
      </div>

      <div class="footer">
        <div class="leftSide">
          ${p.photo ? `<img src="${p.photo}">` : ""}
        </div>
        <div id="qr-${p.id}"></div>
      </div>

      <div class="buttons">
        <button class="saveBtn" onclick="save('${p.id}')">Save</button>

        <button class="disableBtn" onclick="toggle('${p.id}','${p.status||""}')">
          ${p.status==="disabled"?"Re-enable":"Disable"}
        </button>

        <button class="restoreBtn" onclick="restore('${p.id}')">
          Undo Delete
        </button>

        <button class="deleteBtn" onclick="softDelete('${p.id}')">
          Delete
        </button>
      </div>
    `;

    list.appendChild(div);

    setTimeout(() => {
      makeQR(p.id, document.getElementById("qr-"+p.id));
    },0);
  });
}

window.save = async (id) => {
  await updateDoc(doc(db,"pets",id),{
    name:document.getElementById("n-"+id).value,
    phone:document.getElementById("p-"+id).value,
    phone2:document.getElementById("p2-"+id).value
  });
  log("Saved "+id);
};

window.toggle = async (id, status) => {
  await updateDoc(doc(db,"pets",id),{
    status: status==="disabled" ? "active" : "disabled"
  });
  log("Toggled "+id);
};

window.softDelete = async (id) => {
  await updateDoc(doc(db,"pets",id),{
    status:"deleted"
  });
  log("Soft deleted "+id);
};

window.restore = async (id) => {
  await updateDoc(doc(db,"pets",id),{
    status:"active"
  });
  log("Restored "+id);
};

</script>

</body>
</html>
