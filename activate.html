<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
    }

    .camera { background: #ff9f43; }
    .gallery { background: #3b82f6; }
    .activate { background: #3b82f6; font-size: 18px; }

    .tos-box {
      text-align: left;
      font-size: 13px;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      margin: 12px 0;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Activate Pet Tag</h2>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">

  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <div class="tos-box">
    <label>
      <input type="checkbox" id="tosCheckbox">
      I agree to Terms of Service and understand this pet profile may be publicly visible when scanned.
    </label>
  </div>

  <button class="btn activate" id="activateBtn">Activate</button>

  <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔑 ID from URL (CRITICAL)
const id = new URLSearchParams(window.location.search).get("id");

const status = document.getElementById("status");

if (!id) {
  status.innerText = "❌ Invalid activation link";
  throw new Error("Missing ID");
}

const photoInput = document.getElementById("photoInput");

// camera / gallery
document.getElementById("cameraBtn").onclick = () => {
  photoInput.setAttribute("capture", "environment");
  photoInput.click();
};

document.getElementById("galleryBtn").onclick = () => {
  photoInput.removeAttribute("capture");
  photoInput.click();
};

// MAIN ACTIVATION
document.getElementById("activateBtn").onclick = async () => {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();
  const tos = document.getElementById("tosCheckbox").checked;

  if (!name || !phone) {
    status.innerText = "⚠ Fill required fields";
    return;
  }

  if (!tos) {
    status.innerText = "⚠ Accept Terms of Service";
    return;
  }

  try {

    // 🔒 HARD LOCK: must already exist
    const ref = doc(db, "pets", id);
    const existingSnap = await getDoc(ref);

    if (!existingSnap.exists()) {
      status.innerText = "❌ This tag is not registered";
      return;
    }

    const existing = existingSnap.data();

    let photoURL = "";
    const file = photoInput.files[0];

    // upload only if new file exists
    if (file) {

      const form = new FormData();
      form.append("file", file);
      form.append("upload_preset", "arkforge-pets");

      const res = await fetch(
        "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",
        { method: "POST", body: form }
      );

      const data = await res.json();
      photoURL = data.secure_url;
    }

    // 🧠 SAFE MERGE (prevents wiping placeholder image)
    const payload = {
      name,
      phone,
      phone2: phone2 || existing.phone2 || "",
      photo: photoURL || existing.photo || "https://res.cloudinary.com/ddsp7ps7p/image/upload/v1776062761/placeholderpaw_a29ok1.jpg",
      tosAccepted: true,
      activatedAt: new Date().toISOString()
    };

    await setDoc(ref, payload, { merge: true });

    status.innerText = "✅ Activated successfully!";

  } catch (e) {
    status.innerText = "❌ " + e.message;
  }

};

</script>

</body>
</html>
