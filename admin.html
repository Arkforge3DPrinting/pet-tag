<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    h2 { margin-bottom: 12px; }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filters button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ddd;
      font-weight: bold;
    }

    .filters button.active {
      background: #3b82f6;
      color: white;
    }

    .card {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 160px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.action {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }

    button.disable {
      background: #7c3aed;
    }
  </style>
</head>

<body>

<h2>🐾 Admin Dashboard</h2>

<input id="search" placeholder="Search ID, name, phone...">

<div class="filters">
  <button class="active" onclick="setFilter('all', this)">All</button>
  <button onclick="setFilter('active', this)">Active</button>
  <button onclick="setFilter('inactive', this)">Inactive</button>
  <button onclick="setFilter('disabled', this)">Disabled</button>
</div>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  getDoc,
  query
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* ================= FIREBASE ================= */

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ================= STATE ================= */

let pets = [];
let filter = "all";
let search = "";
let started = false;

const listDiv = document.getElementById("list");

/* ================= AUTH GATE (CRITICAL) ================= */

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  if (!started) {
    started = true;
    startFirestore();
  }
});

/* ================= FIRESTORE ================= */

function startFirestore() {

  const q = query(collection(db, "pets"));

  onSnapshot(q, (snap) => {

    pets = [];

    snap.forEach(d => {
      pets.push({ id: d.id, ...d.data() });
    });

    render();
  });
}

/* ================= SEARCH ================= */

document.getElementById("search").addEventListener("input", (e) => {
  search = (e.target.value || "").toLowerCase();
  render();
});

/* ================= FILTER ================= */

window.setFilter = (f, btn) => {

  filter = f;

  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  render();
};

/* ================= SAVE ================= */

window.savePet = async (id) => {

  const ref = doc(db, "pets", id);
  const snap = await getDoc(ref);

  const after = {
    name: document.getElementById("name-" + id).value,
    phone: document.getElementById("phone-" + id).value,
    phone2: document.getElementById("phone2-" + id).value
  };

  await updateDoc(ref, after);
};

/* ================= DISABLE / ENABLE ================= */

window.toggleDisable = async (id) => {

  const ref = doc(db, "pets", id);
  const snap = await getDoc(ref);

  const data = snap.data();

  const newStatus =
    data.status === "disabled" ? "active" : "disabled";

  await updateDoc(ref, { status: newStatus });
};

/* ================= RENDER ================= */

function render() {

  listDiv.innerHTML = "";

  const s = search || "";

  const filtered = pets.filter(p => {

    const match =
      (p.id || "").includes(s) ||
      (p.name || "").toLowerCase().includes(s) ||
      (p.phone || "").includes(s) ||
      (p.phone2 || "").includes(s);

    if (!match) return false;

    if (filter === "active")
      return p.status === "active";

    if (filter === "inactive")
      return !p.status || p.status === "inactive";

    if (filter === "disabled")
      return p.status === "disabled";

    return true;
  });

  if (filtered.length === 0) {
    listDiv.innerHTML = "<p>No pets found.</p>";
    return;
  }

  filtered.forEach(p => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="meta"><b>${p.id}</b></div>

      <div class="row">
        <input id="name-${p.id}" value="${p.name || ""}">
        <input id="phone-${p.id}" value="${p.phone || ""}">
        <input id="phone2-${p.id}" value="${p.phone2 || ""}">
      </div>

      <div class="buttons">
        <button class="action" onclick="savePet('${p.id}')">Save</button>
        <button class="action disable" onclick="toggleDisable('${p.id}')">
          ${p.status === "disabled" ? "Re-enable" : "Disable"}
        </button>
      </div>
    `;

    listDiv.appendChild(div);
  });
}

</script>

</body>
</html>
