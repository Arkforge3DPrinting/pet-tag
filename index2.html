<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArkLink Pet ID - Found Pet</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;

  background:
    radial-gradient(circle at top,#ffffff 0%,#eef4ff 30%,#dfe9f7 100%);

  color:#111827;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,rgba(59,130,246,.12),transparent 25%),
    radial-gradient(circle at 80% 10%,rgba(52,199,89,.12),transparent 25%),
    radial-gradient(circle at 50% 100%,rgba(255,159,10,.12),transparent 35%);
  pointer-events:none;
}

.container{
  max-width:460px;
  margin:auto;

  background:rgba(255,255,255,.78);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border:1px solid rgba(255,255,255,.8);

  border-radius:34px;

  box-shadow:
    0 25px 60px rgba(0,0,0,.10),
    0 4px 12px rgba(0,0,0,.04);

  overflow:hidden;

  display:none;
}

.hero{
  padding:30px 24px 22px;
  text-align:center;
}

/* UPDATED IMAGE WRAPPER (CENTER FIX) */
#petPhotoWrapper{
  position:relative;
  width:250px;
  height:250px;
  margin:0 auto 18px;

  display:flex;
  align-items:center;
  justify-content:center;
}

#petPhoto{
  width:100%;
  height:100%;
  object-fit:cover;

  border-radius:34px;

  display:block;
  opacity:0;
  transition:opacity .35s ease;

  border:6px solid white;

  box-shadow:
    0 18px 40px rgba(0,0,0,.18),
    0 0 0 1px rgba(255,255,255,.9);

  animation:floaty 6s ease-in-out infinite;
}

@keyframes floaty{
  0%{transform:translateY(0px);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0px);}
}

/* 🔥 MOVED FOUND PET TAG */
.status-pill{
  position:absolute;
  bottom:-12px;
  left:50%;
  transform:translateX(-50%);

  display:inline-flex;
  align-items:center;
  gap:8px;

  background:rgba(52,199,89,.18);
  color:#1c7a39;

  padding:10px 16px;
  border-radius:999px;

  font-size:12px;
  font-weight:800;

  animation:pulse 2.5s infinite;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  border:1px solid rgba(52,199,89,.25);
}

@keyframes pulse{
  0%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.05);}
  100%{transform:translateX(-50%) scale(1);}
}

h1{
  font-size:34px;
  font-weight:800;
  letter-spacing:-0.04em;
  margin-bottom:10px;
}

p{
  color:#6b7280;
  line-height:1.5;
  font-size:15px;
}

/* MOVED TEXT HERE (NO EXTRA LINE NOW) */
.notice{
  margin:0 20px 20px;
  padding:16px;
  border-radius:20px;
  background:rgba(59,130,246,.08);
  border:1px solid rgba(59,130,246,.15);
  font-weight:600;
  color:#234;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:0 20px 20px;
}

button{
  border:none;
  border-radius:22px;
  padding:18px 14px;
  color:white;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  min-height:78px;
  transition:.18s ease;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
}

button:hover{ transform:translateY(-3px); }
button:active{ transform:scale(.98); }
button:disabled{ opacity:.75; transform:none; }

#callBtn,#callBtn2{
  background:linear-gradient(180deg,#34c759,#28a745);
}
#textBtn,#textBtn2{
  background:linear-gradient(180deg,#0a84ff,#0066d6);
}
#locBtn,#locBtn2{
  background:linear-gradient(180deg,#ff9f0a,#e68500);
}

.footer{
  text-align:center;
  padding:10px 20px 24px;
  color:#9ca3af;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container" id="main">

  <div class="hero">

    <div id="petPhotoWrapper">
      <img id="petPhoto">
      <div class="status-pill">🐾 Found Pet</div>
    </div>

    <h1 id="title">Loading...</h1>

  </div>

  <!-- MOVED TEXT HERE -->
  <div class="notice" id="message">
    Help return this pet safely.
  </div>

  <div class="grid">

    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call 2</button>

    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text 2</button>

    <button id="locBtn">📍 Location</button>
    <button id="locBtn2">📍 Location 2</button>

  </div>

  <div class="footer">Powered by ArkLink Pet ID ®</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let pet = { name:"Pet", phone:"", phone2:"" };

function clickSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type="sine"; o.frequency.value=520;
    g.gain.value=0.08;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.08);
  }catch{}
}

function pingSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();

    o.type="sine";
    o.frequency.setValueAtTime(880,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320,ctx.currentTime+0.12);

    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.25);

    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.3);
  }catch{}
}

function startPulse(){
  const ring=document.getElementById("gpsPulse");
  if(ring) ring.classList.add("active");
}

function stopPulse(){
  const ring=document.getElementById("gpsPulse");
  if(ring) ring.classList.remove("active");
}

function gps(phone,label,btn){

  clickSound();

  btn.disabled=true;
  btn.innerText="📡 Getting GPS...";

  startPulse();

  navigator.geolocation.getCurrentPosition(pos=>{

    stopPulse();
    pingSound();

    const msg =
      "I found "+pet.name+
      ". https://maps.google.com/?q="+
      pos.coords.latitude+","+pos.coords.longitude;

    btn.disabled=false;
    btn.innerText=label;

    window.open(`sms:${phone}?body=${encodeURIComponent(msg)}`,"_self");

  },()=>{

    stopPulse();

    btn.disabled=false;
    btn.innerText=label;

    alert("GPS failed.");
  },{
    enableHighAccuracy:true,
    timeout:10000,
    maximumAge:0
  });
}

async function load(){

  document.getElementById("main").style.display="block";

  const id=new URLSearchParams(window.location.search).get("id");

  const snap=await getDoc(doc(db,"pets",id));

  if(!snap.exists()){
    document.getElementById("title").innerText="Pet not found";
    return;
  }

  pet=snap.data();

  document.getElementById("title").innerText="🐾 "+pet.name;

  const img=document.getElementById("petPhoto");

  if(pet.photo){
    img.src=pet.photo;
    img.onload=()=>img.style.opacity="1";
  }

  bind();
}

function bind(){

  document.getElementById("callBtn").onclick=()=>{
    clickSound();
    location.href="tel:"+pet.phone;
  };

  document.getElementById("callBtn2").onclick=()=>{
    clickSound();
    location.href="tel:"+pet.phone2;
  };

  document.getElementById("textBtn").onclick=()=>{
    clickSound();
    location.href=`sms:${pet.phone}?body=${encodeURIComponent("I found your pet "+pet.name)}`;
  };

  document.getElementById("textBtn2").onclick=()=>{
    clickSound();
    location.href=`sms:${pet.phone2}?body=${encodeURIComponent("I found your pet "+pet.name)}`;
  };

  document.getElementById("locBtn").onclick=(e)=>{
    gps(pet.phone,"📍 Location",e.currentTarget);
  };

  document.getElementById("locBtn2").onclick=(e)=>{
    gps(pet.phone2,"📍 Location 2",e.currentTarget);
  };
}

load();
</script>

</body>
</html>
