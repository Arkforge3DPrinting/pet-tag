<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* =========================
       ARKLINK APP SHELL v2
       NO BREAKING CHANGES
       ========================= */

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffffff, #eef3f8);
      color: #1c1c1e;
      overflow-x: hidden;
    }

    /* =========================
       SCAN INTRO OVERLAY
       ========================= */

    #scanIntro {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      animation: fadeOut 1s ease forwards;
      animation-delay: 1.4s;
    }

    .scanCircle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .scanText {
      margin-top: 14px;
      font-weight: 600;
      color: #3b82f6;
    }

    /* =========================
       LOCKED STATE
       ========================= */

    #locked {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }

    .tagbox {
      margin-top: 14px;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      text-align: left;
    }

    .tagcode {
      font-family: monospace;
      font-size: 14px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      word-break: break-all;
    }

    .tagbtn {
      display: block;
      margin-top: 10px;
      padding: 12px;
      text-align: center;
      background: #3b82f6;
      color: white;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
    }

    /* =========================
       MAIN APP CARD
       ========================= */

    .container {
      max-width: 420px;
      margin: auto;
      background: rgba(255,255,255,0.95);
      padding: 18px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.10);
      text-align: center;
      display: none;
      backdrop-filter: blur(10px);
      transform: translateY(10px);
      animation: slideIn 0.4s ease forwards;
    }

    @keyframes slideIn {
      to { transform: translateY(0); opacity: 1; }
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px 0;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 15px;
      color: #555;
      margin: 0 0 10px 0;
      line-height: 1.5;
    }

    /* =========================
       PET IMAGE HERO
       ========================= */

    #petPhoto {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 22px;
      margin: 14px auto;
      display: none;

      border: 4px solid rgba(255,255,255,0.9);
      box-shadow:
        0 0 0 3px #3b82f6,
        0 18px 40px rgba(0,0,0,0.20);
    }

    /* microchip */
    #microchipText {
      font-size: 14px;
      color: #6b7280;
      margin-top: 6px;
    }

    /* =========================
       STATUS BADGE
       ========================= */

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e8fff1;
      color: #118a3a;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 12px rgba(52,199,89,0.6);
      animation: pulse 1.6s infinite;
    }

    /* =========================
       ACTION DOCK (FLOATING)
       ========================= */

    .dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 999;
    }

    .dock button {
      border: none;
      padding: 14px;
      border-radius: 999px;
      font-weight: 600;
      color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .call { background: #22c55e; }
    .text { background: #3b82f6; }
    .loc { background: #f59e0b; }

    /* =========================
       GRID (kept for fallback buttons)
       ========================= */

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .single {
      grid-template-columns: 1fr !important;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }

    #callBtn, #callBtn2 { background: #22c55e; }
    #textBtn, #textBtn2 { background: #3b82f6; }
    #locBtn, #locBtn2 { background: #f59e0b; }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

<!-- SCAN INTRO -->
<div id="scanIntro">
  <div class="scanCircle"></div>
  <div class="scanText">Scanning ArkLink Tag...</div>
</div>

<!-- LOCKED -->
<div id="locked">
  <h2>🐾 Tag Not Activated</h2>
  <p>This pet tag must be activated before contact details are available.</p>

  <div class="tagbox">
    <div class="tagcode" id="tagCode"></div>
    <a id="tagLinkBtn" class="tagbtn" target="_blank">🔗 Activate This Tag</a>
  </div>
</div>

<!-- MAIN -->
<div class="container" id="main">

  <div class="status">
    <span class="dot"></span>
    Found Pet
  </div>

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <img id="petPhoto">

  <div id="microchipText"></div>

  <div id="btnGrid" class="grid">

    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call Secondary</button>

    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text Secondary</button>

    <button id="locBtn">📍 Send Location</button>
    <button id="locBtn2">📍 Send Location Secondary</button>

  </div>

  <div class="footer">
    Powered by ArkLink Pet ID ®
  </div>
</div>

<!-- FLOATING ACTION DOCK -->
<div class="dock" id="dock" style="display:none;">
  <button class="call" id="dockCall">Call</button>
  <button class="text" id="dockText">Text</button>
  <button class="loc" id="dockLoc">Location</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");
const locked = document.getElementById("locked");
const dock = document.getElementById("dock");

setTimeout(() => {
  document.getElementById("scanIntro").style.display = "none";
}, 1400);

if (!id) {
  locked.style.display = "block";
  document.getElementById("tagCode").innerText = "INVALID";
  throw new Error("Missing ID");
}

document.getElementById("tagCode").innerText = id;
document.getElementById("tagLinkBtn").href =
  "https://arkforge3dprinting.github.io/pet-tag/activate.html?id=" + id;

function showMain() {
  main.style.display = "block";
  dock.style.display = "flex";
}

function hide(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "none";
}

function setSingle() {
  document.getElementById("btnGrid").classList.add("single");
}

async function loadPet() {

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) {
    locked.style.display = "block";
    return;
  }

  const pet = snap.data();

  if (pet.status !== "active") {
    locked.style.display = "block";
    return;
  }

  showMain();

  document.getElementById("title").innerText =
    "You found " + (pet.name || "a pet");

  document.getElementById("message").innerText =
    "Help bring them home safely.";

  const img = document.getElementById("petPhoto");

  if (pet.photo) {
    img.src = pet.photo;
    img.style.display = "block";
  }

  const hasSecondary = pet.phone2 && pet.phone2.trim();

  document.getElementById("callBtn").onclick =
    () => window.location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick =
    () => window.open(`sms:${pet.phone}`, "_self");

  document.getElementById("locBtn").onclick = () => {
    navigator.geolocation.getCurrentPosition(pos => {
      window.open(`sms:${pet.phone}?body=Location: https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`, "_self");
    });
  };

  if (hasSecondary) {
    document.getElementById("callBtn2").onclick =
      () => window.location.href = "tel:" + pet.phone2;

    document.getElementById("textBtn2").onclick =
      () => window.open(`sms:${pet.phone2}`, "_self");
  } else {
    hide("callBtn2");
    hide("textBtn2");
    hide("locBtn2");
    setSingle();
  }

  /* dock actions */
  document.getElementById("dockCall").onclick =
    () => window.location.href = "tel:" + pet.phone;

  document.getElementById("dockText").onclick =
    () => window.open(`sms:${pet.phone}`, "_self");

  document.getElementById("dockLoc").onclick = () => {
    navigator.geolocation.getCurrentPosition(pos => {
      window.open(`sms:${pet.phone}?body=Location: https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`, "_self");
    });
  };
}

loadPet();
</script>

</body>
</html>
