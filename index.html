<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
      color: #222;
    }

    #scanIntro {
      position: fixed;
      inset: 0;
      background: rgba(245, 247, 250, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      animation: fadeOut 1.2s ease forwards;
      animation-delay: 2.8s;
    }

    .scanCircle {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      box-shadow: 0 0 25px rgba(59,130,246,0.25);
      animation: pulse 1.2s infinite;
    }

    .scanText {
      margin-top: 14px;
      font-weight: bold;
      color: #3b82f6;
    }
    @keyframes pulse {
  0% {
    transform: scale(1);
    opacity: 0.6;
  }
  50% {
    transform: scale(1.25);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 0.6;
  }
}

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: linear-gradient(180deg, #ffffff, #fbfcfd);
      padding: 16px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
      position: relative;
    }

    h1 { font-size: 24px; margin: 0 0 6px 0; }
    p { font-size: 15px; color: #666; margin: 0 0 10px 0; }

    .photoWrap {
      position: relative;
      display: inline-block;
    }

.brandHeader {
  text-align:center;
  margin:10px auto 12px;
}

.brand {
  font-size:40px;
  font-weight:900;
  letter-spacing:-2px;
}
.ark {
  color: #111827;
}

.link {
  color: #22c55e;
}
.tagline {
  margin-top:2px;
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
}

.whiteText {
  color:#111827;
}

.greenText {
  color:#22c55e;
  display:block;
}
    
.petInfo {
  font-size: 15px;
  font-weight: 700;
  color: #555;
  margin: 8px 0 12px 0;
}
    #petPhoto {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      margin: 10px auto;
      transition: 0.3s ease;
    }

    .safePhoto {
      box-shadow: 0 0 0 3px rgba(34,197,94,0.4);
      animation: glowGreen 3s infinite;
    }

    @keyframes glowGreen {
      0% { box-shadow: 0 0 0 2px rgba(34,197,94,0.2); }
      50% { box-shadow: 0 0 0 5px rgba(34,197,94,0.4); }
      100% { box-shadow: 0 0 0 2px rgba(34,197,94,0.2); }
    }

    .lostPhoto {
      box-shadow: 0 0 0 3px rgba(239,68,68,0.5);
      animation: glowRed 1.4s infinite;
    }

    @keyframes glowRed {
      0% { box-shadow: 0 0 0 2px rgba(239,68,68,0.25); }
      50% { box-shadow: 0 0 0 6px rgba(239,68,68,0.6); }
      100% { box-shadow: 0 0 0 2px rgba(239,68,68,0.25); }
    }

.petNotesBtn{
  margin:10px auto;
  padding:10px 14px;
  border-radius:14px;
  background:#f8fafc;
  border:1px solid #dbe4ee;
  font-weight:500;
  font-size:14px;
  color:#555;
  cursor:pointer;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;

  transition:.2s;
}
    .petNotesBtn small {
  display:block;
  margin-top:3px;
  font-size:11px;
  font-weight:400;
  color:#888;
}

.petNotesBtn:active{
  transform:scale(.98);
  background:#eef5fb;
}
  .notesModal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:9999;

  align-items:center;
  justify-content:center;
}
.notesCard {
  background:white;
  width:85%;
  max-width:360px;
  padding:22px;
  border-radius:24px;
  text-align:center;

  box-shadow:0 15px 50px rgba(0,0,0,0.25);

  animation: notesPop .25s ease;
}

@keyframes notesPop {
  from {
    transform:scale(.85);
    opacity:0;
  }

  to {
    transform:scale(1);
    opacity:1;
  }
}

.notesCard h2 {
  margin-top:0;
}

.notesCard button {
  background:#22c55e;
  margin-top:15px;
}
    .statusBadge {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      color: white;
      z-index: 10;
    }

    .status-lost { background: #ef4444; }
    .status-safe { background: #22c55e; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .single { grid-template-columns: 1fr !important; }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    #callBtn, #callBtn2 { background: #28c76f; }
    #textBtn, #textBtn2 { background: #3b82f6; }
    #locBtn, #locBtn2 { background: #ff9f43; }

    .hidden { display: none !important; }

    #gpsStatus {
      margin-top: 8px;
      font-weight: bold;
      color: #22c55e;
      letter-spacing: 2px;
      display: none;
    }

    #gpsText {
      margin-top: 4px;
      font-size: 11px;
      color: #777;
      display: none;
    }

    #lastUpdated {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
    /* Mobile height optimisation */
@media (max-width: 480px) {

  body {
    padding: 8px;
  }

  .brandHeader {
    margin: 8px auto 14px;
  }

  .brand {
    font-size: 34px;
  }

  .tagline {
    margin-top: 4px;
    font-size: 10px;
  }

  .container {
    padding: 12px;
    border-radius: 18px;
  }

  h1 {
    font-size: 21px;
    margin-bottom: 4px;
  }

  p {
    font-size: 14px;
    margin-bottom: 6px;
  }

  .petInfo {
    margin: 5px 0 8px;
    font-size: 14px;
  }

  #petPhoto {
    max-width: 210px;
    margin: 6px auto;
  }

  .grid {
    gap: 8px;
    margin-top: 10px;
  }

  button {
    padding: 11px;
    font-size: 12px;
    border-radius: 10px;
  }

  #gpsStatus {
    margin-top: 5px;
  }

  #lastUpdated {
    margin-top: 6px;
  }

}
  </style>
</head>

<body>
  
<div id="scanIntro">
  <div class="scanCircle"></div>
  <div class="scanText">Scanning ArkLink Tag...</div>
</div>

<div class="brandHeader">

  <div class="brand">
    <span class="ark">ARK</span><span class="link">LINK</span>
  </div>

  <div class="tagline">
    <span class="whiteText">SMART TECHNOLOGY. REAL CONNECTIONS.</span>
    <span class="greenText">SAFE RETURNS</span>
  </div>

</div>
  
<div class="container" id="main">

  <h1 id="title">Loading...</h1>
  
<div id="message" class="petNotesBtn">
  <div>
    🐾 Pet Notes
    <small>View important information</small>
  </div>
  <span>›</span>
</div>
<div id="petInfo" class="petInfo"></div>
  <div class="photoWrap">
    <div id="statusBadge" class="statusBadge hidden"></div>
    <img id="petPhoto">
  </div>

  <div id="btnGrid" class="grid">
    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call Secondary</button>
    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text Secondary</button>
    <button id="locBtn">📍 Send Location</button>
    <button id="locBtn2">📍 Send Location Secondary</button>
  </div>

  <div id="gpsStatus">●○○</div>
  <div id="gpsText">Acquiring your location...</div>

  <div id="lastUpdated">Last updated: —</div>
</div>
  <div id="notesModal" class="notesModal">

  <div class="notesCard">

    <h2>🐾 Pet Notes</h2>

    <p id="notesText">
      This is where pet notes will appear.
    </p>

    <button id="closeNotes">
      Close
    </button>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, 
  doc, 
  onSnapshot,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");

async function logScan(){

if(!id) return;

try {

await addDoc(collection(db,"scanEvents"),{
  petID:id,
  type:"scan",
  timestamp:serverTimestamp()
});

console.log("Scan logged");

} catch(e) {
  console.error("Scan logging failed:", e);
}

}

if (!id) {

  document.getElementById("title").innerText = "Invalid ArkLink Tag";
  document.getElementById("message").innerText =
    "No pet ID was supplied.";

  document.getElementById("petPhoto").style.display = "none";
  document.getElementById("btnGrid").style.display = "none";
  document.getElementById("gpsStatus").style.display = "none";
  document.getElementById("gpsText").style.display = "none";
  document.getElementById("lastUpdated").style.display = "none";

  main.style.display = "block";

  throw new Error("Missing pet ID");
}
  
let gpsBusy = false;

/* FIXED TIME AGO */
function timeAgo(date) {
  const seconds = Math.floor((Date.now() - date) / 1000);

  if (seconds < 60) return `${seconds}s ago`;
  const mins = Math.floor(seconds / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  return `${hrs}h ago`;
}

/* GPS */
function getGPS() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 12000
    });
  });
}

/* LIVE */
function loadPet() {
  const ref = doc(db, "pets", id);

  onSnapshot(ref, (snap) => {
if (!snap.exists()) {

  document.getElementById("title").innerText = "Pet not found";
  document.getElementById("message").innerText =
    "This ArkLink tag is no longer registered.";

  document.getElementById("petPhoto").style.display = "none";
  document.getElementById("btnGrid").style.display = "none";
  document.getElementById("gpsStatus").style.display = "none";
  document.getElementById("gpsText").style.display = "none";
  document.getElementById("lastUpdated").style.display = "none";

  main.style.display = "block";
  return;
}

    const pet = snap.data();
    
if (pet.status === "inactive") {
  window.location.href =
    "activate.html?id=" + encodeURIComponent(id);
  return;
}


if (pet.status === "disabled") {

  main.innerHTML = `

    <h1>🐾 ArkLink Tag Disabled</h1>

    <p>
      This pet profile has been temporarily disabled. If you believe this is a mistake, please contact ArkLink.
      www.arklinkpets.com/contactus
    </p>

  `;

  main.style.display = "block";

  return;
}

    main.style.display = "block";

    document.getElementById("title").innerText = "🐾 You found " + pet.name;
  document.getElementById("message").innerHTML = `
  <div>
    🐾 Pet Notes
    <small>View important information</small>
  </div>
  <span>›</span>
`;
    const petInfo = [];

if (pet.breed) {
  petInfo.push(pet.breed);
}

if (pet.age) {
  petInfo.push(pet.age);
}

document.getElementById("petInfo").innerText = petInfo.join(" • ");
   const hasSecondary =
  typeof pet.phone2 === "string" &&
  pet.phone2.trim().length > 0;

const secondaryButtons = [
  "callBtn2",
  "textBtn2",
  "locBtn2"
];

secondaryButtons.forEach(buttonId => {
  const button = document.getElementById(buttonId);

  if (button) {
    button.style.display = hasSecondary ? "block" : "none";
  }
});

const btnGrid = document.getElementById("btnGrid");

if (hasSecondary) {
  btnGrid.classList.remove("single");
} else {
  btnGrid.classList.add("single");
}
    
/* MICROCHIP DISPLAY (FIX) */
if (pet.microchip) {
  let chip = document.getElementById("microchipText");

  if (!chip) {
    chip = document.createElement("div");
    chip.id = "microchipText";
    chip.style.marginTop = "8px";
    chip.style.fontSize = "12px";
    chip.style.color = "#666";
    chip.style.fontWeight = "600";
    document.getElementById("main").insertBefore(chip, document.getElementById("btnGrid"));
  }

  let value = pet.microchip;

  // uppercase only letters (safe for mixed alphanumeric chips)
  value = value.toUpperCase();

  chip.innerHTML = "Microchip: <strong>" + value + "</strong>";
}

    const photo = document.getElementById("petPhoto");
    const badge = document.getElementById("statusBadge");

    /* RESET */
    photo.classList.remove("lostPhoto", "safePhoto");
    badge.classList.remove("hidden", "status-lost", "status-safe");

const status = pet.petStatus;

badge.classList.add("hidden");
badge.classList.remove("status-lost", "status-safe");

photo.classList.remove("lostPhoto", "safePhoto");

if (status === "lost") {
  badge.innerText = "🔴 LOST";
  badge.classList.remove("hidden");
  badge.classList.add("status-lost");

  photo.classList.add("lostPhoto");
} else {
  // SAFE (or default)
  photo.classList.add("safePhoto");
}

    if (pet.photo) photo.src = pet.photo;

/* LAST UPDATED (FINAL FIX) */
const raw = pet.updatedAt;

let last = null;

if (raw?.toDate) {
  last = raw.toDate(); // Firestore Timestamp (correct path)
} else if (raw?.seconds) {
  last = new Date(raw.seconds * 1000); // fallback
} else {
  last = new Date(raw); // string / number fallback
}

if (!isNaN(last.getTime())) {
  document.getElementById("lastUpdated").innerText =
    "Last updated: " + timeAgo(last);
}

    /* ===== BUTTONS FIXED (NO OVERWRITING, SECONDARY INCLUDED) ===== */

   document.getElementById("callBtn").onclick =
  () => window.location.href = "tel:" + pet.phone;

document.getElementById("textBtn").onclick =
  () => window.open(
    `sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
    "_self"
  );

if (hasSecondary) {

  document.getElementById("callBtn2").onclick =
    () => window.location.href = "tel:" + pet.phone2;

  document.getElementById("textBtn2").onclick =
    () => window.open(
      `sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
      "_self"
    );

}

    function bindGPS(btnId, phone) {
      const btn = document.getElementById(btnId);

      btn.onclick = async () => {
        if (gpsBusy) return;
        gpsBusy = true;

        const gpsStatus = document.getElementById("gpsStatus");
        const gpsText = document.getElementById("gpsText");

        const frames = ["●○○ 𖤣", "●●○ 𖤣", "●●● 𖤣"];
        let i = 0;

        gpsStatus.style.display = "block";
        gpsText.style.display = "block";

        const anim = setInterval(() => {
          gpsStatus.innerText = frames[i++ % frames.length];
        }, 350);

        try {
          const pos = await getGPS();

          window.open(
            `sms:${phone}?body=${encodeURIComponent(
              "I found " + pet.name +
              " https://maps.google.com/?q=" +
              pos.coords.latitude + "," + pos.coords.longitude
            )}`,
            "_self"
          );
        } finally {
          clearInterval(anim);
          gpsStatus.style.display = "none";
          gpsText.style.display = "none";
          gpsBusy = false;
        }
      };
    }

bindGPS("locBtn", pet.phone);

if (hasSecondary) {
  bindGPS("locBtn2", pet.phone2);
}

  });
}
  const notesModal = document.getElementById("notesModal");

document.getElementById("message").onclick = () => {
  notesModal.style.display = "flex";
};

document.getElementById("closeNotes").onclick = () => {
  notesModal.style.display = "none";
};

notesModal.onclick = (e) => {
  if (e.target === notesModal) {
    notesModal.style.display = "none";
  }
};

logScan();
loadPet();
</script>

</body>
</html>
