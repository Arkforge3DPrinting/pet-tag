<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 14px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      animation: popIn 600ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.96); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h2 { margin-bottom: 4px; }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .btn:active {
      transform: scale(0.98);
      filter: brightness(0.95);
    }

    .camera { background: #ff9f43; }
    .gallery { background: #3b82f6; }
    .activate { background: #3b82f6; font-size: 18px; }

    .tos-box {
      text-align: left;
      font-size: 13px;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      margin: 12px 0;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
      min-height: 20px;
    }

    .error { color: #d11a2a; }
    .ok { color: #0a7a2f; }

    /* PROGRESS */
    .progress-wrap {
      display:none;
      margin-top:14px;
    }

    .bar-bg {
      width:100%;
      height:10px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
    }

    .bar {
      width:0%;
      height:100%;
      background:linear-gradient(90deg,#22c55e,#16a34a);
      transition: width 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-text {
      font-size:13px;
      margin-top:8px;
      color:#555;
    }

    /* STEPS */
    .step {
      font-size:13px;
      color:#999;
      margin-top:6px;
      transition: all 300ms ease;
    }

    .step.done {
      color:#16a34a;
      font-weight:600;
    }

    .step.done::before {
      content:"✓ ";
    }

    /* BLUR MODE */
    .blur-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events:none;
      transition: 300ms ease;
    }

    .blur-overlay.active {
      opacity: 1;
    }

    /* PREVIEW */
    .preview {
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #eee;
      text-align: left;
      font-size: 13px;
      opacity: 0;
      transform: translateY(6px);
      transition: all 300ms ease;
    }

    .preview.active {
      opacity: 1;
      transform: translateY(0);
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events:none;
    }
  </style>
</head>

<body>

<div class="blur-overlay" id="blur"></div>
<canvas id="confettiCanvas"></canvas>

<div class="container">

  <h2>Activate Pet Tag</h2>

  <div class="tagid">Tag ID: <span id="tagIdDisplay"></span></div>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">
  <input id="microchip" placeholder="Microchip number (optional)">
  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <div class="tos-box">
    <label>
      <input type="checkbox" id="tosCheckbox">
      I agree to Terms of Service.
    </label>
  </div>

  <button class="btn activate" id="activateBtn">Activate</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="bar-bg"><div class="bar" id="bar"></div></div>
    <div class="progress-text" id="progressText">Preparing…</div>

    <div class="step" id="s1">Checking tag…</div>
    <div class="step" id="s2">Uploading photo…</div>
    <div class="step" id="s3">Saving profile…</div>
    <div class="step" id="s4">Finalising…</div>
  </div>

  <div class="preview" id="preview">
    <b>Live Preview</b>
    <div id="pName">Name: —</div>
    <div id="pPhone">Phone: —</div>
    <div id="pPhoto">Photo: not uploaded</div>
  </div>

  <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
});

const db = getFirestore(app);

const statusEl = document.getElementById("status");
const btn = document.getElementById("activateBtn");
const urlId = new URLSearchParams(location.search).get("id");

const wrap = document.getElementById("progressWrap");
const bar = document.getElementById("bar");
const text = document.getElementById("progressText");

const blur = document.getElementById("blur");
const preview = document.getElementById("preview");

function status(msg, type="") {
  statusEl.innerText = msg;
  statusEl.className = type;
}

function haptic() {
  if (navigator.vibrate) navigator.vibrate(12);
}

function progress(p, t) {
  wrap.style.display = "block";
  bar.style.width = p + "%";
  text.innerText = t;
}

function step(id) {
  document.getElementById(id).classList.add("done");
}

function showPreview(name, phone, photo) {
  preview.classList.add("active");
  document.getElementById("pName").innerText = "Name: " + name;
  document.getElementById("pPhone").innerText = "Phone: " + phone;
  document.getElementById("pPhoto").innerText = photo ? "Photo: uploaded ✓" : "Photo: pending";
}

function blurOn(){ blur.classList.add("active"); }
function blurOff(){ blur.classList.remove("active"); }

/* CONFETTI */
const canvas = document.getElementById("confettiCanvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;
let pieces=[];

function boom(){
  pieces=[];
  for(let i=0;i<120;i++){
    pieces.push({x:Math.random()*canvas.width,y:0,r:Math.random()*6});
  }
  draw();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle="hsl("+Math.random()*360+",80%,60%)";
    ctx.fill();
    p.y+=3;
  });
  if(pieces.length) requestAnimationFrame(draw);
}

/* IMAGE COMPRESS */
async function compress(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas");
        const scale=Math.sqrt((2*1024*1024)/file.size);
        c.width=img.width*scale;
        c.height=img.height*scale;
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>res(new File([b],"img.jpg",{type:"image/jpeg"})),"image/jpeg",0.85);
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

let running=false;

btn.onclick=async()=>{

  const name=nameInput.value;
  const phone=phoneInput.value;
  const tos=tosBox.checked;
  const file=fileInput.files[0];

  if(!name||!phone) return status("Missing fields","error");
  if(!tos) return status("Accept terms","error");

  if(running) return;
  running=true;

  btn.disabled=true;
  blurOn();
  haptic();

  showPreview(name,phone,false);

  try{

    progress(10,"Checking tag…");
    const snap=await getDoc(doc(db,"pets",urlId));
    if(!snap.exists()) throw new Error("Tag not found");
    step("s1");

    let photoURL="";
    let file=fileInput.files[0];

    if(file){
      progress(40,"Preparing photo…");
      file=await compress(file);
      step("s2");

      progress(55,"Uploading photo…");
      const form=new FormData();
      form.append("file",file);
      form.append("upload_preset","arkforge-pets");

      const res=await fetch("https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",{method:"POST",body:form});
      const data=await res.json();

      if(!data.secure_url) throw new Error("Upload failed");
      photoURL=data.secure_url;

      showPreview(name,phone,true);
    }

    progress(75,"Saving profile…");
    step("s3");

    const ex=snap.data();

    await setDoc(doc(db,"pets",urlId),{
      name,
      phone,
      phone2:"",
      microchip:"",
      photo:photoURL||ex.photo||"",
      status:"active",
      activatedAt:new Date().toISOString()
    },{merge:true});

    step("s4");
    progress(100,"Complete");

    blurOff();
    boom();
    haptic();

    status("🎉 Activated! Redirecting…","ok");

    setTimeout(()=>{
      location.href=`https://arkforge3dprinting.github.io/pet-tag/index.html?id=${urlId}`;
    },2500);

  }catch(e){
    blurOff();
    status("❌ "+e.message,"error");
    running=false;
    btn.disabled=false;
  }
};

</script>

</body>
</html>
