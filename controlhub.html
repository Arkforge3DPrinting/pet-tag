<!DOCTYPE html>
<html>
<head>
  <title>Arkforge Control Hub</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      background: #f4f6f8;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #0f172a;
      color: white;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .nav {
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      background: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav:hover {
      background: #334155;
    }

    .nav.active {
      background: #3b82f6;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
    }

    .panel {
      display: none;
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .panel.active {
      display: block;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    .card {
      background: #f9fafb;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #eee;
    }

    #qrBox {
      margin-top: 10px;
      display: flex;
      justify-content: center;
    }

    @media (max-width: 700px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
      }

      .nav {
        flex: 1;
        justify-content: center;
      }
    }

  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="brand">🐾 Hub</div>

  <div class="nav active" onclick="openTab('create', this)">
    ➕ Create
  </div>

  <div class="nav" onclick="openTab('database', this)">
    📦 Database
  </div>

  <div class="nav" onclick="openTab('qr', this)">
    📱 QR Tools
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <!-- CREATE -->
  <div id="create" class="panel active">
    <h2>Create Tag</h2>

    <input id="name" placeholder="Pet Name">
    <input id="phone" placeholder="Primary Phone">
    <input id="phone2" placeholder="Secondary Phone (optional)">

    <button onclick="createTag()">
      Generate Tag
    </button>

    <p id="createStatus"></p>
  </div>

  <!-- DATABASE -->
  <div id="database" class="panel">
    <h2>Live Database</h2>
    <div id="dbList"></div>
  </div>

  <!-- QR -->
  <div id="qr" class="panel">
    <h2>QR Generator</h2>

    <input id="qrText" placeholder="Paste URL or ID">

    <button onclick="genQR()">Generate QR</button>

    <div id="qrBox"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// NAV
window.openTab = (id, el) => {

  document.querySelectorAll('.panel')
    .forEach(p => p.classList.remove('active'));

  document.getElementById(id)
    .classList.add('active');

  document.querySelectorAll('.nav')
    .forEach(n => n.classList.remove('active'));

  el.classList.add('active');

};

// CREATE TAG
window.createTag = async () => {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const phone2 = document.getElementById("phone2").value;

  const status = document.getElementById("createStatus");

  if (!name || !phone) {
    status.innerText = "Missing fields";
    return;
  }

  await addDoc(collection(db, "pets"), {
    name,
    phone,
    phone2: phone2 || "",
    photo: ""
  });

  status.innerText = "Tag created ✔";

};

// DATABASE LIVE
function loadDB() {

  const list = document.getElementById("dbList");

  onSnapshot(collection(db, "pets"), (snap) => {

    list.innerHTML = "";

    snap.forEach((doc) => {

      const d = doc.data();

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <b>${d.name}</b><br>
        ${d.phone}<br>
        ${d.phone2 || "No secondary"}
      `;

      list.appendChild(div);

    });

  });

}

loadDB();

// QR
window.genQR = () => {

  const text =
    document.getElementById("qrText").value;

  document.getElementById("qrBox").innerHTML = "";

  new QRCode(document.getElementById("qrBox"), {
    text,
    width: 160,
    height: 160
  });

};

</script>

</body>
</html>
