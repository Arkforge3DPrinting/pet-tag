<!DOCTYPE html>
<html>
<head>
  <title>Create Pet Tag NFC</title>

  <!-- QR CODE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- File saver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    #qrBox {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }
  </style>

</head>

<body style="font-family: Arial; text-align:center; padding:20px;">

<h2>Create NFC Pet Tag</h2>

<input id="name" placeholder="Pet Name"><br><br>
<input id="phone" placeholder="Primary Owner Phone"><br><br>
<input id="phone2" placeholder="Secondary Phone (Optional)"><br><br>

<button id="generateBtn">Generate & Save</button>

<p id="result"></p>

<div id="qrBox"></div>

<div id="downloadSection" style="margin-top:20px;"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ✅ FIXED DOCX IMPORT (THIS IS THE IMPORTANT FIX)
import {
  Document,
  Packer,
  Paragraph,
  TextRun
} from "https://cdn.jsdelivr.net/npm/docx@8.5.0/+esm";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const defaultPhoto =
  "https://res.cloudinary.com/ddsp7ps7p/image/upload/v1776062761/placeholderpaw_a29ok1.jpg";

function generateId(length = 10) {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  let id = "";
  for (let i = 0; i < length; i++) {
    id += chars[Math.floor(Math.random() * chars.length)];
  }
  return id;
}

function resetUI() {
  document.getElementById("qrBox").innerHTML = "";
  document.getElementById("downloadSection").innerHTML = "";
}

// CREATE TAG
document.getElementById("generateBtn").onclick = async () => {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();

  const result = document.getElementById("result");

  resetUI();

  if (!name || !phone) {
    result.style.color = "red";
    result.innerText = "Please enter pet name and primary phone";
    return;
  }

  const id = generateId();

  const url =
    `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`;

  try {

    await setDoc(doc(db, "pets", id), {
      name,
      phone,
      phone2: phone2 || "",
      photo: defaultPhoto
    });

    result.style.color = "green";
    result.innerHTML = `
      <b>Saved Successfully!</b><br><br>
      <b>ID:</b> ${id}<br><br>
      <b>Tag URL:</b><br>
      <a href="${url}" target="_blank">${url}</a>
    `;

    // QR CODE
    new QRCode(document.getElementById("qrBox"), {
      text: url,
      width: 180,
      height: 180
    });

    // DOC BUTTON
    document.getElementById("downloadSection").innerHTML = `
      <button id="downloadDocBtn" style="
        margin-top:15px;
        padding:12px;
        width:100%;
        border:none;
        border-radius:12px;
        background:#111;
        color:white;
        font-weight:bold;
        cursor:pointer;
      ">
        📄 Download Customer Letter (.docx)
      </button>
    `;

    document.getElementById("downloadDocBtn").onclick = async () => {

      const doc = new Document({
        sections: [
          {
            children: [

              new Paragraph({
                children: [
                  new TextRun({
                    text: "Arkforge 3D Printing - Pet Tag Activation",
                    bold: true,
                    size: 28
                  })
                ]
              }),

/* spacing */
              new Paragraph(""),

              new Paragraph({
                children: [
                  new TextRun({
                    text: "IMPORTANT CUSTOMER INFORMATION",
                    bold: true
                  })
                ]
              }),

/* pet info */
              new Paragraph({
                children: [
                  new TextRun("Pet Name: "),
                  new TextRun({ text: name, bold: true })
                ]
              }),

/* link */
              new Paragraph({
                children: [
                  new TextRun("Tag Link: "),
                  new TextRun({ text: url, bold: true })
                ]
              }),

/* instructions */
              new Paragraph(""),

              new Paragraph({
                children: [
                  new TextRun({
                    text: "HOW TO USE YOUR PET TAG",
                    bold: true
                  })
                ]
              }),

              new Paragraph("1. Scan the QR code using any smartphone camera."),
              new Paragraph("2. This opens your pet’s secure profile page."),
              new Paragraph("3. Fill in or confirm your contact details."),
              new Paragraph("4. Found pets can contact you instantly via call or SMS."),

              new Paragraph(""),

              new Paragraph({
                children: [
                  new TextRun({
                    text: "TIP: Keep your phone number updated for fastest recovery.",
                    italics: true
                  })
                ]
              }),

/* footer */
              new Paragraph(""),

              new Paragraph({
                children: [
                  new TextRun({
                    text:
                      "Powered by Arkforge 3D Printing NFC Pet Recovery System",
                    italics: true
                  })
                ]
              })

            ]
          }
        ]
      });

      const blob = await Packer.toBlob(doc);
      saveAs(blob, `${name}-pet-tag-letter.docx`);
    };

  } catch (e) {

    console.log(e);
    result.style.color = "red";
    result.innerText = e.code + " - " + e.message;

  }

};

</script>

</body>
</html>
