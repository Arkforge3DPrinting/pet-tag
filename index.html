<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>
</head>

<body style="font-family: Arial; text-align:center; padding:20px;">

<h1 id="title">Loading...</h1>
<p id="message"></p>

<button id="callBtn">📞 Call Owner</button>
<button id="textBtn">💬 Text Owner</button>
<button id="locBtn">📍 Share Location</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "517154779272",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadPet() {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) {
    document.getElementById("title").innerText = "No pet ID found";
    return;
  }

  const snap = await getDoc(doc(db, "pets", id));

  if (snap.exists()) {
    const pet = snap.data();

    document.getElementById("title").innerText = "🐾 You found " + pet.name;
    document.getElementById("message").innerText = "Help me get home safely";

    document.getElementById("callBtn").onclick = () => {
      window.location.href = "tel:" + pet.phone;
    };

    document.getElementById("textBtn").onclick = () => {
      window.location.href =
        "sms:" + pet.phone +
        "?body=" + encodeURIComponent("Hi, I found your pet " + pet.name);
    };

    document.getElementById("locBtn").onclick = () => {

      navigator.geolocation.getCurrentPosition(pos => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        const msg =
          "Hi, I found your pet " + pet.name +
          ". My location: https://maps.google.com/?q=" + lat + "," + lon;

        window.location.href =
          "sms:" + pet.phone + "?body=" + encodeURIComponent(msg);

      });

    };

  } else {
    document.getElementById("title").innerText = "This tag is not set up yet. To activate: 📧 Email: arkforge3dprinting@outlook.com Include: • Pet name • Your phone number • Tag code (found on device)";
  }
}
loadPet();
</script>

</body>
</html>
