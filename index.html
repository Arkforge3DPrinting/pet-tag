<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);
const id = new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");

let gpsBusy = false;

/* GPS */
function getGPS() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 12000
    });
  });
}

/* TIME AGO (FIXED FOR FIREBASE TIMESTAMP) */
function timeAgo(input) {
  if (!input) return null;

  const date =
    input?.toDate ? input.toDate() : new Date(input);

  const seconds = Math.floor((Date.now() - date.getTime()) / 1000);

  if (seconds < 60) return `${seconds}s ago`;
  const mins = Math.floor(seconds / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  return `${hrs}h ago`;
}

/* BUTTON BIND HELPERS */
function bindPrimary(pet) {
  document.getElementById("callBtn").onclick =
    () => window.location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick =
    () => window.open(
      `sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
      "_self"
    );

  document.getElementById("locBtn").onclick = async () => {
    if (gpsBusy) return;
    gpsBusy = true;

    const gpsStatus = document.getElementById("gpsStatus");
    const gpsText = document.getElementById("gpsText");

    const frames = ["●○○", "●●○", "●●●"];
    let i = 0;

    gpsStatus.style.display = "block";
    gpsText.style.display = "block";

    const anim = setInterval(() => {
      gpsStatus.innerText = frames[i++ % frames.length];
    }, 350);

    try {
      const pos = await getGPS();

      window.open(
        `sms:${pet.phone}?body=${encodeURIComponent(
          "I found " + pet.name +
          " https://maps.google.com/?q=" +
          pos.coords.latitude + "," + pos.coords.longitude
        )}`,
        "_self"
      );
    } finally {
      clearInterval(anim);
      gpsStatus.style.display = "none";
      gpsText.style.display = "none";
      gpsBusy = false;
    }
  };
}

function bindSecondary(pet) {
  const hasSecondary = pet.phone2 && pet.phone2.trim();

  if (!hasSecondary) {
    document.getElementById("callBtn2").classList.add("hidden");
    document.getElementById("textBtn2").classList.add("hidden");
    document.getElementById("locBtn2").classList.add("hidden");
    document.getElementById("btnGrid").classList.add("single");
    return;
  }

  document.getElementById("callBtn2").onclick =
    () => window.location.href = "tel:" + pet.phone2;

  document.getElementById("textBtn2").onclick =
    () => window.open(
      `sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
      "_self"
    );

  document.getElementById("locBtn2").onclick = async () => {
    if (gpsBusy) return;
    gpsBusy = true;

    const gpsStatus = document.getElementById("gpsStatus");
    const gpsText = document.getElementById("gpsText");

    const frames = ["●○○", "●●○", "●●●"];
    let i = 0;

    gpsStatus.style.display = "block";
    gpsText.style.display = "block";

    const anim = setInterval(() => {
      gpsStatus.innerText = frames[i++ % frames.length];
    }, 350);

    try {
      const pos = await getGPS();

      window.open(
        `sms:${pet.phone2}?body=${encodeURIComponent(
          "I found " + pet.name +
          " https://maps.google.com/?q=" +
          pos.coords.latitude + "," + pos.coords.longitude
        )}`,
        "_self"
      );
    } finally {
      clearInterval(anim);
      gpsStatus.style.display = "none";
      gpsText.style.display = "none";
      gpsBusy = false;
    }
  };
}

/* LIVE */
function loadPet() {

  const ref = doc(db, "pets", id);

  onSnapshot(ref, (snap) => {
    if (!snap.exists()) return;

    const pet = snap.data();

    main.style.display = "block";

    document.getElementById("title").innerText = "🐾 You found " + pet.name;
    document.getElementById("message").innerText = "Help get them home safely.";

    const photo = document.getElementById("petPhoto");
    const badge = document.getElementById("statusBadge");

    photo.classList.remove("lostPhoto", "safePhoto");
    badge.classList.remove("hidden", "status-lost", "status-safe");

    const status = pet.petStatus || "safe";

    if (status === "lost") {
      badge.innerText = "🔴 LOST";
      badge.classList.add("status-lost");
      photo.classList.add("lostPhoto");
    } else {
      badge.innerText = "🟢 SAFE";
      badge.classList.add("status-safe");
      photo.classList.add("safePhoto");
    }

    if (pet.photo) photo.src = pet.photo;

    /* LAST UPDATED FIX */
    const last = pet.updatedAt;

    const lastEl = document.getElementById("lastUpdated");

    if (last) {
      const formatted = timeAgo(last);
      lastEl.innerText = formatted ? `Last updated: ${formatted}` : "Last updated: —";
    } else {
      lastEl.innerText = "Last updated: —";
    }

    /* BUTTONS */
    bindPrimary(pet);
    bindSecondary(pet);
  });
}

loadPet();
</script>
