<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    h2 { margin-bottom: 12px; }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filters button {
      padding: 10px 14px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: bold;
      background: #e5e7eb;
    }

    .filters button.active {
      color: white;
    }

    .filters button.all.active { background: #374151; }
    .filters button.active.active { background: #22c55e; }
    .filters button.inactive.active { background: #f59e0b; }
    .filters button.disabled.active { background: #ef4444; }

    .filters button.noprimary.active { background: #a855f7; }
    .filters button.nosecondary.active { background: #06b6d4; }
    .filters button.defaultimg.active { background: #f97316; }

    .card {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      color: white;
    }

    .badge.active { background: #22c55e; }
    .badge.inactive { background: #f59e0b; }
    .badge.disabled { background: #ef4444; }

    .row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .left {
      display: flex;
      gap: 12px;
      flex: 1;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #eee;
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 160px;
      flex: 1;
    }

    .field label {
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 100%;
    }

    .right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      min-width: 120px;
    }

    .idline {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .id-btn {
      background: #111827;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 11px;
    }

    .qr {
      margin-top: 8px;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.action {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }

    button.disable {
      background: #7c3aed;
    }
  </style>
</head>

<body>

<h2>🐾 Dashboard v1.02</h2>

<input id="search" placeholder="Search ID, name, phone...">

<div class="filters">
  <button class="all active" onclick="setFilter('all', this)">📦 All</button>
  <button class="active" onclick="setFilter('active', this)">🟢 Active</button>
  <button class="inactive" onclick="setFilter('inactive', this)">🟠 Inactive</button>
  <button class="disabled" onclick="setFilter('disabled', this)">🔴 Disabled</button>
  <button class="noprimary" onclick="setFilter('noprimary', this)">🟣 No Primary</button>
  <button class="nosecondary" onclick="setFilter('nosecondary', this)">🔵 No Secondary</button>
  <button class="defaultimg" onclick="setFilter('defaultimg', this)">🟠 Default Image</button>
<button id="pendingFilter"
class="pending"
onclick="setFilter('pending', this)">
📝 Pending (0)
</button>
</div>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  query
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* =========================
   VARIABLES
========================= */

let pets = [];
let filter = "all";
let search = "";
let pendingCount = 0;

const listDiv = document.getElementById("list");

/* =========================
   AUTH
========================= */

await setPersistence(auth, browserLocalPersistence);

let started = false;

onAuthStateChanged(auth, (user) => {

  if (!user) {

    setTimeout(() => {

      if (!auth.currentUser) {
        window.location.href = "login.html";
      }

    }, 500);

    return;
  }

  start();
});

/* =========================
   START
========================= */

function start() {

  if (started) return;
  started = true;

 onSnapshot(

  query(collection(db, "pets")),

  (snap) => {

    console.log("Pets loaded:", snap.size);

    pets = snap.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));

    pendingCount = pets.filter(
      p => p.pendingNameChangeStatus === "pending"
    ).length;

    document.getElementById("pendingFilter").innerText =
      "📝 Pending (" + pendingCount + ")";

    render();
  },
    (error) => {

      console.error("FIRESTORE ERROR:", error);

      listDiv.innerHTML = `
        <p style="color:red;">
          Firestore Error: ${error.message}
        </p>
      `;
    }
  );
}

/* =========================
   SEARCH
========================= */

document.getElementById("search").addEventListener("input", (e) => {

  search = (e.target.value || "").toLowerCase();
  render();

});

/* =========================
   FILTER
========================= */

window.setFilter = (f, btn) => {

  filter = f;

  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  render();
};

/* =========================
   COPY ID
========================= */

window.copyId = async (id) => {

  await navigator.clipboard.writeText(id);
  alert("Copied: " + id);

};

/* =========================
   SAVE
========================= */

window.savePet = async (id) => {

  const ref = doc(db, "pets", id);

  await updateDoc(ref, {
    name: document.getElementById("name-" + id).value,
    phone: document.getElementById("phone-" + id).value,
    phone2: document.getElementById("phone2-" + id).value
  });

};
/* =========================
   APPROVE/DECLINE
========================= */
window.approveName = async (id) => {

  const pet = pets.find(p => p.id === id);

  if (!pet || !pet.pendingNameChange) return;

  const ref = doc(db, "pets", id);

  await updateDoc(ref, {

    name: pet.pendingNameChange,

    pendingNameChange: "",

    pendingNameChangeStatus: "",

    updatedAt: new Date()

  });

  alert("Name updated");

};
  window.denyName = async (id) => {

  const ref = doc(db, "pets", id);

  await updateDoc(ref, {

    pendingNameChangeStatus: "rejected",

    pendingNameChange: "",

    updatedAt: new Date()

  });

  alert("Name request rejected");

};
/* =========================
   TOGGLE
========================= */

window.toggleDisable = async (id) => {

  const ref = doc(db, "pets", id);
  const pet = pets.find(p => p.id === id);

  await updateDoc(ref, {
    status: pet.status === "disabled"
      ? "active"
      : "disabled"
  });

};

/* =========================
   QR
========================= */

function makeQR(id) {

  const el = document.getElementById("qr-" + id);

  el.innerHTML = "";

  const url =
    `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`;

  new QRCode(el, {
    text: url,
    width: 90,
    height: 90
  });
}

/* =========================
   RENDER
========================= */

function render() {

  listDiv.innerHTML = "";

  const s = search;

  const filtered = pets.filter(p => {

    const id = (p.id || "").toString().toLowerCase();
    const name = (p.name || "").toString().toLowerCase();
    const phone = (p.phone || "").toString();
    const phone2 = (p.phone2 || "").toString();

    const match =
      id.includes(s) ||
      name.includes(s) ||
      phone.includes(search) ||
      phone2.includes(search);

    if (!match) return false;

if (filter === "active") return p.status === "active";
if (filter === "inactive") return !p.status || p.status === "inactive";
if (filter === "disabled") return p.status === "disabled";

if (filter === "pending")
  return p.pendingNameChangeStatus === "pending";

if (filter === "noprimary") return !p.phone;
if (filter === "nosecondary") return !p.phone2;

    if (filter === "defaultimg") {
      return !p.photo || p.photo.includes("placeholderpaw");
    }

    return true;
  });

  if (!filtered.length) {

    listDiv.innerHTML = "<p>No pets found.</p>";
    return;
  }

  filtered.forEach(p => {

    const div = document.createElement("div");

    div.className = "card";

    div.innerHTML = `
      <div class="meta">

        <div class="idline">
          <b>${p.id}</b>

          <button class="id-btn"
            onclick="copyId('${p.id}')">
            Copy
          </button>
        </div>

        <span class="badge ${p.status || 'inactive'}">
          ${p.status || 'inactive'}
        </span>

      </div>

      <div class="row">

        <div class="left">

          <img src="${p.photo || ''}"
            onerror="this.style.display='none'">

          <div class="field">
            <label>Name</label>

            <input id="name-${p.id}"
              value="${p.name || ""}">
          </div>

          <div class="field">
            <label>Primary Phone</label>

            <input id="phone-${p.id}"
              value="${p.phone || ""}">
          </div>

          <div class="field">
            <label>Secondary Phone</label>

            <input id="phone2-${p.id}"
              value="${p.phone2 || ""}">
          </div>

        </div>

        <div class="right">
          <div id="qr-${p.id}" class="qr"></div>
        </div>

      </div>

      <div class="buttons">
      
${p.pendingNameChangeStatus === "pending" ? `

<div style="
background:#fef3c7;
padding:10px;
border-radius:10px;
margin-top:10px;
">

<b>🐾 Name Change Request</b><br>

Current: ${p.name || ""}<br>

Requested: ${p.pendingNameChange}

<button class="action"
onclick="approveName('${p.id}')">
Approve
</button>

<button class="action disable"
onclick="denyName('${p.id}')">
Reject
</button>

</div>

` : ""}
        <button class="action"
          onclick="savePet('${p.id}')">
          Save
        </button>

        <button class="action disable"
          onclick="toggleDisable('${p.id}')">

          ${p.status === "disabled"
            ? "Re-enable"
            : "Disable"}

        </button>

      </div>
    `;

    listDiv.appendChild(div);

    setTimeout(() => makeQR(p.id), 50);

  });
}

</script>

</body>
</html>
