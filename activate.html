<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg,#eef2ff,#f4f6f8);
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      border: 2px solid #e5e7eb;
    }

    h2 { margin-bottom: 6px; font-size: 22px; }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .steps {
      text-align: left;
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .step {
      padding: 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step.active { background:#dbeafe; border:1px solid #3b82f6; }
    .step.done { background:#dcfce7; border:1px solid #22c55e; }

    .tick { width: 20px; font-weight: 900; }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 2px solid #ddd;
      font-size: 15px;
    }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }

    .camera { background:#f97316; }
    .gallery { background:#2563eb; }
    .activate { background:#16a34a; font-size:18px; }

    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: -6px;
      margin-bottom: 8px;
    }

    .progress {
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
      border: 2px solid #d1d5db;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#22c55e,#16a34a);
      transition: width 250ms ease;
    }

    .status {
      margin-top: 10px;
      font-weight: 800;
      font-size: 14px;
      min-height: 20px;
    }

    .tos-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: left;
      font-size: 14px;
      line-height: 1.4;
      padding: 14px 16px;
      margin: 14px 0;
      background: #fafafa;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
    }

    .tos-box input {
      width: 22px;
      height: 22px;
      margin: 0;
      accent-color: #16a34a;
    }

    .tos-text {
      flex: 1;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Activate Pet Tag</h2>
  <div class="tagid">Tag ID: <span id="tagIdDisplay"></span></div>

  <div class="steps">
    <div class="step" id="s1"><span class="tick">❌</span> Enter details</div>
    <div class="step" id="s2"><span class="tick">❌</span> Add photo</div>
    <div class="step" id="s3"><span class="tick">❌</span> Activate tag</div>
  </div>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">
  <input id="microchip" placeholder="Microchip number (optional)">

  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <div class="small" id="fileInfo">No image selected</div>
  <div class="small" id="sizeInfo"></div>

  <div class="tos-box">
    <input type="checkbox" id="tosCheckbox">
    <div class="tos-text">
      I agree to the Terms of Service and understand this profile may be publicly visible when scanned.
    </div>
  </div>

  <button class="btn activate" id="activateBtn">ACTIVATE TAG</button>

  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6b...",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
});

const db = getFirestore(app);
const id = new URLSearchParams(location.search).get("id");

document.getElementById("tagIdDisplay").innerText = id;

const bar = document.getElementById("bar");
const status = document.getElementById("status");
const fileInfo = document.getElementById("fileInfo");
const sizeInfo = document.getElementById("sizeInfo");

/* SOUND + HAPTIC */
const tickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
tickSound.volume = 0.25;

function feedback(){
  try {
    tickSound.currentTime = 0;
    tickSound.play();
  } catch(e){}

  if (navigator.vibrate) {
    navigator.vibrate(25);
  }
}

/* STEP SYSTEM */
let lastStep = 0;

function setStep(n){
  for(let i=1;i<=3;i++){
    const el=document.getElementById("s"+i);
    const tick=el.querySelector(".tick");

    if(i<n){
      el.className="step done";
      tick.innerText="✔";
    }else if(i===n){
      el.className="step active";
      tick.innerText="▶";
    }else{
      el.className="step";
      tick.innerText="❌";
    }
  }

  if(n > lastStep){
    feedback();
    lastStep = n;
  }
}

/* FILE DISPLAY */
document.getElementById("photoInput").addEventListener("change",(e)=>{
  const file=e.target.files[0];

  if(file){
    fileInfo.innerText = `📸 ${file.name} selected`;
    sizeInfo.innerText = `Original size: ${(file.size/1024/1024).toFixed(2)} MB`;
  } else {
    fileInfo.innerText = "No image selected";
    sizeInfo.innerText = "";
  }
});

/* COMPRESSOR */
async function compressImage(file, maxSize = 1600, quality = 0.82) {
  return new Promise((resolve) => {
    const reader = new FileReader();

    reader.onload = (e) => {
      const img = new Image();

      img.onload = () => {
        let w = img.width;
        let h = img.height;

        if (w > h && w > maxSize) {
          h = h * (maxSize / w);
          w = maxSize;
        } else if (h > maxSize) {
          w = w * (maxSize / h);
          h = maxSize;
        }

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;

        canvas.getContext("2d").drawImage(img, 0, 0, w, h);

        canvas.toBlob(blob => {
          const compressed = new File([blob], "photo.jpg", {
            type: "image/jpeg",
            lastModified: Date.now()
          });

          sizeInfo.innerText += ` → Compressed: ${(compressed.size/1024/1024).toFixed(2)} MB`;

          resolve(compressed);
        }, "image/jpeg", quality);
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}

/* BUTTONS */
document.getElementById("cameraBtn").onclick=()=>{
  const i=document.getElementById("photoInput");
  i.setAttribute("capture","environment");
  i.click();
};

document.getElementById("galleryBtn").onclick=()=>{
  const i=document.getElementById("photoInput");
  i.removeAttribute("capture");
  i.click();
};

setStep(1);

/* MAIN FLOW */
document.getElementById("activateBtn").onclick=async()=>{

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const tos=document.getElementById("tosCheckbox").checked;

  if(!name||!phone){
    status.innerText="Fill details";
    return;
  }

  if(!tos){
    status.innerText="You must accept Terms of Service";
    status.style.color="red";
    return;
  }

  try{

    setStep(2);
    bar.style.width="30%";
    status.innerText="Processing image...";

    const file=document.getElementById("photoInput").files[0];
    let photoURL="";

    if(file){

      status.innerText="Compressing image...";
      const compressed = await compressImage(file);

      setStep(2);
      status.innerText="Uploading photo...";
      bar.style.width="60%";

      const form=new FormData();
      form.append("file",compressed);
      form.append("upload_preset","arkforge-pets");

      const res=await fetch(
        "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",
        {method:"POST",body:form}
      );

      const data=await res.json();
      photoURL=data.secure_url;
    }

    setStep(3);
    status.innerText="Saving profile...";
    bar.style.width="85%";

    const ref=doc(db,"pets",id);
    const snap=await getDoc(ref);

    await setDoc(ref,{
      name,
      phone,
      phone2:document.getElementById("phone2").value.trim(),
      microchip:document.getElementById("microchip").value.trim(),
      photo:photoURL||snap.data().photo||"",
      status:"active",
      activatedAt:new Date().toISOString()
    },{merge:true});

    bar.style.width="100%";
    status.innerHTML="✅ Activated successfully! Redirecting...";

    let count = 5;

    const interval = setInterval(()=>{
      status.innerHTML = `✅ Activated successfully! Redirecting in ${count}...`;
      count--;

      if(count < 0){
        clearInterval(interval);
        window.location.href = `index.html?id=${id}`;
      }
    },1000);

  }catch(e){
    status.innerText="ERROR: "+e.message;
  }
};

</script>

</body>
</html>
