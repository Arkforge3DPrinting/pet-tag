<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* =========================
       BASE UPGRADE (SAFE)
       ========================= */

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffffff, #eef3f8);
      margin: 0;
      padding: 12px;
      color: #1c1c1e;
    }

    /* =========================
       CARD UPGRADE
       ========================= */

    .container {
      max-width: 420px;
      margin: auto;
      background: rgba(255,255,255,0.95);
      padding: 16px;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
      backdrop-filter: blur(8px);
    }

    /* =========================
       TYPOGRAPHY
       ========================= */

    h1 {
      font-size: 24px;
      margin: 0 0 6px 0;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 15px;
      color: #555;
      margin: 0 0 10px 0;
      line-height: 1.5;
    }

    /* =========================
       IMAGE UPGRADE (IMPORTANT)
       ========================= */

    #petPhoto {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 20px;
      margin: 12px auto;
      display: none;

      border: 4px solid rgba(255,255,255,0.9);
      box-shadow:
        0 0 0 3px #3b82f6,
        0 14px 30px rgba(0,0,0,0.18);
    }

    /* =========================
       BUTTON GRID
       ========================= */

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .single {
      grid-template-columns: 1fr !important;
      justify-items: center;
    }

    /* =========================
       BUTTONS (MODERNIZED)
       ========================= */

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #callBtn, #callBtn2 {
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    #textBtn, #textBtn2 {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    #locBtn, #locBtn2 {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }

    /* =========================
       LOCK SCREEN UPGRADE
       ========================= */

    #locked {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }

    .tagbox {
      margin-top: 14px;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      text-align: left;
    }

    .tagcode {
      font-family: monospace;
      font-size: 14px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      word-break: break-all;
    }

    .tagbtn {
      display: block;
      margin-top: 10px;
      padding: 12px;
      text-align: center;
      background: #3b82f6;
      color: white;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
    }

    /* subtle polish */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>

<div id="locked">
  <h2>🐾 Tag Not Activated</h2>
  <p>This pet tag must be activated before contact details are available.</p>

  <div class="tagbox">
    <div class="tagcode" id="tagCode"></div>
    <a id="tagLinkBtn" class="tagbtn" target="_blank">🔗 Activate This Tag</a>
  </div>
</div>

<div class="container" id="main">

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <img id="petPhoto">

  <div id="microchipText" style="font-size:15px; color:#666; margin-top:8px;"></div>

  <div id="btnGrid" class="grid">

    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call Secondary</button>

    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text Secondary</button>

    <button id="locBtn">📍 Send Location</button>
    <button id="locBtn2">📍 Send Location Secondary</button>

  </div>

  <div class="footer">
    Powered by ArkLink Pet ID ®
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");
const locked = document.getElementById("locked");

if (!id) {
  locked.style.display = "block";
  document.getElementById("tagCode").innerText = "INVALID";
  throw new Error("Missing ID");
}

document.getElementById("tagCode").innerText = id;
document.getElementById("tagLinkBtn").href =
  "https://arkforge3dprinting.github.io/pet-tag/activate.html?id=" + id;

function showMain() {
  main.style.display = "block";
}

function hide(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "none";
}

function setSingle() {
  document.getElementById("btnGrid").classList.add("single");
}

async function loadPet() {

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) {
    locked.style.display = "block";
    return;
  }

  const pet = snap.data();

  if (pet.status === "disabled") {
    document.body.innerHTML = `
      <div style="max-width:420px;margin:auto;margin-top:40px;background:white;padding:24px;border-radius:18px;text-align:center;font-family:Arial;box-shadow:0 6px 20px rgba(0,0,0,0.08);">
        <h2>⚠ Profile Disabled</h2>
        <p>This pet profile has been disabled.</p>
        <p>Please contact ArkLink Pet ID if this is an error.</p>
      </div>
    `;
    return;
  }

  if (pet.status !== "active") {
    locked.style.display = "block";
    return;
  }

  showMain();

  document.getElementById("title").innerText =
    "🐾 You found " + (pet.name || "a pet");

  document.getElementById("message").innerText =
    "Help get " + (pet.name || "this pet") + " home safely.";

  const chipEl = document.getElementById("microchipText");

  if (chipEl) {
    chipEl.innerHTML = pet.microchip
      ? "Microchip: <b>" + pet.microchip + "</b>"
      : "";
  }

  const img = document.getElementById("petPhoto");

  if (pet.photo) {
    img.src = pet.photo;
    img.style.display = "block";
  }

  const hasSecondary = pet.phone2 && pet.phone2.trim() !== "";

  document.getElementById("callBtn").onclick =
    () => window.location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick =
    () => window.open(
      `sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
      "_self"
    );

  document.getElementById("locBtn").onclick = () => {

    const btn = document.getElementById("locBtn");

    btn.disabled = true;
    btn.innerText = "📡 Getting location...";

    navigator.geolocation.getCurrentPosition(pos => {

      const msg =
        "I found " + pet.name +
        ". Location: https://maps.google.com/?q=" +
        pos.coords.latitude + "," + pos.coords.longitude;

      btn.disabled = false;
      btn.innerText = "📍 Send Location";

      window.open(`sms:${pet.phone}?body=${encodeURIComponent(msg)}`, "_self");

    }, () => {
      btn.disabled = false;
      btn.innerText = "📍 Send Location";
      alert("Unable to get GPS location.");
    });
  };

  if (hasSecondary) {

    document.getElementById("callBtn2").onclick =
      () => window.location.href = "tel:" + pet.phone2;

    document.getElementById("textBtn2").onclick =
      () => window.open(
        `sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
        "_self"
      );

    document.getElementById("locBtn2").onclick = () => {

      const btn = document.getElementById("locBtn2");

      btn.disabled = true;
      btn.innerText = "📡 Getting location...";

      navigator.geolocation.getCurrentPosition(pos => {

        const msg =
          "I found " + pet.name +
          ". Location: https://maps.google.com/?q=" +
          pos.coords.latitude + "," + pos.coords.longitude;

        btn.disabled = false;
        btn.innerText = "📍 Send Location Secondary";

        window.open(`sms:${pet.phone2}?body=${encodeURIComponent(msg)}`, "_self");

      }, () => {
        btn.disabled = false;
        btn.innerText = "📍 Send Location Secondary";
        alert("Unable to get GPS location.");
      });
    };

  } else {
    hide("callBtn2");
    hide("textBtn2");
    hide("locBtn2");
    setSingle();
  }
}

loadPet();
</script>

</body>
</html>
