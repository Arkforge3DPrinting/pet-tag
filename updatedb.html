<!DOCTYPE html>
<html>
<head>
  <title>Create Pet Tag NFC</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>

    /* 🔥 FIX OVERFLOW ISSUE */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 18px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin: 0 0 10px 0;
      text-align: center;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
    }

    .full {
      grid-column: span 2;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #generateBtn {
      background: #3b82f6;
      color: white;
    }

    #result {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      word-break: break-word;
    }

    .bottom {
      display: flex;
      gap: 14px;
      margin-top: 14px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    #qrBox {
      display: flex;
      justify-content: center;
    }

    #downloadSection button {
      background: #111;
      color: white;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
    }

    .meta {
      font-size: 12px;
      color: #555;
    }

  </style>
</head>

<body>

<div class="card">

  <h2>Create NFC Pet Tag</h2>

  <div class="grid">

    <input id="name" placeholder="Pet Name" class="full">
    <input id="phone" placeholder="Primary Phone">
    <input id="phone2" placeholder="Secondary (optional)">

    <button id="generateBtn" class="full">Generate & Save</button>

  </div>

  <div id="result"></div>

  <div class="bottom">

    <div id="qrBox"></div>

    <div id="downloadSection"></div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  Document,
  Packer,
  Paragraph,
  TextRun,
  ImageRun
} from "https://cdn.jsdelivr.net/npm/docx@8.5.0/+esm";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const defaultPhoto =
  "https://res.cloudinary.com/ddsp7ps7p/image/upload/v1776062761/placeholderpaw_a29ok1.jpg";

function idGen(len = 10) {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  return Array.from({ length: len }, () =>
    chars[Math.floor(Math.random() * chars.length)]
  ).join("");
}

function reset() {
  document.getElementById("qrBox").innerHTML = "";
  document.getElementById("downloadSection").innerHTML = "";
}

function qrBase64() {
  return document.querySelector("#qrBox canvas")?.toDataURL("image/png");
}

document.getElementById("generateBtn").onclick = async () => {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();

  reset();

  if (!name || !phone) return;

  const id = idGen();

  const url =
    `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`;

  await setDoc(doc(db, "pets", id), {
    name,
    phone,
    phone2: phone2 || "",
    photo: defaultPhoto
    status: "inactive"
  });

  document.getElementById("result").innerHTML =
    `<div class="meta"><b>ID:</b> ${id}</div>
     <div class="meta">${url}</div>`;

  new QRCode(document.getElementById("qrBox"), {
    text: url,
    width: 140,
    height: 140
  });

  document.getElementById("downloadSection").innerHTML = `
    <button id="docBtn">Download Letter</button>
  `;

  document.getElementById("docBtn").onclick = async () => {

    const doc = new Document({
      sections: [{
        children: [

          new Paragraph({
            children: [
              new TextRun({ text: "Pet Tag Activation", bold: true })
            ]
          }),

          new Paragraph(""),
          new Paragraph(`Pet: ${name}`),
          new Paragraph(`Link: ${url}`),

          new Paragraph(""),
          new Paragraph({
            children: [
              new TextRun({ text: "Scan QR to access profile", bold: true })
            ]
          }),

/* QR */
          new Paragraph({
            children: [
              new ImageRun({
                data: qrBase64(),
                transformation: { width: 140, height: 140 }
              })
            ]
          }),

/* instructions */
          new Paragraph(""),
          new Paragraph("Scan → view profile → contact owner."),
          new Paragraph("Keep details updated for fast recovery."),

        ]
      }]
    });

    const blob = await Packer.toBlob(doc);
    saveAs(blob, `${name}-tag.docx`);
  };

};

</script>

</body>
</html>
