<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      display: none; /* 🔒 hidden until validation passes */
    }

    h2 { margin-bottom: 4px; }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
    }

    .camera { background: #ff9f43; }
    .gallery { background: #3b82f6; }
    .activate { background: #3b82f6; font-size: 18px; }

    .tos-box {
      text-align: left;
      font-size: 13px;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      margin: 12px 0;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
      min-height: 20px;
    }

    /* 🔒 BLOCK SCREEN */
    #blocked {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }
  </style>
</head>

<body>

<!-- 🔒 BLOCK SCREEN -->
<div id="blocked">
  <h2>🐾 Tag Not Activated</h2>
  <p>
    This pet tag must be activated before it can be used.
  </p>

  <div style="
    margin-top: 15px;
    padding: 14px;
    background: #f3f4f6;
    border-radius: 12px;
    font-size: 13px;
    text-align: left;
  ">
    <b>Activation required:</b><br><br>

    Please follow the instructions included in your packaging and scan the official QR code to complete setup.
    Once activated, this tag will unlock automatically.
  </div>
</div>

<!-- 🔓 MAIN FORM -->
<div class="container" id="mainForm">

  <h2>Activate Pet Tag</h2>

  <div class="tagid">
    Tag ID: <span id="tagIdDisplay"></span>
  </div>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">

  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <div class="tos-box">
    <label>
      <input type="checkbox" id="tosCheckbox">
      I agree to Terms of Service and understand this profile may be publicly visible when scanned.
    </label>
  </div>

  <button class="btn activate" id="activateBtn">Activate</button>

  <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlId = new URLSearchParams(window.location.search).get("id");

const status = document.getElementById("status");

const mainForm = document.getElementById("mainForm");
const blocked = document.getElementById("blocked");

if (!urlId) {
  blocked.style.display = "block";
  blocked.innerHTML = "<h2>❌ Invalid Link</h2>";
  throw new Error("Missing ID");
}

document.getElementById("tagIdDisplay").innerText = urlId;

// 🔒 PRE-CHECK TAG STATUS BEFORE SHOWING FORM
(async () => {

  try {

    const ref = doc(db, "pets", urlId);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      blocked.style.display = "block";
      blocked.innerHTML = "<h2>❌ Tag Not Found</h2>";
      return;
    }

    const data = snap.data();

    // 🚫 HARD LOCK IF NOT ACTIVE
    if (data.status !== "active") {
      blocked.style.display = "block";
      return;
    }

    // ✔ ALLOW ACCESS
    mainForm.style.display = "block";

  } catch (e) {
    blocked.style.display = "block";
    blocked.innerHTML = "<h2>❌ Error loading tag</h2>";
  }

})();

const photoInput = document.getElementById("photoInput");

document.getElementById("cameraBtn").onclick = () => {
  photoInput.setAttribute("capture", "environment");
  photoInput.click();
};

document.getElementById("galleryBtn").onclick = () => {
  photoInput.removeAttribute("capture");
  photoInput.click();
};

// ACTIVATE
document.getElementById("activateBtn").onclick = async () => {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();
  const tos = document.getElementById("tosCheckbox").checked;

  if (!name || !phone) {
    status.innerText = "⚠ Fill required fields";
    return;
  }

  if (!tos) {
    status.innerText = "⚠ Accept Terms of Service";
    return;
  }

  try {

    const ref = doc(db, "pets", urlId);
    const existingSnap = await getDoc(ref);

    if (!existingSnap.exists()) {
      status.innerText = "❌ Tag not registered";
      return;
    }

    const existing = existingSnap.data();

    let photoURL = "";
    const file = photoInput.files[0];

    if (file) {
      const form = new FormData();
      form.append("file", file);
      form.append("upload_preset", "arkforge-pets");

      const res = await fetch(
        "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",
        { method: "POST", body: form }
      );

      const data = await res.json();
      photoURL = data.secure_url;
    }

    await setDoc(ref, {
      name,
      phone,
      phone2: phone2 || existing.phone2 || "",
      photo: photoURL || existing.photo,
      tosAccepted: true,
      status: "active",
      activatedAt: new Date().toISOString()
    }, { merge: true });

    status.innerText = "✅ Activated successfully!";

  } catch (e) {
    status.innerText = "❌ " + e.message;
  }

};

</script>

</body>
</html>
