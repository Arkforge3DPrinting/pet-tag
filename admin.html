<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
</head>

<body style="font-family: Arial; padding:20px; max-width:900px; margin:auto;">

<h2>🐾 Pet Tag Admin Dashboard</h2>

<input id="search" placeholder="Search Tag ID..." style="width:100%; padding:8px;">
<br><br>

<button onclick="loadPets()">Refresh List</button>

<hr>

<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 Firebase config (same as your project)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const listDiv = document.getElementById("list");

// -----------------------------
// LOAD ALL PETS
// -----------------------------
window.loadPets = async function () {

  listDiv.innerHTML = "Loading...";

  const snap = await getDocs(collection(db, "pets"));

  listDiv.innerHTML = "";

  snap.forEach(docSnap => {
    const data = docSnap.data();
    const id = docSnap.id;

    const div = document.createElement("div");
    div.style = "border:1px solid #ccc; padding:10px; margin-bottom:10px;";

    div.innerHTML = `
      <b>Tag ID:</b> ${id}<br><br>

      <input value="${data.name || ""}" id="name-${id}" placeholder="Name"><br><br>
      <input value="${data.phone || ""}" id="phone-${id}" placeholder="Phone"><br><br>

      ${data.photo ? `<img src="${data.photo}" style="max-width:120px;"><br><br>` : ""}

      <button onclick="save('${id}')">💾 Save</button>
      <button onclick="removeTag('${id}')">🗑 Delete</button>
    `;

    listDiv.appendChild(div);
  });
};

// -----------------------------
// SAVE UPDATES
// -----------------------------
window.save = async function (id) {

  const name = document.getElementById("name-" + id).value;
  const phone = document.getElementById("phone-" + id).value;

  await updateDoc(doc(db, "pets", id), {
    name,
    phone
  });

  alert("Updated " + id);
};

// -----------------------------
// DELETE TAG
// -----------------------------
window.removeTag = async function (id) {

  if (!confirm("Delete this tag?")) return;

  await deleteDoc(doc(db, "pets", id));

  alert("Deleted " + id);
  loadPets();
};

// -----------------------------
// SEARCH FILTER
// -----------------------------
document.getElementById("search").addEventListener("input", async (e) => {

  const value = e.target.value.toLowerCase();

  const snap = await getDocs(collection(db, "pets"));

  listDiv.innerHTML = "";

  snap.forEach(docSnap => {
    const id = docSnap.id;
    const data = docSnap.data();

    if (!id.toLowerCase().includes(value)) return;

    const div = document.createElement("div");
    div.style = "border:1px solid #ccc; padding:10px; margin-bottom:10px;";

    div.innerHTML = `
      <b>Tag ID:</b> ${id}<br><br>

      <input value="${data.name || ""}" id="name-${id}" placeholder="Name"><br><br>
      <input value="${data.phone || ""}" id="phone-${id}" placeholder="Phone"><br><br>

      ${data.photo ? `<img src="${data.photo}" style="max-width:120px;"><br><br>` : ""}

      <button onclick="save('${id}')">💾 Save</button>
      <button onclick="removeTag('${id}')">🗑 Delete</button>
    `;

    listDiv.appendChild(div);
  });
});

// initial load
loadPets();

</script>

</body>
</html>
