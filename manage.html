<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Manage Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 460px;
      margin: auto;
      background: linear-gradient(180deg, #ffffff, #fbfcfd);
      padding: 16px;
      border-radius: 22px;
      border: 1px solid rgba(59,130,246,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
      text-align: center;
    }

    p {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 10px;
    }

    .contextBox {
      margin: 10px auto 14px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #eef6ff;
      border: 1px solid rgba(59,130,246,0.25);
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      color: #1f2937;
    }

    .smallId {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
    }

    .section {
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    label {
      font-size: 12px;
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #444;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-top: 8px;
    }

    .lostBtn { background: #ef4444; }
    .safeBtn { background: #28c76f; }
    .saveBtn { background: #3b82f6; }

    .statusBox {
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 10px;
    }

    .safe { background: #eafff1; color: #1a7f3c; }
    .lost { background: #ffecec; color: #a31212; }

    .photoWrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #preview {
      width: 160px;
      height: 160px;
      border-radius: 18px;
      object-fit: cover;
      border: 3px solid rgba(34,197,94,0.35);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.12);
      animation: pulseGlow 2.8s infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
      50% { box-shadow: 0 0 18px rgba(34,197,94,0.35); }
      100% { box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
    }

    .photoBtns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .photoBtn {
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
    }

    .photoBtn.cam { background: #f97316; }
    .photoBtn.up { background: #2563eb; }

    input[type="file"] { display: none; }

    .fileInfo {
      font-size: 12px;
      color: #555;
      text-align: center;
      margin-top: 6px;
    }

    /* ✅ NEW UPLOAD UI */
    .uploadProgressWrap {
      width: 100%;
      margin-top: 8px;
      display: none;
    }

    .progressBar {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progressFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#3b82f6,#22c55e);
      transition: width 0.2s ease;
    }

    .uploadText {
      font-size: 12px;
      text-align: center;
      margin-top: 6px;
      color: #2563eb;
      font-weight: 700;
    }

    .microchipBox {
      margin-top: 8px;
      padding: 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 13px;
      font-family: monospace;
    }

    .microchipEditToggle {
      margin-top: 6px;
      font-size: 12px;
      color: #2563eb;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      user-select: none;
    }

    #microchipInput,
    #petNameInput {
      display: none;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .successMsg {
      margin-top: 12px;
      font-weight: 900;
      color: #16a34a;
      text-align: center;
      display: none;
    }

    .successSub {
      font-size: 12px;
      color: #15803d;
      text-align: center;
      margin-top: 4px;
      display: none;
    }
    /* =========================
   UNIFIED FIELD SYSTEM
   (this fixes EVERYTHING)
========================= */

:root {
  --field-bg: #ffffff;
  --field-border: #e5e7eb;
  --field-radius: 10px;
  --field-padding: 10px;
  --field-font: 13px;
}

/* apply to ALL inputs */
input {
  width: 100%;
  padding: var(--field-padding);
  border-radius: var(--field-radius);
  border: 1px solid var(--field-border);
  font-size: var(--field-font);
  background: var(--field-bg);
  box-sizing: border-box;
  margin-bottom: 8px;
}

/* Make all input fields same var */
.microchipBox {
  width: 100%;
  padding: var(--field-padding);
  border-radius: var(--field-radius);
  border: 1px solid var(--field-border);
  font-size: var(--field-font);
  background: var(--field-bg);
  box-sizing: border-box;
  font-family: inherit; /* important: removes monospace mismatch */
}
  </style>
</head>

<body>

<div class="container">

  <h1>Manage Portal PLS 3</h1>
  <p>Update your pet’s details instantly</p>

  <div class="contextBox">
    You are editing: <span id="petNameLabel">Loading...</span><br>
    <span class="smallId">Tag ID: <span id="tagIdLabel"></span></span>
  </div>

  <div id="statusDisplay" class="statusBox">Loading...</div>

  <div class="section">
    <label>Status - Use these buttons below</label>
    <button class="lostBtn" onclick="setStatus('lost')">🔴 Mark as Lost</button>
    <button class="safeBtn" onclick="setStatus('safe')">🟢 Mark as Safe</button>
  </div>

  <div class="section">
    <label>Primary Phone</label>
    <input id="phone">

    <label>Secondary Phone</label>
    <input id="phone2">
  </div>

<div class="section">
  <label>Pet Name</label>

  <div class="microchipEditToggle" onclick="togglePetNameEdit()">
    ✏️ Edit pet namess
  </div>

  <input id="petNameInput" style="display:none;">
</div>

<div class="section">
  <label>Microchip</label>

  <div class="microchipBox" id="microchipDisplay">Loading...</div>

  <div class="microchipEditToggle" onclick="toggleMicrochipEdit()">
    ✏️ Edit microchipss
  </div>

  <input id="microchipInput" style="display:none;">
</div>

  <div class="section">
    <label>Photo</label>

    <div class="photoWrap">
      <img id="preview">

      <div class="photoBtns">
        <button class="photoBtn cam" onclick="openCamera()">📷 Camera</button>
        <button class="photoBtn up" onclick="openGallery()">📁 Upload</button>
      </div>

      <input type="file" id="fileInput" accept="image/*">
      <div class="fileInfo" id="fileInfo"></div>

      <!-- ✅ NEW PROGRESS -->
      <div class="uploadProgressWrap" id="uploadBox">
        <div class="progressBar">
          <div class="progressFill" id="progressFill"></div>
        </div>
        <div class="uploadText" id="uploadText"></div>
      </div>

    </div>
  </div>

  <button class="saveBtn" id="saveBtn" onclick="save()">💾 Save Changes</button>

  <div class="successMsg" id="successMsg">Saved successfully</div>
  <div class="successSub" id="successSub">Please reload the page to make any additional changes if required.</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(location.search).get("id");
const ref = doc(db, "pets", id);

let petData = null;
let selectedFile = null;
let previewURL = null;

/* LOAD */
async function load() {
  const snap = await getDoc(ref);
  if (!snap.exists()) return;

  petData = snap.data();

  document.getElementById("phone").value = petData.phone || "";
  document.getElementById("phone2").value = petData.phone2 || "";
  document.getElementById("preview").src = petData.photo || "";

  document.getElementById("petNameLabel").innerText = petData.name || "Unknown Pet";
  document.getElementById("tagIdLabel").innerText = id;

  document.getElementById("microchipDisplay").innerText =
    petData.microchip || "Not set";

  updateStatusUI();
}

/* STATUS */
window.setStatus = async (status) => {
  await updateDoc(ref, { 
    petStatus: status,
    updatedAt: new Date()
  });

  petData.petStatus = status;
  updateStatusUI();
};

function updateStatusUI() {
  const box = document.getElementById("statusDisplay");
  if (!petData) return;

  if (petData.petStatus === "lost") {
    box.className = "statusBox lost";
    box.innerText = "Status: LOST";
  } else {
    box.className = "statusBox safe";
    box.innerText = "Status: SAFE";
  }
}

/* TOGGLES */
window.toggleMicrochipEdit = () => {
  const input = document.getElementById("microchipInput");
  input.style.display = input.style.display === "block" ? "none" : "block";
  input.value = petData.microchip || "";
};

window.togglePetNameEdit = () => {
  const input = document.getElementById("petNameInput");
  input.style.display = input.style.display === "block" ? "none" : "block";
  input.value = petData.name || "";
};

/* PHOTO */
window.openCamera = () => {
  const i = document.getElementById("fileInput");
  i.setAttribute("capture", "environment");
  i.click();
};

window.openGallery = () => {
  const i = document.getElementById("fileInput");
  i.removeAttribute("capture");
  i.click();
};

/* ✅ INSTANT PREVIEW + FILE STORE */
document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  selectedFile = file;

  // 🔥 INSTANT PREVIEW (NO UPLOAD)
  if (previewURL) URL.revokeObjectURL(previewURL);
  previewURL = URL.createObjectURL(file);
  document.getElementById("preview").src = previewURL;

  document.getElementById("fileInfo").innerText =
    `${file.name} selected (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
});

/* =========================
   CLOUDINARY WITH PROGRESS
========================= */
function uploadToCloudinary(file, onProgress) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", "arkforge-pets");

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload");

    xhr.upload.onprogress = (event) => {
      if (event.lengthComputable && onProgress) {
        const percent = Math.round((event.loaded / event.total) * 100);
        onProgress(percent);
      }
    };

    xhr.onload = () => {
      const data = JSON.parse(xhr.responseText);
      if (!data.secure_url) reject("Upload failed");
      else resolve(data.secure_url);
    };

    xhr.onerror = () => reject("Network error");

    xhr.send(form);
  });
}

/* =========================
   IMAGE COMPRESSION
========================= */
async function compressImage(file, maxSize = 1600, quality = 0.82) {
  return new Promise((resolve) => {
    const reader = new FileReader();

    reader.onload = (e) => {
      const img = new Image();

      img.onload = () => {
        let w = img.width;
        let h = img.height;

        if (w > h && w > maxSize) {
          h = h * (maxSize / w);
          w = maxSize;
        } else if (h > maxSize) {
          w = w * (maxSize / h);
          h = maxSize;
        }

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;

        canvas.getContext("2d").drawImage(img, 0, 0, w, h);

        canvas.toBlob(blob => {
          resolve(new File([blob], "photo.jpg", {
            type: "image/jpeg",
            lastModified: Date.now()
          }));
        }, "image/jpeg", quality);
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}

/* =========================
   SAVE WITH UPLOAD PROGRESS UI
========================= */
window.save = async () => {

  const btn = document.getElementById("saveBtn");
  const statusBox = document.getElementById("statusDisplay");

  btn.disabled = true;

  let photoURL = petData.photo || "";

  try {

    if (selectedFile) {

      // show upload state
      statusBox.className = "statusBox safe";
      statusBox.innerText = "Uploading image... 0%";

      const compressed = await compressImage(selectedFile);

      photoURL = await uploadToCloudinary(compressed, (percent) => {
        statusBox.innerText = `Uploading image... ${percent}%`;
      });

      statusBox.innerText = "Upload complete ✔";
    }

    const microchipVal =
      document.getElementById("microchipInput").style.display === "block"
        ? document.getElementById("microchipInput").value.trim()
        : petData.microchip;

    const nameVal =
      document.getElementById("petNameInput").style.display === "block"
        ? document.getElementById("petNameInput").value.trim()
        : petData.name;

    await updateDoc(ref, {
      phone: document.getElementById("phone").value,
      phone2: document.getElementById("phone2").value,
      photo: photoURL,
      microchip: microchipVal,
      name: nameVal,
      updatedAt: new Date()
    });

    document.getElementById("successMsg").style.display = "block";
    document.getElementById("successSub").style.display = "block";

  } catch (err) {
    statusBox.innerText = "Upload failed: " + err;
    btn.disabled = false;
  }
};

load();
</script>
</body>
</html>
