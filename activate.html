<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      animation: pop 220ms ease;
    }

    @keyframes pop {
      from { transform: scale(0.98); opacity: 0.6; }
      to { transform: scale(1); opacity: 1; }
    }

    h2 { margin-bottom: 6px; }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    input:focus { outline: none; border-color: #3b82f6; }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
    }

    .camera { background: #ff9f43; }
    .gallery { background: #3b82f6; }
    .activate { background: #3b82f6; font-size: 18px; }

    .tos-box {
      text-align: left;
      font-size: 13px;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      margin: 12px 0;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
      min-height: 20px;
    }

    .error { color: #d11a2a; }
    .ok { color: #0a7a2f; }

    /* STEP UI */
    .steps {
      font-size: 13px;
      text-align: left;
      margin: 10px 0 14px;
      padding: 10px;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #eee;
    }

    .step { margin: 4px 0; }
    .done { color: #16a34a; font-weight: bold; }
    .active { color: #2563eb; font-weight: bold; }

    /* PROGRESS */
    .progress {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      transition: width 300ms ease;
    }

  </style>
</head>

<body>

<div class="container">

  <h2>Activate Pet Tag</h2>

  <div class="tagid">
    Tag ID: <span id="tagIdDisplay"></span>
  </div>

  <div class="steps" id="steps">
    <div class="step active" id="s1">○ Step 1: Enter details</div>
    <div class="step" id="s2">○ Step 2: Add photo (optional)</div>
    <div class="step" id="s3">○ Step 3: Activate</div>
  </div>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">
  <input id="microchip" placeholder="Microchip number (optional)">
  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <div class="tos-box">
    <label>
      <input type="checkbox" id="tosCheckbox">
      I agree to Terms of Service
    </label>
  </div>

  <button class="btn activate" id="activateBtn">Activate</button>

  <div class="progress" id="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
});

const db = getFirestore(app);

/* ELEMENTS */
const statusEl = document.getElementById("status");
const btn = document.getElementById("activateBtn");
const bar = document.getElementById("bar");
const progress = document.getElementById("progress");
const photoInput = document.getElementById("photoInput");

const urlId = new URLSearchParams(location.search).get("id");

/* STATUS */
function setStatus(msg,type=""){
  statusEl.innerText = msg;
  statusEl.className = type;
}

/* STEPS */
function step(n){
  const s1=document.getElementById("s1");
  const s2=document.getElementById("s2");
  const s3=document.getElementById("s3");

  s1.className = n>=1 ? "step done" : "step";
  s2.className = n>=2 ? "step done" : (n===2 ? "step active":"step");
  s3.className = n>=3 ? "step done" : (n===3 ? "step active":"step");
}

/* PROGRESS */
function setProgress(p){
  progress.style.display="block";
  bar.style.width=p+"%";
}

/* CAMERA */
document.getElementById("cameraBtn").onclick=()=>{
  photoInput.setAttribute("capture","environment");
  photoInput.click();
};

document.getElementById("galleryBtn").onclick=()=>{
  photoInput.removeAttribute("capture");
  photoInput.click();
};

/* IMAGE COMPRESSION */
async function compress(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas");
        const scale=Math.min(1,Math.sqrt((2*1024*1024)/file.size));
        c.width=img.width*scale;
        c.height=img.height*scale;
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>res(new File([b],"img.jpg",{type:"image/jpeg"})),"image/jpeg",0.85);
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

/* INIT */
if(!urlId){
  setStatus("Invalid link","error");
}else{
  document.getElementById("tagIdDisplay").innerText=urlId;
}

let running=false;

document.getElementById("activateBtn").onclick=async()=>{

  if(running) return;

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const phone2=document.getElementById("phone2").value.trim();
  const tos=document.getElementById("tosCheckbox").checked;

  if(!name||!phone) return setStatus("Fill required fields","error");
  if(!tos) return setStatus("Accept Terms","error");

  running=true;
  btn.disabled=true;

  step(1);

  try{

    setProgress(10);
    setStatus("Checking tag...");

    const ref=doc(db,"pets",urlId);
    const snap=await getDoc(ref);
    if(!snap.exists()) throw new Error("Tag not found");

    step(2);

    let file=photoInput.files[0];
    let photoURL="";

    if(file){
      setStatus("Compressing photo...");
      file=await compress(file);
    }

    if(file){
      setStatus("Uploading photo...");
      setProgress(40);

      const form=new FormData();
      form.append("file",file);
      form.append("upload_preset","arkforge-pets");

      const res=await fetch("https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",{method:"POST",body:form});
      const data=await res.json();

      photoURL=data.secure_url;
    }

    step(3);

    setStatus("Saving profile...");
    setProgress(80);

    const ex=snap.data();

    await setDoc(ref,{
      name,
      phone,
      phone2,
      microchip:document.getElementById("microchip").value.trim()||ex.microchip||"",
      photo:photoURL||ex.photo||"",
      status:"active",
      activatedAt:new Date().toISOString()
    },{merge:true});

    setProgress(100);

    setStatus("✓ Your tag is now active","ok");

    setTimeout(()=>{
      location.href=`https://arkforge3dprinting.github.io/pet-tag/index.html?id=${urlId}`;
    },2000);

  }catch(e){
    setStatus("❌ "+e.message,"error");
    running=false;
    btn.disabled=false;
  }
};

</script>

</body>
</html>
