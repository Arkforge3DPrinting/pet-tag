<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    h2 { margin-bottom: 12px; }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    /* FILTER PILLS */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filters button {
      padding: 10px 14px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: bold;
      background: #e5e7eb;
      transition: 0.2s;
    }

    .filters button.active.all { background: #374151; color: white; }
    .filters button.active.active { background: #22c55e; color: white; }
    .filters button.active.inactive { background: #f59e0b; color: white; }
    .filters button.active.disabled { background: #ef4444; color: white; }

    /* CARD */
    .card {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .id-btn {
      background: #111827;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      color: white;
    }

    .badge.active { background: #22c55e; }
    .badge.inactive { background: #f59e0b; }
    .badge.disabled { background: #ef4444; }

    /* ROW */
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    /* BIGGER IMAGE (your request) */
    img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #eee;
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 160px;
      flex: 1;
    }

    .field label {
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.action {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }

    button.disable {
      background: #7c3aed;
    }

    .qr {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>🐾 Dashboard</h2>

<input id="search" placeholder="Search ID, name, phone...">

<div class="filters">
  <button class="all active" onclick="setFilter('all', this)">📦 All</button>
  <button class="active" onclick="setFilter('active', this)">🟢 Active</button>
  <button class="inactive" onclick="setFilter('inactive', this)">🟠 Inactive</button>
  <button class="disabled" onclick="setFilter('disabled', this)">🔴 Disabled</button>
</div>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  query
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let pets = [];
let filter = "all";
let search = "";

const listDiv = document.getElementById("list");

/* SIMPLE, STABLE AUTH (NO FLASH BUGS) */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  start();
});

function start() {
  onSnapshot(query(collection(db, "pets")), (snap) => {
    pets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

/* SEARCH */
document.getElementById("search").addEventListener("input", (e) => {
  search = (e.target.value || "").toLowerCase();
  render();
});

/* FILTER */
window.setFilter = (f, btn) => {
  filter = f;
  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
};

/* COPY ID */
window.copyId = async (id) => {
  await navigator.clipboard.writeText(id);
  alert("Copied: " + id);
};

/* SAVE */
window.savePet = async (id) => {
  const ref = doc(db, "pets", id);

  await updateDoc(ref, {
    name: document.getElementById("name-" + id).value,
    phone: document.getElementById("phone-" + id).value,
    phone2: document.getElementById("phone2-" + id).value
  });
};

/* TOGGLE */
window.toggleDisable = async (id) => {
  const ref = doc(db, "pets", id);
  const pet = pets.find(p => p.id === id);

  await updateDoc(ref, {
    status: pet.status === "disabled" ? "active" : "disabled"
  });
};

/* QR */
function makeQR(id) {
  const el = document.getElementById("qr-" + id);
  if (!el) return;

  el.innerHTML = "";

  new QRCode(el, {
    text: `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`,
    width: 90,
    height: 90
  });
}

/* RENDER */
function render() {

  listDiv.innerHTML = "";

  const s = search;

  const filtered = pets.filter(p => {

    const match =
      (p.id || "").includes(s) ||
      (p.name || "").toLowerCase().includes(s) ||
      (p.phone || "").includes(s);

    if (!match) return false;

    if (filter === "active") return p.status === "active";
    if (filter === "inactive") return !p.status || p.status === "inactive";
    if (filter === "disabled") return p.status === "disabled";

    return true;
  });

  filtered.forEach(p => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="meta">
        <b>${p.id}</b>
        <button class="id-btn" onclick="copyId('${p.id}')">Copy</button>
        <span class="badge ${p.status || 'inactive'}">
          ${p.status || 'inactive'}
        </span>
      </div>

      <div class="row">

        <img src="${p.photo || ''}" onerror="this.style.display='none'">

        <div class="field">
          <label>Name</label>
          <input id="name-${p.id}" value="${p.name || ""}">
        </div>

        <div class="field">
          <label>Primary Phone</label>
          <input id="phone-${p.id}" value="${p.phone || ""}">
        </div>

        <div class="field">
          <label>Secondary Phone</label>
          <input id="phone2-${p.id}" value="${p.phone2 || ""}">
        </div>

      </div>

      <div class="buttons">
        <button class="action" onclick="savePet('${p.id}')">Save</button>
        <button class="action disable" onclick="toggleDisable('${p.id}')">
          ${p.status === "disabled" ? "Re-enable" : "Disable"}
        </button>
      </div>

      <div class="qr" id="qr-${p.id}"></div>
    `;

    listDiv.appendChild(div);

    setTimeout(() => makeQR(p.id), 50);
  });
}

</script>

</body>
</html>
