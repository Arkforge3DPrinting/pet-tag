<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg,#eef2ff,#f4f6f8);
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      border: 2px solid #e5e7eb;
    }

    h2 { margin-bottom: 6px; }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      word-break: break-all;
    }

    /* LIVE PREVIEW CARD */
    .preview {
      background: #0f172a;
      color: white;
      padding: 10px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-size: 13px;
      text-align: left;
    }

    .preview strong { color: #60a5fa; }

    /* STEPS */
    .steps {
      text-align: left;
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .step {
      padding: 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 200ms ease;
    }

    .step.active {
      background: #dbeafe;
      border: 1px solid #3b82f6;
      transform: scale(1.02);
    }

    .step.done {
      background: #dcfce7;
      border: 1px solid #22c55e;
    }

    .tick { width: 20px; font-weight: 900; }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 2px solid #ddd;
      font-size: 15px;
    }

    input:focus { border-color: #3b82f6; outline: none; }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }

    .camera { background: #f97316; }
    .gallery { background: #2563eb; }
    .activate { background: #16a34a; font-size: 18px; }

    .tos-box {
      text-align: left;
      font-size: 13px;
      padding: 10px;
      background: #fafafa;
      border: 2px solid #eee;
      border-radius: 10px;
      margin: 12px 0;
    }

    /* PROGRESS */
    .progress {
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
      border: 2px solid #d1d5db;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#22c55e,#16a34a);
      transition: width 250ms ease;
    }

    /* SCAN EFFECT */
    .scan {
      height: 6px;
      background: linear-gradient(90deg,transparent,#60a5fa,transparent);
      position: relative;
      animation: scan 1.2s infinite linear;
      margin-top: 10px;
      display: none;
    }

    @keyframes scan {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    .status {
      margin-top: 10px;
      font-weight: 800;
      font-size: 14px;
      min-height: 20px;
    }

    .error { color: #dc2626; }
    .ok { color: #16a34a; }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .success {
      font-size: 20px;
      font-weight: 900;
      color: #16a34a;
    }
  </style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">

  <h2>Activate Pet Tag</h2>

  <div class="tagid">Tag ID: <span id="tagIdDisplay"></span></div>

  <!-- LIVE PREVIEW -->
  <div class="preview" id="preview">
    <strong>Live Preview</strong><br>
    Name: <span id="pName">-</span><br>
    Phone: <span id="pPhone">-</span>
  </div>

  <div class="steps">
    <div class="step" id="s1"><span class="tick">❌</span> Enter details</div>
    <div class="step" id="s2"><span class="tick">❌</span> Add photo</div>
    <div class="step" id="s3"><span class="tick">❌</span> Activate tag</div>
  </div>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">
  <input id="microchip" placeholder="Microchip number (optional)">
  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <div class="tos-box">
    <label>
      <input type="checkbox" id="tosCheckbox">
      I agree to Terms of Service
    </label>
  </div>

  <button class="btn activate" id="activateBtn">ACTIVATE TAG</button>

  <div class="scan" id="scan"></div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="status" id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6b...",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
});

const db = getFirestore(app);
const id = new URLSearchParams(location.search).get("id");

document.getElementById("tagIdDisplay").innerText = id;

/* SOUND ENGINE */
function beep(type){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator();
  const g=ctx.createGain();

  const freq={
    click:300,
    success:600,
    error:180,
    upload:420
  }[type]||300;

  o.frequency.value=freq;
  o.type="square";
  g.gain.value=0.05;

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  setTimeout(()=>o.stop(),120);
}

/* STEP UI */
function setStep(n){
  for(let i=1;i<=3;i++){
    const el=document.getElementById("s"+i);
    const tick=el.querySelector(".tick");

    if(i<n){
      el.className="step done";
      tick.innerText="✔";
    }else if(i===n){
      el.className="step active";
      tick.innerText="▶";
    }else{
      el.className="step";
      tick.innerText="❌";
    }
  }
}

/* LIVE PREVIEW */
function bindPreview(){
  const n=document.getElementById("name");
  const p=document.getElementById("phone");

  n.oninput=()=>document.getElementById("pName").innerText=n.value||"-";
  p.oninput=()=>document.getElementById("pPhone").innerText=p.value||"-";
}

/* SCAN */
function scan(on){
  document.getElementById("scan").style.display=on?"block":"none";
}

/* CONFETTI */
function boom(){
  const c=document.getElementById("confetti");
  const ctx=c.getContext("2d");
  c.width=innerWidth;
  c.height=innerHeight;

  let p=[];
  for(let i=0;i<100;i++){
    p.push({x:Math.random()*c.width,y:Math.random()*-c.height,v:2+Math.random()*4,r:3});
  }

  (function anim(){
    ctx.clearRect(0,0,c.width,c.height);
    p.forEach(o=>{
      ctx.beginPath();
      ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
      ctx.fillStyle=`hsl(${Math.random()*360},90%,60%)`;
      ctx.fill();
      o.y+=o.v;
    });
    if(p.some(o=>o.y<c.height)) requestAnimationFrame(anim);
  })();
}

/* INIT */
bindPreview();
setStep(1);

document.getElementById("cameraBtn").onclick=()=>{
  beep("click");
  const i=document.getElementById("photoInput");
  i.setAttribute("capture","environment");
  i.click();
};

document.getElementById("galleryBtn").onclick=()=>{
  beep("click");
  const i=document.getElementById("photoInput");
  i.removeAttribute("capture");
  i.click();
};

document.getElementById("activateBtn").onclick=async()=>{

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const tos=document.getElementById("tosCheckbox").checked;

  if(!name||!phone){
    beep("error");
    return setStatus("Missing details","error");
  }

  if(!tos){
    beep("error");
    return setStatus("Accept Terms","error");
  }

  try{

    setStep(2);
    scan(true);
    beep("upload");

    let file=document.getElementById("photoInput").files[0];
    let photoURL="";

    if(file){
      const form=new FormData();
      form.append("file",file);
      form.append("upload_preset","arkforge-pets");

      const res=await fetch("https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",{method:"POST",body:form});
      const data=await res.json();

      photoURL=data.secure_url;
    }

    setStep(3);

    const ref=doc(db,"pets",id);
    const snap=await getDoc(ref);

    await setDoc(ref,{
      name,
      phone,
      phone2:document.getElementById("phone2").value.trim(),
      microchip:document.getElementById("microchip").value.trim(),
      photo:photoURL||snap.data().photo||"",
      status:"active",
      activatedAt:new Date().toISOString()
    },{merge:true});

    scan(false);
    beep("success");
    setStatus("✓ ACTIVATED","ok");
    boom();

    setTimeout(()=>{
      location.href=`https://arkforge3dprinting.github.io/pet-tag/index.html?id=${id}`;
    },2500);

  }catch(e){
    scan(false);
    beep("error");
    setStatus("ERROR: "+e.message,"error");
  }
};

</script>

</body>
</html>
