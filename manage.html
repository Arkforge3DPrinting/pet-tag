<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Manage Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 460px;
      margin: auto;
      background: linear-gradient(180deg, #ffffff, #fbfcfd);
      padding: 16px;
      border-radius: 22px;
      border: 1px solid rgba(59,130,246,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
      text-align: center;
    }

    p {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 10px;
    }

    .contextBox {
      margin: 10px auto 14px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #eef6ff;
      border: 1px solid rgba(59,130,246,0.25);
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      color: #1f2937;
    }

    .smallId {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
    }

    .section {
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    label {
      font-size: 12px;
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #444;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-top: 8px;
    }

    .lostBtn { background: #ef4444; }
    .safeBtn { background: #28c76f; }
    .saveBtn { background: #3b82f6; }

    .statusBox {
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 10px;
    }

    .safe { background: #eafff1; color: #1a7f3c; }
    .lost { background: #ffecec; color: #a31212; }

    #preview {
      width: 160px;
      height: 160px;
      border-radius: 18px;
      object-fit: cover;
      border: 3px solid rgba(34,197,94,0.35);
    }

    .microchipEditToggle {
      margin-top: 6px;
      font-size: 12px;
      color: #2563eb;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      user-select: none;
    }

    input[readonly] {
      background: #f3f4f6;
    }

    input[type="file"] { display: none; }

    .successMsg {
      margin-top: 12px;
      font-weight: 900;
      color: #16a34a;
      text-align: center;
      display: none;
    }

    .successSub {
      font-size: 12px;
      color: #15803d;
      text-align: center;
      margin-top: 4px;
      display: none;
    }
        /* =========================
   UNIFIED FIELD SYSTEM
   (this fixes EVERYTHING)
========================= */

:root {
  --field-bg: #ffffff;
  --field-border: #e5e7eb;
  --field-radius: 10px;
  --field-padding: 10px;
  --field-font: 13px;
}

/* apply to ALL inputs */
input {
  width: 100%;
  padding: var(--field-padding);
  border-radius: var(--field-radius);
  border: 1px solid var(--field-border);
  font-size: var(--field-font);
  background: var(--field-bg);
  box-sizing: border-box;
  margin-bottom: 8px;
}

/* Make all input fields same var */
.microchipBox {
  width: 100%;
  padding: var(--field-padding);
  border-radius: var(--field-radius);
  border: 1px solid var(--field-border);
  font-size: var(--field-font);
  background: var(--field-bg);
  box-sizing: border-box;
  font-family: inherit; /* important: removes monospace mismatch */
}
  </style>
</head>

<body>

<div class="container">

  <h1>Manage Portal PLS 10</h1>
  <p>Update your pet’s details instantly</p>

  <div class="contextBox">
    You are editing: <span id="petNameLabel">Loading...</span><br>
    <span class="smallId">Tag ID: <span id="tagIdLabel"></span></span>
  </div>

  <div id="statusDisplay" class="statusBox">Loading...</div>

  <div class="section">
    <label>Status</label>
    <button class="lostBtn" onclick="setStatus('lost')">🔴 Mark as Lost</button>
    <button class="safeBtn" onclick="setStatus('safe')">🟢 Mark as Safe</button>
  </div>

  <div class="section">
    <label>Primary Phone</label>
    <input id="phone">

    <label>Secondary Phone</label>
    <input id="phone2">
  </div>

  <div class="section">
    <label>Pet Name</label>
    <input id="petNameInput" readonly>
    <div class="microchipEditToggle" onclick="togglePetNameEdit()">✏️ Edit pet name</div>
  </div>

  <div class="section">
    <label>Microchip</label>
    <input id="microchipInput" readonly>
    <div class="microchipEditToggle" onclick="toggleMicrochipEdit()">✏️ Edit microchip</div>
  </div>

<div class="section">
  <label>Photo</label>

  <div class="photoWrap">
    <img id="preview">

    <div class="photoBtns">
      <button type="button" class="photoBtn cam" onclick="openCamera()">📷 Camera</button>
      <button type="button" class="photoBtn up" onclick="openGallery()">📁 Upload</button>
      
    </div>

    
    <input type="file" id="fileInput" accept="image/*">
    <div class="fileInfo" id="fileInfo"></div>
  </div>
</div>

  <button class="saveBtn" onclick="save()">💾 Save Changes</button>

  <div class="successMsg" id="successMsg">Saved successfully</div>
  <div class="successSub" id="successSub">Please reload if needed.</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");
const ref = doc(db, "pets", id);

let petData = null;
let selectedFile = null;
let previewURL = null;

/* LOAD */
async function load() {
  if (!id) {
    console.error("No ID in URL");
    return;
  }

  const snap = await getDoc(ref);

  if (!snap.exists()) {
    console.error("Pet not found:", id);
    return;
  }

  petData = snap.data();

  document.getElementById("phone").value = petData.phone || "";
  document.getElementById("phone2").value = petData.phone2 || "";
  document.getElementById("preview").src = petData.photo || "";

  document.getElementById("petNameLabel").innerText = petData.name || "Unknown Pet";
  document.getElementById("tagIdLabel").innerText = id;

  document.getElementById("petNameInput").value = petData.name || "";
  document.getElementById("microchipInput").value = petData.microchip || "";

  updateStatusUI();
}

/* STATUS */
window.setStatus = async (status) => {
  await updateDoc(ref, {
    petStatus: status,
    updatedAt: new Date()
  });

  petData.petStatus = status;
  updateStatusUI();
};

function updateStatusUI() {
  const box = document.getElementById("statusDisplay");
  if (!petData) return;

  box.className = "statusBox " + (petData.petStatus === "lost" ? "lost" : "safe");
  box.innerText = petData.petStatus === "lost" ? "Status: LOST" : "Status: SAFE";
}

/* TOGGLES */
window.togglePetNameEdit = () => {
  const input = document.getElementById("petNameInput");
  input.readOnly = !input.readOnly;
  if (!input.readOnly) input.focus();
};

window.toggleMicrochipEdit = () => {
  const input = document.getElementById("microchipInput");
  input.readOnly = !input.readOnly;
  if (!input.readOnly) input.focus();
};

window.openCamera = () => {
  const i = document.getElementById("fileInput");
  i.setAttribute("capture", "environment");
  i.click();
};

window.openGallery = () => {
  const i = document.getElementById("fileInput");
  i.removeAttribute("capture");
  i.click();
};
  document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  selectedFile = file;

  if (previewURL) {
    URL.revokeObjectURL(previewURL);
  }

  previewURL = URL.createObjectURL(file);

  document.getElementById("preview").src = previewURL;

  document.getElementById("fileInfo").innerText =
    `${file.name} selected (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
});
  
/* SAVE */
window.save = async () => {

  const nameVal = document.getElementById("petNameInput").value.trim();
  const microchipVal = document.getElementById("microchipInput").value.trim();

  await updateDoc(ref, {
    phone: document.getElementById("phone").value,
    phone2: document.getElementById("phone2").value,
    name: nameVal,
    microchip: microchipVal,
    updatedAt: new Date()
  });

  document.getElementById("successMsg").style.display = "block";

  setTimeout(() => {
    location.reload();
  }, 800);
};

/* INIT */
load();
</script>

</body>
</html>
