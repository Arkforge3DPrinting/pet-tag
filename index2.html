<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Found Pet</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;

  background:
    radial-gradient(circle at top,#ffffff 0%,#eef4ff 30%,#dfe9f7 100%);

  color:#111827;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,rgba(59,130,246,.12),transparent 25%),
    radial-gradient(circle at 80% 10%,rgba(52,199,89,.12),transparent 25%),
    radial-gradient(circle at 50% 100%,rgba(255,159,10,.12),transparent 35%);
  pointer-events:none;
}

.container,
#locked{
  max-width:460px;
  margin:auto;

  background:rgba(255,255,255,.78);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border:1px solid rgba(255,255,255,.8);

  border-radius:34px;

  box-shadow:
    0 25px 60px rgba(0,0,0,.10),
    0 4px 12px rgba(0,0,0,.04);

  overflow:hidden;
}

.container{ display:none; }
#locked{ display:none; padding:28px; text-align:center; }

.hero{
  padding:30px 24px 22px;
  text-align:center;
}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;

  background:rgba(52,199,89,.15);
  color:#1c7a39;

  padding:10px 18px;
  border-radius:999px;

  font-size:13px;
  font-weight:700;

  margin-bottom:20px;

  animation:pulse 2.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.04);}
  100%{transform:scale(1);}
}

#petPhotoWrapper{
  position:relative;
  display:inline-block;
}

#petPhoto{
  width:250px;
  height:250px;

  object-fit:cover;

  border-radius:34px;

  display:none;
  margin:0 auto 22px;

  border:6px solid white;

  box-shadow:
    0 18px 40px rgba(0,0,0,.18),
    0 0 0 1px rgba(255,255,255,.9);

  animation:floaty 6s ease-in-out infinite;
}

@keyframes floaty{
  0%{transform:translateY(0px);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0px);}
}

/* GPS PULSE */
.pulse-ring{
  position:absolute;
  left:50%;
  top:50%;
  width:270px;
  height:270px;
  transform:translate(-50%, -50%);
  border-radius:50%;
  border:2px solid rgba(52,199,89,0.55);
  opacity:0;
  pointer-events:none;
}

.pulse-ring.active{
  animation:radarPulse 1.5s ease-out infinite;
}

@keyframes radarPulse{
  0%{transform:translate(-50%, -50%) scale(0.6); opacity:0.9;}
  70%{opacity:0.25;}
  100%{transform:translate(-50%, -50%) scale(1.6); opacity:0;}
}

h1{
  font-size:34px;
  font-weight:800;
  letter-spacing:-0.04em;
  margin-bottom:10px;
}

p{
  color:#6b7280;
  line-height:1.5;
  font-size:15px;
}

.notice{
  margin:0 20px 20px;
  padding:16px;
  border-radius:20px;
  background:rgba(59,130,246,.08);
  border:1px solid rgba(59,130,246,.15);
  font-weight:600;
  color:#234;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:0 20px 20px;
}

button{
  border:none;
  border-radius:22px;
  padding:18px 14px;
  color:white;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  min-height:78px;
  transition:.18s ease;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
}

button:hover{ transform:translateY(-3px); }
button:active{ transform:scale(.98); }
button:disabled{ opacity:.75; transform:none; }

#callBtn,#callBtn2{
  background:linear-gradient(180deg,#34c759,#28a745);
}
#textBtn,#textBtn2{
  background:linear-gradient(180deg,#0a84ff,#0066d6);
}
#locBtn,#locBtn2{
  background:linear-gradient(180deg,#ff9f0a,#e68500);
}

.footer{
  text-align:center;
  padding:10px 20px 24px;
  color:#9ca3af;
  font-size:12px;
}

/* ✅ BRAND BADGE */
.brand-badge{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:10px 14px;
  margin:10px auto 18px;

  width:fit-content;

  background:rgba(255,255,255,0.55);
  border:1px solid rgba(255,255,255,0.7);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  border-radius:999px;

  box-shadow:0 10px 25px rgba(0,0,0,0.08);

  font-size:12px;
  font-weight:700;
  color:#374151;
}

.brand-badge img{
  width:22px;
  height:22px;
  object-fit:contain;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="container" id="main">

  <div class="hero">
    <div class="status-pill">🐾 Found Pet</div>

    <div id="petPhotoWrapper">
      <img id="petPhoto">
      <div class="pulse-ring" id="gpsPulse"></div>
    </div>

    <h1 id="title">Loading...</h1>
    <p id="message"></p>
  </div>

  <div class="notice">
    Help return this pet safely.
  </div>

  <div class="grid">

    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call 2</button>

    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text 2</button>

    <button id="locBtn">📍 Location</button>
    <button id="locBtn2">📍 Location 2</button>

  </div>

  <!-- ✅ BRAND BADGE -->
  <div class="brand-badge">
    <img src="https://static.wixstatic.com/media/437455_1d4cc9cf7bfb4339932d8b7d4866444b~mv2.png/v1/fill/w_425,h_426,al_c,q_85,usm_0.66_1.00_0.01,enc_auto/TransparentAL_edited.png">
    <span>Arkforge</span>
  </div>

  <div class="footer">Powered by Arkforge 3D Printing ®</div>
</div>

<script>
let pet = { name:"Pet", phone:"", phone2:"" };

const gpsPulse = document.getElementById("gpsPulse");

/* SOUND */
function clickSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type="sine"; o.frequency.value=520;
    g.gain.value=0.08;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.08);
  }catch{}
}

function pingSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();

    o.type="sine";
    o.frequency.setValueAtTime(880,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320,ctx.currentTime+0.12);

    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.25);

    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.3);
  }catch{}
}

/* GPS PULSE */
function startPulse(){ gpsPulse.classList.add("active"); }
function stopPulse(){ gpsPulse.classList.remove("active"); }

/* GPS */
function gps(phone,label,btn){

  clickSound();

  btn.disabled=true;
  btn.innerText="📡 Getting GPS...";

  startPulse();

  navigator.geolocation.getCurrentPosition(pos=>{

    stopPulse();
    pingSound();

    const msg =
      "I found "+pet.name+
      ". https://maps.google.com/?q="+
      pos.coords.latitude+","+pos.coords.longitude;

    btn.disabled=false;
    btn.innerText=label;

    window.open(`sms:${phone}?body=${encodeURIComponent(msg)}`,"_self");

  },()=>{

    stopPulse();

    btn.disabled=false;
    btn.innerText=label;

    alert("GPS failed.");
  },{
    enableHighAccuracy:true,
    timeout:10000,
    maximumAge:0
  });
}

/* BUTTONS */
function bind(){

  document.getElementById("callBtn").onclick=()=>{
    clickSound();
    location.href="tel:"+pet.phone;
  };

  document.getElementById("callBtn2").onclick=()=>{
    clickSound();
    location.href="tel:"+pet.phone2;
  };

  document.getElementById("textBtn").onclick=()=>{
    clickSound();
    location.href=`sms:${pet.phone}?body=${encodeURIComponent("I found your pet "+pet.name)}`;
  };

  document.getElementById("textBtn2").onclick=()=>{
    clickSound();
    location.href=`sms:${pet.phone2}?body=${encodeURIComponent("I found your pet "+pet.name)}`;
  };

  document.getElementById("locBtn").onclick=(e)=>{
    gps(pet.phone,"📍 Location",e.currentTarget);
  };

  document.getElementById("locBtn2").onclick=(e)=>{
    gps(pet.phone2,"📍 Location 2",e.currentTarget);
  };
}

/* INIT */
function load(){
  document.getElementById("main").style.display="block";
  pet={name:"Found Pet",phone:"123",phone2:"456"};
  document.getElementById("title").innerText="🐾 "+pet.name;
  document.getElementById("message").innerText="Help bring them home safely.";
  bind();
}

load();
</script>

</body>
</html>
