<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 14px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 4px;
    }

    p {
      font-size: 15px;
      color: #666;
      margin-top: 0;
      margin-bottom: 10px;
    }

    #petPhoto {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      margin: 10px auto;
      display: none;
      border: 4px solid #fff;
      box-shadow: 0 0 0 3px #3b82f6, 0 6px 18px rgba(0,0,0,0.15);
    }

    /* GRID SYSTEM */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .label {
      text-align: left;
      font-size: 12px;
      font-weight: bold;
      color: #444;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease;
      color: white;
    }

    button:active {
      transform: scale(0.97);
    }

    /* PRIMARY */
    .p1 { background: #28c76f; }
    .p2 { background: #3b82f6; }
    .p3 { background: #ff9f43; }

    /* SECONDARY */
    .s1 { background: #1f9d55; opacity: 0.9; }
    .s2 { background: #2563eb; opacity: 0.9; }
    .s3 { background: #f59e0b; opacity: 0.9; }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }

  </style>
</head>

<body>

<div class="container">

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <img id="petPhoto">

  <!-- GRID HEADERS -->
  <div class="label">Call</div>
  <div class="grid">
    <button id="callBtn" class="p1">📞 Primary</button>
    <button id="callBtn2" class="s1">📞 Secondary</button>
  </div>

  <div class="label">Text</div>
  <div class="grid">
    <button id="textBtn" class="p2">💬 Primary</button>
    <button id="textBtn2" class="s2">💬 Secondary</button>
  </div>

  <div class="label">Send Location</div>
  <div class="grid">
    <button id="locBtn" class="p3">📍 Primary</button>
    <button id="locBtn2" class="s3">📍 Secondary</button>
  </div>

  <div class="footer">
    Powered by Arkforge 3D Printing ®
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadPet() {

  const id = new URLSearchParams(window.location.search).get("id");

  if (!id) {
    document.getElementById("title").innerText = "No pet ID found";
    return;
  }

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) {
    document.getElementById("title").innerText = "Error loading pet";
    return;
  }

  const pet = snap.data();

  document.getElementById("title").innerText = "🐾 You found " + pet.name;
  document.getElementById("message").innerText = "Help me get home safely";

  if (pet.photo) {
    const img = document.getElementById("petPhoto");
    img.src = pet.photo;
    img.style.display = "block";
  }

  // ===== PRIMARY =====
  document.getElementById("callBtn").onclick = () =>
    window.location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick = () => {
    window.open(
      `sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
      "_self"
    );
  };

  document.getElementById("locBtn").onclick = () => {

    navigator.geolocation.getCurrentPosition((pos) => {

      const msg =
        "I found your pet " +
        pet.name +
        ". Location: https://maps.google.com/?q=" +
        pos.coords.latitude + "," + pos.coords.longitude;

      window.open(
        `sms:${pet.phone}?body=${encodeURIComponent(msg)}`,
        "_self"
      );

    });

  };

  // ===== SECONDARY =====
  const hasBackup = pet.phone2 && pet.phone2.trim() !== "";

  const safeSecondary = (fn) => {
    if (!hasBackup) return;
    fn();
  };

  document.getElementById("callBtn2").onclick = () =>
    safeSecondary(() => window.location.href = "tel:" + pet.phone2);

  document.getElementById("textBtn2").onclick = () =>
    safeSecondary(() =>
      window.open(
        `sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
        "_self"
      )
    );

  document.getElementById("locBtn2").onclick = () =>
    safeSecondary(() => {

      navigator.geolocation.getCurrentPosition((pos) => {

        const msg =
          "I found your pet " +
          pet.name +
          ". Location: https://maps.google.com/?q=" +
          pos.coords.latitude + "," + pos.coords.longitude;

        window.open(
          `sms:${pet.phone2}?body=${encodeURIComponent(msg)}`,
          "_self"
        );

      });

    });

}

loadPet();

</script>

</body>
</html>
