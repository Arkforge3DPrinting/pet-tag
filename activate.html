<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg,#eef2ff,#f4f6f8);
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      border: 2px solid #e5e7eb;
    }

    h2 { margin-bottom: 6px; font-size: 22px; }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .steps {
      text-align: left;
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .step {
      padding: 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step.active {
      background: #dbeafe;
      border: 1px solid #3b82f6;
    }

    .step.done {
      background: #dcfce7;
      border: 1px solid #22c55e;
    }

    .tick {
      width: 20px;
      font-weight: 900;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 2px solid #ddd;
      font-size: 15px;
    }

    input:focus {
      border-color: #3b82f6;
      outline: none;
    }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      margin-bottom: 6px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }

    .camera { background: #f97316; }
    .gallery { background: #2563eb; }
    .activate { background: #16a34a; font-size: 18px; }

    .file-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 10px;
      min-height: 16px;
    }

    .progress {
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
      border: 2px solid #d1d5db;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#22c55e,#16a34a);
      transition: width 250ms ease;
    }

    .status {
      margin-top: 10px;
      font-weight: 800;
      font-size: 14px;
      min-height: 20px;
    }

    .ok { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>

<body>

<div class="container">

  <h2>Activate Pet Tag</h2>

  <div class="tagid">Tag ID: <span id="tagIdDisplay"></span></div>

  <div class="steps">
    <div class="step" id="s1"><span class="tick">❌</span> Enter details</div>
    <div class="step" id="s2"><span class="tick">❌</span> Add photo</div>
    <div class="step" id="s3"><span class="tick">❌</span> Activate tag</div>
  </div>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">
  <input id="microchip" placeholder="Microchip number (optional)">

  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <!-- FILE CONFIRMATION -->
  <div class="file-label" id="fileLabel">No image selected</div>

  <button class="btn activate" id="activateBtn">ACTIVATE TAG</button>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="status" id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6b...",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
});

const db = getFirestore(app);
const id = new URLSearchParams(location.search).get("id");

document.getElementById("tagIdDisplay").innerText = id;

const bar = document.getElementById("bar");
const status = document.getElementById("status");
const fileLabel = document.getElementById("fileLabel");
const fileInput = document.getElementById("photoInput");

/* STEP UI */
function setStep(n){
  for(let i=1;i<=3;i++){
    const el=document.getElementById("s"+i);
    const tick=el.querySelector(".tick");

    if(i<n){
      el.className="step done";
      tick.innerText="✔";
    }else if(i===n){
      el.className="step active";
      tick.innerText="▶";
    }else{
      el.className="step";
      tick.innerText="❌";
    }
  }
}

/* FILE NAME DISPLAY */
fileInput.onchange = () => {
  const file = fileInput.files[0];
  if(file){
    fileLabel.innerText = `✓ ${file.name} selected`;
    fileLabel.style.color = "#16a34a";
  } else {
    fileLabel.innerText = "No image selected";
    fileLabel.style.color = "#6b7280";
  }
};

/* FLOW */
setStep(1);

document.getElementById("cameraBtn").onclick=()=>{
  const i=fileInput;
  i.setAttribute("capture","environment");
  i.click();
};

document.getElementById("galleryBtn").onclick=()=>{
  const i=fileInput;
  i.removeAttribute("capture");
  i.click();
};

document.getElementById("activateBtn").onclick=async()=>{

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();

  if(!name||!phone){
    status.innerText="Fill details";
    return;
  }

  try{

    setStep(2);
    bar.style.width="40%";

    const file=fileInput.files[0];
    let photoURL="";

    if(file){
      status.innerText="Uploading photo...";
      bar.style.width="65%";

      const form=new FormData();
      form.append("file",file);
      form.append("upload_preset","arkforge-pets");

      const res=await fetch("https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",{method:"POST",body:form});
      const data=await res.json();
      photoURL=data.secure_url;
    }

    setStep(3);
    bar.style.width="90%";

    const ref=doc(db,"pets",id);
    const snap=await getDoc(ref);

    await setDoc(ref,{
      name,
      phone,
      phone2:document.getElementById("phone2").value.trim(),
      microchip:document.getElementById("microchip").value.trim(),
      photo:photoURL||snap.data().photo||"",
      status:"active",
      activatedAt:new Date().toISOString()
    },{merge:true});

    bar.style.width="100%";
    setStep(3);

    /* COUNTDOWN REDIRECT */
    let count = 5;
    status.innerText = `✓ Activated! Redirecting in ${count}...`;

    const timer = setInterval(() => {
      count--;
      if(count > 0){
        status.innerText = `✓ Activated! Redirecting in ${count}...`;
      } else {
        clearInterval(timer);
        window.location.href =
          `index.html?id=${id}`;
      }
    }, 1000);

  }catch(e){
    status.innerText="ERROR: "+e.message;
  }
};

</script>

</body>
</html>
