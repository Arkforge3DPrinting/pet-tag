<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const listDiv = document.getElementById("list");

console.log("ADMIN SCRIPT LOADED");

// -----------------------------
// AUTH CHECK
// -----------------------------
onAuthStateChanged(auth, (user) => {

  console.log("AUTH STATE:", user);

  if (!user) {
    document.body.innerHTML = `
      <h2>🔒 Admin Login Required</h2>
      <a href="login.html">Go to Login</a>
    `;
    return;
  }

  loadPets();
});

// -----------------------------
// LOAD PETS
// -----------------------------
window.loadPets = async function () {

  console.log("LOADING PETS...");

  listDiv.innerHTML = "Loading...";

  const snap = await getDocs(collection(db, "pets"));

  console.log("DOC COUNT:", snap.size);

  listDiv.innerHTML = "";

  snap.forEach((docSnap) => {

    const data = docSnap.data();
    const id = docSnap.id;

    const div = document.createElement("div");
    div.style = "border:1px solid #ccc; padding:10px; margin-bottom:10px;";

    div.innerHTML = `
      <b>Tag ID:</b> ${id}<br><br>

      <input id="name-${id}" value="${data.name || ""}" placeholder="Name"><br><br>
      <input id="phone-${id}" value="${data.phone || ""}" placeholder="Phone"><br><br>

      ${data.photo ? `<img src="${data.photo}" style="max-width:120px;"><br><br>` : ""}

      <button onclick="save('${id}')">💾 Save</button>
      <button onclick="removeTag('${id}')">🗑 Delete</button>
    `;

    listDiv.appendChild(div);
  });
};

// -----------------------------
// SAVE
// -----------------------------
window.save = async function (id) {

  const name = document.getElementById("name-" + id).value;
  const phone = document.getElementById("phone-" + id).value;

  await updateDoc(doc(db, "pets", id), {
    name,
    phone
  });

  alert("Updated " + id);
};

// -----------------------------
// DELETE
// -----------------------------
window.removeTag = async function (id) {

  if (!confirm("Delete this tag?")) return;

  await deleteDoc(doc(db, "pets", id));

  alert("Deleted " + id);
  loadPets();
};

</script>
