<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg,#eef2ff,#f4f6f8);
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      border: 2px solid #e5e7eb;
    }

    h2 { margin-bottom: 6px; font-size: 22px; }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .steps {
      text-align: left;
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .step {
      padding: 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step.active { background:#dbeafe; border:1px solid #3b82f6; }
    .step.done { background:#dcfce7; border:1px solid #22c55e; }
    .step.error { background:#fee2e2; border:1px solid #ef4444; }

    .tick { width: 20px; font-weight: 900; }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 2px solid #ddd;
      font-size: 15px;
    }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }

    .camera { background:#f97316; }
    .gallery { background:#2563eb; }
    .activate { background:#16a34a; font-size:18px; }

    .tos-box {
      text-align: left;
      font-size: 13px;
      padding: 10px;
      background: #fafafa;
      border: 2px solid #eee;
      border-radius: 10px;
      margin: 12px 0;
    }

    .progress {
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
      border: 2px solid #d1d5db;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#22c55e,#16a34a);
      transition: width 250ms ease;
    }

    .status {
      margin-top: 10px;
      font-weight: 800;
      font-size: 14px;
      min-height: 20px;
    }

    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: -6px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Activate Pet Tag</h2>
  <div class="tagid">Tag ID: <span id="tagIdDisplay"></span></div>

  <div class="steps">
    <div class="step" id="s1"><span class="tick">❌</span> Enter details</div>
    <div class="step" id="s2"><span class="tick">❌</span> Add photo</div>
    <div class="step" id="s3"><span class="tick">❌</span> Activate tag</div>
  </div>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">
  <input id="microchip" placeholder="Microchip number (optional)">

  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <!-- 📸 IMAGE CONFIRMATION (RESTORED) -->
  <div class="small" id="fileInfo">No image selected</div>

  <div class="tos-box">
    <label>
      <input type="checkbox" id="tosCheckbox">
      I agree to Terms of Service
    </label>
  </div>

  <button class="btn activate" id="activateBtn">ACTIVATE TAG</button>

  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6b...",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
});

const db = getFirestore(app);
const id = new URLSearchParams(location.search).get("id");

document.getElementById("tagIdDisplay").innerText = id;

const bar = document.getElementById("bar");
const status = document.getElementById("status");
const fileInfo = document.getElementById("fileInfo");

/* STEP SYSTEM */
function setStep(n){
  for(let i=1;i<=3;i++){
    const el=document.getElementById("s"+i);
    const tick=el.querySelector(".tick");

    if(i<n){
      el.className="step done";
      tick.innerText="✔";
    }else if(i===n){
      el.className="step active";
      tick.innerText="▶";
    }else{
      el.className="step";
      tick.innerText="❌";
    }
  }
}

/* IMAGE LABEL UPDATE (RESTORED) */
document.getElementById("photoInput").addEventListener("change",(e)=>{
  const file=e.target.files[0];
  if(file){
    fileInfo.innerText = `📸 ${file.name} selected`;
  }else{
    fileInfo.innerText = "No image selected";
  }
});

/* BUTTONS */
document.getElementById("cameraBtn").onclick=()=>{
  const i=document.getElementById("photoInput");
  i.setAttribute("capture","environment");
  i.click();
};

document.getElementById("galleryBtn").onclick=()=>{
  const i=document.getElementById("photoInput");
  i.removeAttribute("capture");
  i.click();
};

setStep(1);

/* MAIN FLOW */
document.getElementById("activateBtn").onclick=async()=>{

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const tos=document.getElementById("tosCheckbox").checked;

  if(!name||!phone){
    status.innerText="Fill details";
    return;
  }

  if(!tos){
    status.innerText="You must accept Terms of Service";
    status.style.color="red";
    return;
  }

  try{

    setStep(2);
    bar.style.width="30%";
    status.innerText="Processing image...";

    const file=document.getElementById("photoInput").files[0];
    let photoURL="";

    if(file){
      const form=new FormData();
      form.append("file",file);
      form.append("upload_preset","arkforge-pets");

      status.innerText="Uploading photo...";
      bar.style.width="60%";

      const res=await fetch("https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",{method:"POST",body:form});
      const data=await res.json();
      photoURL=data.secure_url;
    }

    setStep(3);
    status.innerText="Saving profile...";
    bar.style.width="85%";

    const ref=doc(db,"pets",id);
    const snap=await getDoc(ref);

    await setDoc(ref,{
      name,
      phone,
      phone2:document.getElementById("phone2").value.trim(),
      microchip:document.getElementById("microchip").value.trim(),
      photo:photoURL||snap.data().photo||"",
      status:"active",
      activatedAt:new Date().toISOString()
    },{merge:true});

    bar.style.width="100%";

    /* SUCCESS STATE */
    status.innerHTML="✅ Activated successfully! Redirecting...";

    setStep(3);

    /* ⏳ RESTORED COUNTDOWN */
    let count = 5;

    const interval = setInterval(()=>{
      status.innerHTML = `✅ Activated successfully! Redirecting in ${count}...`;
      count--;

      if(count < 0){
        clearInterval(interval);
        window.location.href = `index.html?id=${id}`;
      }
    },1000);

  }catch(e){
    status.innerText="ERROR: "+e.message;
  }
};

</script>

</body>
</html>
