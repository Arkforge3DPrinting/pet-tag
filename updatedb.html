<!DOCTYPE html>
<html>
<head>
  <title>Create Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h2>Create Tag</h2>

<input id="name" placeholder="Pet Name">
<input id="phone" placeholder="Phone">
<input id="phone2" placeholder="Secondary">

<button id="generateBtn">Create</button>

<p id="result"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets"
});

const db = getFirestore(app);
const auth = getAuth(app);

await setPersistence(auth, browserLocalPersistence);

let user = null;
let ready = false;

await new Promise(resolve => {
  const unsub = onAuthStateChanged(auth, u => {
    user = u;
    ready = true;
    unsub();
    resolve();
  });
});

function idGen(len = 10) {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  return Array.from({ length: len }, () =>
    chars[Math.floor(Math.random() * chars.length)]
  ).join("");
}

document.getElementById("generateBtn").onclick = async () => {

  if (!ready) return alert("Auth loading...");
  if (!user) return alert("Not logged in");

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();

  if (!name || !phone) return alert("Missing fields");

  const id = idGen();

  await setDoc(doc(db, "pets", id), {
    name,
    phone,
    phone2: phone2 || "",
    status: "inactive",
    createdAt: new Date().toISOString()
  });

  document.getElementById("result").innerText =
    "Created: " + id;

};

</script>

</body>
</html>
