<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg,#eef2ff,#f4f6f8);
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      border: 2px solid #e5e7eb;
    }

    h2 {
      margin-bottom: 6px;
      font-size: 22px;
    }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .steps {
      text-align: left;
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .step {
      padding: 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 200ms ease;
    }

    .step.active {
      background: #dbeafe;
      border: 1px solid #3b82f6;
      transform: scale(1.02);
    }

    .step.done {
      background: #dcfce7;
      border: 1px solid #22c55e;
    }

    .tick {
      width: 20px;
      text-align: center;
      font-weight: 900;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 2px solid #ddd;
      font-size: 15px;
    }

    input:focus {
      border-color: #3b82f6;
      outline: none;
    }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      transition: all 120ms ease;
    }

    .camera { background: #f97316; }
    .gallery { background: #2563eb; }
    .activate { background: #16a34a; font-size: 18px; }

    .tos-box {
      text-align: left;
      font-size: 13px;
      padding: 10px;
      background: #fafafa;
      border: 2px solid #eee;
      border-radius: 10px;
      margin: 12px 0;
    }

    .progress {
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
      border: 2px solid #d1d5db;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#22c55e,#16a34a);
      transition: width 250ms ease;
    }

    .status {
      margin-top: 10px;
      font-weight: 800;
      font-size: 14px;
      min-height: 20px;
    }

    .ok { color: #16a34a; }
    .error { color: #dc2626; }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">

  <h2>Activate Pet Tag</h2>

  <div class="tagid">Tag ID: <span id="tagIdDisplay"></span></div>

  <div class="steps">
    <div class="step" id="s1"><div class="tick">❌</div> Enter details</div>
    <div class="step" id="s2"><div class="tick">❌</div> Add photo</div>
    <div class="step" id="s3"><div class="tick">❌</div> Activate tag</div>
  </div>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">
  <input id="microchip" placeholder="Microchip number (optional)">
  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <div class="tos-box">
    <label>
      <input type="checkbox" id="tosCheckbox">
      I agree to Terms of Service
    </label>
  </div>

  <button class="btn activate" id="activateBtn">ACTIVATE TAG</button>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="status" id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6b...",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
});

const db = getFirestore(app);
const id = new URLSearchParams(location.search).get("id");

document.getElementById("tagIdDisplay").innerText = id;

const bar = document.getElementById("bar");
const status = document.getElementById("status");

/* STEP UI */
function setStep(n){
  for(let i=1;i<=3;i++){
    const el=document.getElementById("s"+i);
    const tick=el.querySelector(".tick");

    if(i<n){
      el.className="step done";
      tick.innerText="✔";
    }else if(i===n){
      el.className="step active";
      tick.innerText="▶";
    }else{
      el.className="step";
      tick.innerText="❌";
    }
  }
}

/* CONFETTI */
function boom(){
  const c=document.getElementById("confetti");
  const ctx=c.getContext("2d");
  c.width=innerWidth;
  c.height=innerHeight;

  let p=[];
  for(let i=0;i<90;i++){
    p.push({x:Math.random()*c.width,y:Math.random()*-c.height,v:2+Math.random()*4,r:3});
  }

  (function anim(){
    ctx.clearRect(0,0,c.width,c.height);
    p.forEach(o=>{
      ctx.beginPath();
      ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
      ctx.fillStyle=`hsl(${Math.random()*360},80%,60%)`;
      ctx.fill();
      o.y+=o.v;
    });
    if(p.some(o=>o.y<c.height)) requestAnimationFrame(anim);
  })();
}

/* FLOW */
setStep(1);

document.getElementById("activateBtn").onclick=async()=>{

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const tos=document.getElementById("tosCheckbox").checked;

  if(!name||!phone) return setStatus("Fill details","error");
  if(!tos) return setStatus("Accept Terms","error");

  try{

    setStep(2);
    bar.style.width="30%";

    const file=document.getElementById("photoInput").files[0];
    let photoURL="";

    if(file){
      setStep(2);
      status.innerText="Uploading photo...";
      bar.style.width="60%";

      const form=new FormData();
      form.append("file",file);
      form.append("upload_preset","arkforge-pets");

      const res=await fetch("https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",{method:"POST",body:form});
      const data=await res.json();
      photoURL=data.secure_url;
    }

    setStep(3);
    bar.style.width="90%";

    const ref=doc(db,"pets",id);
    const snap=await getDoc(ref);

    await setDoc(ref,{
      name,
      phone,
      phone2:document.getElementById("phone2").value.trim(),
      microchip:document.getElementById("microchip").value.trim(),
      photo:photoURL||snap.data().photo||"",
      status:"active",
      activatedAt:new Date().toISOString()
    },{merge:true});

    /* FIX: force final UI state */
    setStep(4); // treated as final override
    document.getElementById("s3").className="step done";
    document.querySelector("#s3 .tick").innerText="✔";

    bar.style.width="100%";
    status.innerHTML="✓ ACTIVATED";
    boom();

    /* FIX: REDIRECT */
    setTimeout(()=>{
      window.location.href =
        `https://arkforge3dprinting.github.io/pet-tag/index.html?id=${id}`;
    },2000);

  }catch(e){
    status.innerText="ERROR: "+e.message;
  }
};

</script>

</body>
</html>
