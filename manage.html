<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Manage Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 460px;
      margin: auto;
      background: #fff;
      padding: 16px;
      border-radius: 22px;
      border: 1px solid rgba(59,130,246,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 { text-align:center; font-size:22px; }
    p { text-align:center; font-size:13px; color:#666; }

    .contextBox {
      margin: 10px 0;
      padding: 10px;
      border-radius: 12px;
      background: #eef6ff;
      text-align: center;
      font-weight: bold;
    }

    .section {
      margin-top: 14px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
    }

    label { font-size:12px; font-weight:bold; display:block; margin-bottom:6px; }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      color: white;
      cursor: pointer;
      margin-top: 8px;
    }

    .lostBtn { background:#ef4444; }
    .safeBtn { background:#28c76f; }
    .saveBtn { background:#3b82f6; }

    #preview {
      width:160px;
      height:160px;
      border-radius:18px;
      object-fit:cover;
      border:3px solid #22c55e55;
      display:block;
      margin:auto;
    }

    input[type="file"] { display:none; }

    .statusBox {
      text-align:center;
      padding:10px;
      border-radius:12px;
      font-weight:bold;
      margin-top:10px;
    }

    .safe { background:#eafff1; color:#1a7f3c; }
    .lost { background:#ffecec; color:#a31212; }

    .successMsg {
      display:none;
      text-align:center;
      font-weight:bold;
      color:#16a34a;
      margin-top:10px;
    }
    .editBtn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  margin-top: 8px;
  background: #3b82f6; /* same as save */
}

.editBtn:hover {
  background: #2563eb;
}
    .actionBtn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  margin-top: 8px;
  background: #3b82f6; /* same blue as Save */
}

.actionBtn:hover {
  background: #2563eb;
}
  </style>
</head>

<body>

<div class="container">

  <h1>Manage Pet v2 - blue but longer</h1>

  <div class="contextBox">
    You are editing: <span id="petNameLabel">Loading...</span><br>
    Tag ID: <span id="tagIdLabel"></span>
  </div>

  <div id="statusDisplay" class="statusBox">Loading...</div>

  <div class="section">
    <label>Status</label>
    <button class="lostBtn" onclick="setStatus('lost')">Mark Lost</button>
    <button class="safeBtn" onclick="setStatus('safe')">Mark Safe</button>
  </div>

  <div class="section">
    <label>Primary Phone</label>
    <input id="phone">

    <label>Secondary Phone</label>
    <input id="phone2">
  </div>

  <div class="section">
    <label>Pet Name</label>
    <input id="petNameInput" readonly>
 <button type="button" class="editBtn" onclick="togglePetNameEdit()">Edit Name</button>
  </div>

  <div class="section">
    <label>Microchip</label>
    <input id="microchipInput" readonly>
   <button type="button" class="editBtn" onclick="toggleMicrochipEdit()">Edit Microchip</button>
  </div>

  <div class="section">
    <label>Photo</label>
    <img id="preview">
    <input type="file" id="fileInput" accept="image/*">
    <button type="button" class="actionBtn" onclick="document.getElementById('fileInput').click()">
  Upload
</button>
  </div>

  <button class="saveBtn" id="saveBtn" onclick="save()">SAVE</button>

  <div class="successMsg" id="successMsg">Saved!</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

let ref = null;
let petData = null;
let selectedFile = null;
let previewURL = null;

/* ================= SAFE INIT ================= */
function init() {
  if (!id) {
    document.getElementById("statusDisplay").innerText = "Missing ID";
    return;
  }

  ref = doc(db, "pets", id);
  document.getElementById("tagIdLabel").innerText = id;

  load();
}

/* ================= LOAD ================= */
async function load() {
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    document.getElementById("statusDisplay").innerText = "Pet not found";
    return;
  }

  petData = snap.data();

  document.getElementById("petNameLabel").innerText = petData.name || "";
  document.getElementById("phone").value = petData.phone || "";
  document.getElementById("phone2").value = petData.phone2 || "";
  document.getElementById("petNameInput").value = petData.name || "";
  document.getElementById("microchipInput").value = petData.microchip || "";
  document.getElementById("preview").src = petData.photo || "";

  updateStatus();
}

/* ================= STATUS ================= */
window.setStatus = async (status) => {
  await updateDoc(ref, {
    petStatus: status,
    updatedAt: new Date()
  });

  petData.petStatus = status;
  updateStatus();
};

function updateStatus() {
  const box = document.getElementById("statusDisplay");

  if (!petData) return;

  const lost = petData.petStatus === "lost";
  box.className = "statusBox " + (lost ? "lost" : "safe");
  box.innerText = lost ? "LOST" : "SAFE";
}

/* ================= TOGGLES ================= */
window.togglePetNameEdit = () => {
  const i = document.getElementById("petNameInput");
  i.readOnly = !i.readOnly;
  i.focus();
};

window.toggleMicrochipEdit = () => {
  const i = document.getElementById("microchipInput");
  i.readOnly = !i.readOnly;
  i.focus();
};

/* ================= FILE ================= */
document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  selectedFile = file;

  if (previewURL) URL.revokeObjectURL(previewURL);

  previewURL = URL.createObjectURL(file);
  document.getElementById("preview").src = previewURL;
});

/* ================= CLOUDINARY ================= */
function upload(file) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", "arkforge-pets");

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload");

    xhr.onload = () => {
      const data = JSON.parse(xhr.responseText);
      resolve(data.secure_url);
    };

    xhr.onerror = reject;
    xhr.send(form);
  });
}

/* ================= SAVE ================= */
window.save = async () => {
  const btn = document.getElementById("saveBtn");
  btn.disabled = true;

  try {
    let photo = petData.photo || "";

    if (selectedFile) {
      photo = await upload(selectedFile);
    }

    await updateDoc(ref, {
      name: document.getElementById("petNameInput").value,
      microchip: document.getElementById("microchipInput").value,
      phone: document.getElementById("phone").value,
      phone2: document.getElementById("phone2").value,
      photo,
      updatedAt: new Date()
    });

    document.getElementById("successMsg").style.display = "block";

  } catch (e) {
    console.error(e);
    alert("Save failed");
  } finally {
    btn.disabled = false;
  }
};

/* ================= START HERE ================= */
init();

</script>

</body>
</html>
