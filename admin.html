<!DOCTYPE html>
<html>
<head>
  <title>Pet Admin Panel</title>
</head>

<body style="font-family: Arial; padding:20px;">

<h1>🐾 Pet Admin (Arkforge)</h1>

<label>Pet Name</label><br>
<input id="name"><br><br>

<label>Phone</label><br>
<input id="phone"><br><br>

<button onclick="addPet()">➕ Add Pet + Generate NFC</button>

<h3>Output</h3>
<pre id="output"></pre>

<script>

let pets = {};

// 1. Load existing database
fetch("pets.json")
  .then(res => res.json())
  .then(data => {
    pets = data;
  })
  .catch(() => {
    pets = {}; // fallback if empty or broken
  });

// 2. ID generator
function generateId(length = 10) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let id = "";
  for (let i = 0; i < length; i++) {
    id += chars[Math.floor(Math.random() * chars.length)];
  }
  return id;
}

// 3. Add pet function
function addPet() {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  if (!name || !phone) {
    alert("Please enter name and phone");
    return;
  }

  const id = generateId();

  // add to database
  pets[id] = {
    name: name,
    phone: phone
  };

  const url = "https://arkforge3dprinting.github.io/pet-tag/?id=" + id;

  // output full updated JSON
  document.getElementById("output").innerText =
    "📲 NFC URL:\n" + url +
    "\n\n📦 COPY THIS INTO pets.json:\n\n" +
    JSON.stringify(pets, null, 2);
}

</script>

</body>
</html>
