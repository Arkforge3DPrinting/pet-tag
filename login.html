<!DOCTYPE html>
<html>
<head>
  <title>Admin Login Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f6f8, #e9eef5);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 26px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;

      /* 🔥 KEY FIX */
      display: block;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #2563eb;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #555;
      min-height: 18px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>🔐 Login - Database</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn">Login</button>

  <p id="status"></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets"
});

const auth = getAuth(app);

const status = document.getElementById("status");

document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    status.innerText = "Enter email + password";
    return;
  }

  try {
    await setPersistence(auth, browserLocalPersistence);

    await signInWithEmailAndPassword(auth, email, password);

    status.innerText = "Success...";

    setTimeout(() => {
      window.location.href = "admin.html";
    }, 600);

  } catch (e) {
    status.innerText = e.message;
  }
};

</script>

</body>
</html>
