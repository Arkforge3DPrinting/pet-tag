<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h2 { margin-bottom: 4px; }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
    }

    .camera { background: #ff9f43; }
    .gallery { background: #3b82f6; }
    .activate { background: #3b82f6; font-size: 18px; }

    .tos-box {
      text-align: left;
      font-size: 13px;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      margin: 12px 0;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
      min-height: 20px;
    }

    .error { color: #d11a2a; }
    .ok { color: #0a7a2f; }

    /* PROGRESS */
    .progress-wrap {
      display: none;
      margin-top: 12px;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg,#22c55e,#16a34a);
      transition: width 0.4s ease;
    }

    .steps {
      text-align: left;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    .steps div {
      margin-bottom: 5px;
    }

    .done { color: #16a34a; font-weight: bold; }
    .fail { color: #d11a2a; font-weight: bold; }
  </style>
</head>

<body>

<div class="container">

  <h2>Activate Pet Tag</h2>

  <div class="tagid">
    Tag ID: <span id="tagIdDisplay"></span>
  </div>

  <input id="name" placeholder="Pet Name">
  <input id="phone" placeholder="Primary Contact Number">
  <input id="phone2" placeholder="Secondary Contact (optional)">
  <input id="microchip" placeholder="Microchip number (optional)">
  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">📷 Take Photo</button>
  <button class="btn gallery" id="galleryBtn">📁 Choose Photo</button>

  <div class="tos-box">
    <label>
      <input type="checkbox" id="tosCheckbox">
      I agree to Terms of Service and understand this profile may be publicly visible when scanned.
    </label>
  </div>

  <button class="btn activate" id="activateBtn">Activate</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="bar-bg"><div class="bar" id="bar"></div></div>

    <div class="steps" id="steps">
      <div id="s1">⏳ Checking tag...</div>
      <div id="s2">⏳ Uploading photo...</div>
      <div id="s3">⏳ Saving profile...</div>
      <div id="s4">⏳ Finalising...</div>
    </div>
  </div>

  <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const statusEl = document.getElementById("status");
const btn = document.getElementById("activateBtn");
const photoInput = document.getElementById("photoInput");

const wrap = document.getElementById("progressWrap");
const bar = document.getElementById("bar");
const steps = document.getElementById("steps");

const urlId = new URLSearchParams(window.location.search).get("id");

function setStatus(msg, type="") {
  statusEl.innerText = msg;
  statusEl.className = type;
}

function progress(p) {
  wrap.style.display = "block";
  steps.style.display = "block";
  bar.style.width = p + "%";
}

function step(id, ok, text) {
  const el = document.getElementById(id);
  el.className = ok ? "done" : "fail";
  el.innerText = (ok ? "✅ " : "❌ ") + text;
}

if (!urlId) {
  setStatus("❌ Invalid activation link", "error");
} else {
  document.getElementById("tagIdDisplay").innerText = urlId;
}

document.getElementById("cameraBtn").onclick = () => {
  photoInput.setAttribute("capture","environment");
  photoInput.click();
};

document.getElementById("galleryBtn").onclick = () => {
  photoInput.removeAttribute("capture");
  photoInput.click();
};

let running = false;

btn.onclick = async () => {

  if (running) return;
  running = true;

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();
  const tos = document.getElementById("tosCheckbox").checked;

  if (!name || !phone) return setStatus("⚠ Missing required fields","error");
  if (!tos) return setStatus("⚠ Accept Terms first","error");

  btn.disabled = true;
  btn.innerText = "Activating...";

  try {

    progress(10);
    setStatus("Checking tag...");

    const ref = doc(db,"pets",urlId);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      step("s1",false,"Tag not found");
      throw new Error("Tag not found");
    }

    step("s1",true,"Tag found");

    let photoURL = "";
    const file = photoInput.files[0];

    if (file) {

      progress(35);
      setStatus("Uploading photo...");
      step("s2",false,"Uploading photo...");

      const form = new FormData();
      form.append("file",file);
      form.append("upload_preset","arkforge-pets");

      const res = await fetch(
        "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",
        { method:"POST", body:form }
      );

      const data = await res.json();

      if (!data.secure_url) {
        step("s2",false,"Photo failed");
        throw new Error("Upload failed");
      }

      photoURL = data.secure_url;

      step("s2",true,"Photo uploaded");
    }

    progress(70);
    setStatus("Saving profile...");
    step("s3",false,"Saving profile...");

    const existing = snap.data();

    const payload = {
      name,
      phone,
      phone2: phone2 || existing.phone2 || "",
      microchip: document.getElementById("microchip").value.trim() || existing.microchip || "",
      photo: photoURL || existing.photo || "",
      status: "active",
      tosAccepted: true,
      activatedAt: new Date().toISOString()
    };

    await setDoc(ref,payload,{ merge:true });

    step("s3",true,"Profile saved");

    progress(100);
    step("s4",true,"Activation complete");

    setStatus("🎉 Activated! Redirecting...","ok");

    setTimeout(() => {
      window.location.href =
        `https://arkforge3dprinting.github.io/pet-tag/index.html?id=${urlId}`;
    },3000);

    btn.innerText = "Activated";

  } catch(e) {

    console.error(e);
    setStatus("❌ " + e.message,"error");
    running = false;
    btn.disabled = false;
    btn.innerText = "Activate";
  }
};

</script>

</body>
</html>
