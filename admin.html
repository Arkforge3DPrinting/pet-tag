<!DOCTYPE html>
<html>
<head>
  <title>Arkforge Admin Dashboard</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    h2 { margin-bottom: 12px; }

    #search {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filters button {
      padding: 8px 10px;
      border: 1px solid #ccc;
      background: #eee;
      cursor: pointer;
      border-radius: 6px;
    }

    .filters button.active {
      background: #ddd;
      font-weight: bold;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input {
      padding: 8px;
      flex: 1;
      min-width: 180px;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 10px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #eee;
      border-radius: 6px;
    }

    .danger { background: #f2f2f2; }
    .warn { background: #f2f2f2; }
    .ok { background: #f2f2f2; }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      align-items: flex-end;
    }

    .qr {
      margin-left: auto;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: 12px;
    }

    td, th {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: left;
    }

  </style>
</head>

<body>

<h2>🐾 Admin Dashboard</h2>

<input id="search" placeholder="Search ID or name...">

<div class="filters">
  <button class="active" onclick="setFilter('all', this)">All</button>
  <button onclick="setFilter('active', this)">Active</button>
  <button onclick="setFilter('disabled', this)">Disabled</button>
  <button onclick="setFilter('deleted', this)">Deleted</button>
  <button onclick="setFilter('unactivated', this)">Unactivated</button>
</div>

<div id="list"></div>

<h3>Audit Log</h3>
<table>
  <thead>
    <tr>
      <th>Time</th>
      <th>Action</th>
      <th>Tag ID</th>
    </tr>
  </thead>
  <tbody id="audit"></tbody>
</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let pets = [];
let logs = [];
let filter = "all";
let search = "";

const list = document.getElementById("list");
const audit = document.getElementById("audit");

document.getElementById("search").addEventListener("input", e => {
  search = e.target.value.toLowerCase();
  render();
});

function log(action, id) {
  logs.unshift({
    time: new Date().toLocaleString(),
    action,
    id
  });

  audit.innerHTML = logs.map(l => `
    <tr>
      <td>${l.time}</td>
      <td>${l.action}</td>
      <td>${l.id}</td>
    </tr>
  `).join("");
}

onSnapshot(collection(db, "pets"), snap => {
  pets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
});

window.setFilter = (f, btn) => {
  filter = f;

  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  render();
};

function qr(id, el) {
  new QRCode(el, {
    text: `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`,
    width: 80,
    height: 80
  });
}

function render() {

  list.innerHTML = "";

  let filtered = pets.filter(p => {

    const match =
      p.id.toLowerCase().includes(search) ||
      (p.name || "").toLowerCase().includes(search);

    if (!match) return false;

    if (filter === "active") return !p.status && p.activatedAt;
    if (filter === "disabled") return p.status === "disabled";
    if (filter === "deleted") return p.status === "deleted";
    if (filter === "unactivated") return !p.activatedAt;

    return true;
  });

  filtered.forEach(p => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div><b>ID:</b> ${p.id}</div>
      <div><b>Status:</b> ${p.status || "active"}</div>

      <div class="row">
        <input id="name-${p.id}" value="${p.name || ""}">
        <input id="phone-${p.id}" value="${p.phone || ""}">
        <input id="phone2-${p.id}" value="${p.phone2 || ""}">
      </div>

      <div class="footer">
        <div class="qr"><div id="qr-${p.id}"></div></div>
      </div>

      <div class="buttons">

        <button onclick="save('${p.id}')">Save</button>

        <button onclick="toggleDisable('${p.id}', '${p.status || ""}')">
          ${p.status === "disabled" ? "Enable" : "Disable"}
        </button>

        ${
          p.status === "deleted"
          ? `<button onclick="restore('${p.id}')">Restore</button>`
          : `<button class="danger" onclick="softDelete('${p.id}')">Delete</button>`
        }

      </div>
    `;

    list.appendChild(div);

    setTimeout(() => {
      const el = document.getElementById("qr-" + p.id);
      if (el) {
        el.innerHTML = "";
        qr(p.id, el);
      }
    });

  });
}

window.save = async (id) => {
  await updateDoc(doc(db, "pets", id), {
    name: document.getElementById("name-" + id).value,
    phone: document.getElementById("phone-" + id).value,
    phone2: document.getElementById("phone2-" + id).value
  });

  log("EDIT", id);
};

window.toggleDisable = async (id, status) => {

  await updateDoc(doc(db, "pets", id), {
    status: status === "disabled" ? "" : "disabled"
  });

  log(status === "disabled" ? "ENABLE" : "DISABLE", id);
};

window.softDelete = async (id) => {

  const pet = pets.find(p => p.id === id);
  if (!pet) return;

  await setDoc(doc(db, "deleted", id), {
    ...pet,
    status: "deleted"
  });

  await deleteDoc(doc(db, "pets", id));

  log("DELETE", id);
};

window.restore = async (id) => {

  const snap = await getDoc(doc(db, "deleted", id));
  if (!snap.exists()) return;

  await setDoc(doc(db, "pets", id), {
    ...snap.data(),
    status: ""
  });

  await deleteDoc(doc(db, "deleted", id));

  log("RESTORE", id);
};

</script>

</body>
</html>
