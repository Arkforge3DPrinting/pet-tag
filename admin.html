<!DOCTYPE html>

<body>

<h2>🐾 Arkforge Admin Dashboard</h2>

<input id="search" placeholder="Search Tag ID or Pet Name...">

<div class="filters">

  <button class="active" onclick="setFilter('all', this)">All</button>
  <button onclick="setFilter('inactive', this)">Unactivated</button>
  <button onclick="setFilter('active', this)">Activated</button>
  <button onclick="setFilter('missingPhoto', this)">No Photo</button>
  <button onclick="setFilter('missingSecondary', this)">No Secondary</button>

  <button onclick="toggleWorkMode(this)">
    ⚡ Work Mode (Unactivated Only)
  </button>

</div>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const listDiv = document.getElementById("list");

let allPets = [];
let currentSearch = "";
let currentFilter = "all";
let workMode = false;

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  listenForPets();
});

function listenForPets() {

  onSnapshot(collection(db, "pets"), (snap) => {

    allPets = [];

    snap.forEach((docSnap) => {
      allPets.push({
        id: docSnap.id,
        ...docSnap.data()
      });
    });

    render();
  });
}

document.getElementById("search")
.addEventListener("input", (e) => {

  currentSearch = e.target.value.toLowerCase();

  render();
});

window.setFilter = (filter, btn) => {

  currentFilter = filter;

  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  render();
};

window.toggleWorkMode = (btn) => {

  workMode = !workMode;

  btn.classList.toggle("active");

  btn.innerText = workMode
    ? "⚡ Work Mode: ON"
    : "⚡ Work Mode (Unactivated Only)";

  render();
};

function makeQR(id, el) {

  const url =
    `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`;

  new QRCode(el, {
    text: url,
    width: 90,
    height: 90
  });
}

function render() {

  listDiv.innerHTML = "";

  const filtered = allPets.filter((p) => {

    const matchesSearch =
      p.id.toLowerCase().includes(currentSearch) ||
      (p.name || "").toLowerCase().includes(currentSearch);

    if (!matchesSearch) return false;

    if (workMode) {
      return !p.activatedAt;
    }

    switch (currentFilter) {

      case "inactive":
        return !p.activatedAt;

      case "active":
        return !!p.activatedAt;

      case "missingPhoto":
        return !p.photo || p.photo.includes("placeholderpaw");

      case "missingSecondary":
        return !p.phone2;

      default:
        return true;
    }
  });

  filtered.forEach((p) => {

    const badges = [];

    if (p.status === "disabled") {

      badges.push(`
        <span class="badge purple">
          Disabled
        </span>
      `);

    } else {

      if (p.activatedAt) {
        badges.push(`<span class="badge green">Activated</span>`);
      } else {
        badges.push(`<span class="badge red">Unactivated</span>`);
      }

    }

    if (!p.photo || p.photo.includes("placeholderpaw")) {
      badges.push(`<span class="badge orange">No Photo</span>`);
    }

    if (!p.phone2) {
      badges.push(`<span class="badge blue">No Secondary</span>`);
    }

    const div = document.createElement("div");

    div.className = "card";

    div.innerHTML = `

      <div class="meta">
        <b>Tag ID:</b> ${p.id}
      </div>

      <div class="badges">
        ${badges.join("")}
      </div>

      <div class="row">

        <input
          id="name-${p.id}"
          value="${p.name || ""}"
          placeholder="Pet Name">

        <input
          id="phone-${p.id}"
          value="${p.phone || ""}"
          placeholder="Primary">

        <input
          id="phone2-${p.id}"
          value="${p.phone2 || ""}"
          placeholder="Secondary">

      </div>

      <div class="footer">

        <div class="leftSide">
          ${p.photo ? `<img src="${p.photo}">` : ""}
        </div>

        <div class="qrSide">
          <div id="qr-${p.id}"></div>
        </div>

      </div>

      <div class="buttons">

        <button
          class="saveBtn"
          onclick="savePet('${p.id}')">
          💾 Save
        </button>

        <button
          class="disableBtn"
          onclick="toggleDisable('${p.id}', '${p.status || ""}')">

          ${
            p.status === "disabled"
              ? "✅ Re-enable"
              : "⛔ Disable"
          }

        </button>

        <button
          class="deleteBtn"
          onclick="deletePet('${p.id}')">
          🗑 Delete
        </button>

      </div>

    `;

    listDiv.appendChild(div);

    setTimeout(() => {

      const qr =
        document.getElementById("qr-" + p.id);

      if (qr) {

        qr.innerHTML = "";

        makeQR(p.id, qr);
      }

    }, 0);

  });
}

window.savePet = async (id) => {

  await updateDoc(doc(db, "pets", id), {

    name:
      document.getElementById("name-" + id).value,

    phone:
      document.getElementById("phone-" + id).value,

    phone2:
      document.getElementById("phone2-" + id).value

  });
};

window.toggleDisable = async (id, currentStatus) => {

  const disabling =
    currentStatus !== "disabled";

  const confirmed = confirm(

    disabling
      ? "Disable this pet tag?"
      : "Re-enable this pet tag?"

  );

  if (!confirmed) return;

  await updateDoc(doc(db, "pets", id), {

    status:
      disabling
        ? "disabled"
        : "active"

  });
};

window.deletePet = async (id) => {

  if (!confirm("Delete this pet tag?")) return;

  await deleteDoc(doc(db, "pets", id));
};

</script>

</body>
</html>
