<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 14px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px 0;
    }

    p {
      font-size: 15px;
      color: #666;
      margin: 0 0 10px 0;
    }

    /* --- IMAGE WRAPPER FOR PULSE --- */
    #petPhotoWrapper {
      position: relative;
      display: inline-block;
    }

    #petPhoto {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      margin: 10px auto;
      display: none;
      border: 4px solid #fff;
      box-shadow:
        0 0 0 3px #3b82f6,
        0 6px 18px rgba(0,0,0,0.15);
    }

    /* --- PULSE RING --- */
    .pulse-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 260px;
      height: 260px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(52,199,89,0.6);
      opacity: 0;
      pointer-events: none;
    }

    .pulse-ring.active {
      animation: radarPulse 1.6s ease-out infinite;
    }

    @keyframes radarPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.6);
        opacity: 0.9;
      }
      70% { opacity: 0.25; }
      100% {
        transform: translate(-50%, -50%) scale(1.6);
        opacity: 0;
      }
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .single {
      grid-template-columns: 1fr !important;
      justify-items: center;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #callBtn,
    #callBtn2 {
      background: #28c76f;
    }

    #textBtn,
    #textBtn2 {
      background: #3b82f6;
    }

    #locBtn,
    #locBtn2 {
      background: #ff9f43;
    }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }

    #locked {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }

    .tagbox {
      margin-top: 14px;
      padding: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      text-align: left;
    }

    .tagcode {
      font-family: monospace;
      font-size: 15px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      word-break: break-all;
    }

    .tagbtn {
      display: block;
      margin-top: 10px;
      padding: 12px;
      text-align: center;
      background: #3b82f6;
      color: white;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div id="locked">
  <h2>🐾 Tag Not Activated</h2>
  <p>This pet tag must be activated before contact details are available.</p>

  <div class="tagbox">
    <div class="tagcode" id="tagCode"></div>
    <a id="tagLinkBtn" class="tagbtn" target="_blank">🔗 Activate This Tag</a>
  </div>
</div>

<div class="container" id="main">

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <!-- IMAGE + PULSE -->
  <div id="petPhotoWrapper">
    <img id="petPhoto">
    <div class="pulse-ring" id="gpsPulse"></div>
  </div>

  <div id="btnGrid" class="grid">

    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call Secondary</button>

    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text Secondary</button>

    <button id="locBtn">📍 Send Location</button>
    <button id="locBtn2">📍 Send Location Secondary</button>

  </div>

  <div class="footer">
    Powered by Arkforge 3D Printing ®
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

const gpsPulse = document.getElementById("gpsPulse");

function startPulse() {
  gpsPulse.classList.add("active");
}

function stopPulse() {
  gpsPulse.classList.remove("active");
}

/* 🔊 SOUND PING */
function playPing() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();

    const o = ctx.createOscillator();
    const g = ctx.createGain();

    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);

    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);

    o.connect(g);
    g.connect(ctx.destination);

    o.start();
    o.stop(ctx.currentTime + 0.3);
  } catch {}
}

if (!id) {
  document.getElementById("locked").style.display = "block";
  throw new Error("Missing ID");
}

function gps(phone, btn, label) {

  btn.disabled = true;
  btn.innerText = "📡 Getting GPS...";

  startPulse();

  navigator.geolocation.getCurrentPosition(pos => {

    stopPulse();
    playPing();

    const msg =
      "I found " + window.petName +
      ". Location: https://maps.google.com/?q=" +
      pos.coords.latitude + "," + pos.coords.longitude;

    btn.disabled = false;
    btn.innerText = label;

    setTimeout(() => {
      window.open(`sms:${phone}?body=${encodeURIComponent(msg)}`, "_self");
    }, 120);

  }, () => {

    stopPulse();

    btn.disabled = false;
    btn.innerText = label;

    alert("Unable to get GPS location.");
  }, {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
  });
}

async function load() {

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) {
    document.getElementById("locked").style.display = "block";
    return;
  }

  const pet = snap.data();
  window.petName = pet.name || "this pet";

  document.getElementById("main").style.display = "block";

  document.getElementById("title").innerText = "🐾 You found " + window.petName;
  document.getElementById("message").innerText = "Help bring them home safely.";

  const img = document.getElementById("petPhoto");
  if (pet.photo) {
    img.src = pet.photo;
    img.style.display = "block";
  }

  document.getElementById("callBtn").onclick =
    () => location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick =
    () => location.href = `sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + window.petName)}`;

  document.getElementById("locBtn").onclick = e =>
    gps(pet.phone, e.currentTarget, "📍 Send Location");

  if (pet.phone2) {

    document.getElementById("callBtn2").onclick =
      () => location.href = "tel:" + pet.phone2;

    document.getElementById("textBtn2").onclick =
      () => location.href = `sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + window.petName)}`;

    document.getElementById("locBtn2").onclick = e =>
      gps(pet.phone2, e.currentTarget, "📍 Send Location Secondary");

  } else {
    document.getElementById("callBtn2").style.display = "none";
    document.getElementById("textBtn2").style.display = "none";
    document.getElementById("locBtn2").style.display = "none";
  }
}

load();
</script>

</body>
</html>
