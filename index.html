<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffffff, #eef3f8);
      color: #1c1c1e;
      overflow-x: hidden;
    }

    /* =========================
       SCAN INTRO (UPGRADED PULSE)
       ========================= */

    #scanIntro {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;

      animation: fadeOut 1.6s ease forwards;
      animation-delay: 3s; /* slightly longer scan feel */
    }

    .scanWrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scanCircle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      animation: pulse 1.2s infinite;
      z-index: 2;
    }

    /* ripple pulse */
    .scanRipple {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(59,130,246,0.2);
      animation: ripple 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .scanText {
      margin-top: 16px;
      font-weight: 600;
      color: #3b82f6;
      letter-spacing: -0.01em;
    }

    /* =========================
       MAIN CARD
       ========================= */

    .container {
      max-width: 420px;
      margin: auto;
      background: rgba(255,255,255,0.95);
      padding: 18px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.10);
      text-align: center;
      display: none;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px 0;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 15px;
      color: #555;
      margin: 0 0 10px 0;
      line-height: 1.5;
    }

    #petPhoto {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 22px;
      margin: 14px auto;
      display: none;

      border: 4px solid rgba(255,255,255,0.9);
      box-shadow:
        0 0 0 3px #3b82f6,
        0 18px 40px rgba(0,0,0,0.20);
    }

    #microchipText {
      font-size: 14px;
      color: #6b7280;
      margin-top: 6px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e8fff1;
      color: #118a3a;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 12px rgba(52,199,89,0.6);
      animation: pulse 1.6s infinite;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .single {
      grid-template-columns: 1fr !important;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }

    #callBtn, #callBtn2 { background: #22c55e; }
    #textBtn, #textBtn2 { background: #3b82f6; }
    #locBtn, #locBtn2 { background: #f59e0b; }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

<!-- SCAN INTRO -->
<div id="scanIntro">
  <div class="scanWrap">
    <div class="scanRipple"></div>
    <div class="scanCircle"></div>
  </div>
  <div class="scanText">Scanning ArkLink Tag...</div>
</div>

<!-- MAIN -->
<div class="container" id="main">

  <div class="status">
    <span class="dot"></span>
    Found Pet
  </div>

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <img id="petPhoto">

  <div id="microchipText"></div>

  <div id="btnGrid" class="grid">

    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call Secondary</button>

    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text Secondary</button>

    <button id="locBtn">📍 Send Location</button>
    <button id="locBtn2">📍 Send Location Secondary</button>

  </div>

  <div class="footer">
    Powered by ArkLink Pet ID ®
  </div>
</div>

<!-- AUDIO (safe inline chime) -->
<audio id="chime">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-light-positive-notification-951.mp3" type="audio/mpeg">
</audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");
const chime = document.getElementById("chime");

/* SCAN EXPERIENCE */
setTimeout(() => {
  document.getElementById("scanIntro").style.display = "none";

  /* try play sound (may be blocked on some devices until interaction) */
  try {
    chime.volume = 0.6;
    chime.play();
  } catch (e) {}

}, 3200); // longer scan feel

if (!id) {
  throw new Error("Missing ID");
}

async function loadPet() {

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) return;

  const pet = snap.data();

  if (pet.status !== "active") return;

  main.style.display = "block";

  document.getElementById("title").innerText =
    "You found " + (pet.name || "a pet");

  document.getElementById("message").innerText =
    "Help bring them home safely.";

  const img = document.getElementById("petPhoto");

  if (pet.photo) {
    img.src = pet.photo;
    img.style.display = "block";
  }

  document.getElementById("callBtn").onclick =
    () => window.location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick =
    () => window.open(`sms:${pet.phone}`, "_self");

  document.getElementById("locBtn").onclick = () => {
    navigator.geolocation.getCurrentPosition(pos => {
      window.open(
        `sms:${pet.phone}?body=Location: https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`,
        "_self"
      );
    });
  };
}

loadPet();
</script>

</body>
</html>
