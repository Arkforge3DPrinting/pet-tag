<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  height: 100%;
  overflow: hidden;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #ffffff 0%, #eef4ff 35%, #dfe9f7 100%);
  color: #111827;
  padding: 14px;
}

/* soft background glow */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 20%, rgba(52,199,89,.12), transparent 30%),
    radial-gradient(circle at 80% 10%, rgba(59,130,246,.12), transparent 30%),
    radial-gradient(circle at 50% 100%, rgba(255,159,10,.10), transparent 40%);
}

.container,
#locked {
  width: 100%;
  max-width: 460px;
  max-height: 95vh;

  display: flex;
  flex-direction: column;

  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  border-radius: 34px;
  border: 1px solid rgba(255,255,255,0.8);

  box-shadow: 0 25px 60px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.04);

  overflow: hidden;
}

.container { display: none; }
#locked { display: none; padding: 26px; text-align: center; }

/* HERO (flex fills remaining space) */
.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;
  padding: 18px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(52,199,89,0.14);
  color: #1c7a39;
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 12px;
  margin-bottom: 10px;
}

/* PET IMAGE */
#petPhoto {
  width: min(220px, 55vw);
  aspect-ratio: 1 / 1;
  object-fit: cover;

  border-radius: 28px;
  margin: 10px 0;

  display: none;

  border: 6px solid white;
  box-shadow: 0 18px 40px rgba(0,0,0,0.18);
}

/* TEXT */
h1 {
  font-size: clamp(20px, 4.5vw, 30px);
  font-weight: 800;
  margin-top: 8px;
}

p {
  font-size: 14px;
  color: #6b7280;
}

/* NOTICE */
.notice {
  margin: 8px 14px;
  padding: 10px;
  border-radius: 16px;
  background: rgba(59,130,246,0.08);
  border: 1px solid rgba(59,130,246,0.15);
  font-size: 12px;
  font-weight: 600;
  text-align: center;
}

/* BUTTON GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px 14px 14px;
  flex-shrink: 0;
}

/* BUTTONS */
button {
  border: none;
  border-radius: 18px;

  padding: 12px 8px;
  min-height: 64px;

  font-size: 12px;
  font-weight: 700;

  color: white;
  cursor: pointer;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  transition: 0.15s ease;
}

button:active { transform: scale(0.97); }
button:disabled { opacity: 0.6; }

#callBtn,#callBtn2 { background: linear-gradient(180deg,#34c759,#28a745); }
#textBtn,#textBtn2 { background: linear-gradient(180deg,#0a84ff,#0066d6); }
#locBtn,#locBtn2 { background: linear-gradient(180deg,#ff9f0a,#e68500); }

/* LOCKED */
#locked {
  padding: 24px;
}

/* TAG */
.tagbox {
  margin-top: 14px;
  padding: 12px;
  background: #f8fafc;
  border-radius: 14px;
}

.tagcode {
  font-family: monospace;
  padding: 10px;
  background: white;
  border-radius: 10px;
  border: 1px solid #ddd;
}

/* Pulse removed visually (kept lightweight app feel) */
</style>
</head>

<body>

<div id="locked">
  <h2>🐾 Tag Not Activated</h2>
  <p>This pet tag must be activated before contact details are available.</p>

  <div class="tagbox">
    <div class="tagcode" id="tagCode"></div>
    <a id="tagLinkBtn" target="_blank">Activate Tag</a>
  </div>
</div>

<div class="container" id="main">

  <div class="hero">
    <div class="status-pill">🐾 Help Me Get Home</div>

    <img id="petPhoto">

    <h1 id="title">Loading...</h1>
    <p id="message"></p>
  </div>

  <div class="notice">
    Contact the owner if found.
  </div>

  <div id="btnGrid" class="grid">

    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Backup</button>

    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Backup</button>

    <button id="locBtn">📍 Location</button>
    <button id="locBtn2">📍 Backup</button>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
});

const db = getFirestore(app);

const id = new URLSearchParams(location.search).get("id");

const main = document.getElementById("main");
const locked = document.getElementById("locked");

function playPing() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    const o = ctx.createOscillator();
    const g = ctx.createGain();

    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);

    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);

    o.connect(g);
    g.connect(ctx.destination);

    o.start();
    o.stop(ctx.currentTime + 0.3);
  } catch {}
}

function gps(phone, label, btn) {

  btn.disabled = true;
  btn.innerText = "📡 Getting...";

  navigator.geolocation.getCurrentPosition(pos => {

    playPing();

    const msg =
      "I found " + window.petName +
      ". https://maps.google.com/?q=" +
      pos.coords.latitude + "," + pos.coords.longitude;

    btn.disabled = false;
    btn.innerText = label;

    setTimeout(() => {
      location.href = `sms:${phone}?body=${encodeURIComponent(msg)}`;
    }, 120);

  }, () => {

    btn.disabled = false;
    btn.innerText = label;
    alert("GPS failed.");
  }, {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
  });
}

async function load() {

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) return locked.style.display = "block";

  const pet = snap.data();
  window.petName = pet.name || "this pet";

  main.style.display = "flex";

  document.getElementById("title").innerText = "🐾 " + window.petName;
  document.getElementById("message").innerText = "Help bring them home safely.";

  const img = document.getElementById("petPhoto");
  if (pet.photo) {
    img.src = pet.photo;
    img.style.display = "block";
  }

  document.getElementById("callBtn").onclick = () => location.href = "tel:" + pet.phone;
  document.getElementById("textBtn").onclick = () =>
    location.href = `sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + window.petName)}`;

  document.getElementById("locBtn").onclick = e =>
    gps(pet.phone, "📍 Location", e.currentTarget);

  if (pet.phone2) {

    document.getElementById("callBtn2").onclick = () => location.href = "tel:" + pet.phone2;

    document.getElementById("textBtn2").onclick = () =>
      location.href = `sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + window.petName)}`;

    document.getElementById("locBtn2").onclick = e =>
      gps(pet.phone2, "📍 Backup", e.currentTarget);

  } else {
    document.querySelectorAll("#callBtn2,#textBtn2,#locBtn2").forEach(e => e.style.display = "none");
  }
}

load();
</script>

</body>
</html>
