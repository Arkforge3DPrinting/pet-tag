<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 14px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h2 {
      margin: 0 0 10px 0;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    input:focus {
      border-color: #3b82f6;
      outline: none;
    }

    .upload-box {
      margin: 10px 0;
      padding: 14px;
      border-radius: 14px;
      border: 1px dashed #ccc;
      background: #fafafa;
    }

    #photoInput {
      display: none;
    }

    .file-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .camera { background: #ff9f43; }
    .gallery { background: #3b82f6; }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    button:active {
      transform: scale(0.98);
    }

    #fileName {
      font-size: 12px;
      margin-top: 6px;
      color: #555;
      word-break: break-word;
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
    }

  </style>
</head>

<body>

<div class="container">

  <h2>Activate Your Pet Tag</h2>

  <input type="text" id="name" placeholder="Pet Name">
  <input type="text" id="phone" placeholder="Primary Contact Number">
  <input type="text" id="phone2" placeholder="Secondary Contact (optional)">

  <div class="upload-box">

    <input type="file" id="photoInput" accept="image/*">

    <div class="file-btn camera" id="cameraBtn">📷 Take Photo</div>
    <div class="file-btn gallery" id="galleryBtn">📁 Choose From Gallery</div>

    <div id="fileName"></div>

  </div>

  <button id="activateBtn">Activate</button>

  <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ID generator
function generateId(length = 10) {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  let id = "";
  for (let i = 0; i < length; i++) {
    id += chars[Math.floor(Math.random() * chars.length)];
  }
  return id;
}

// file input
const photoInput = document.getElementById("photoInput");
const fileName = document.getElementById("fileName");

document.getElementById("cameraBtn").onclick = () => {
  photoInput.setAttribute("capture", "environment");
  photoInput.click();
};

document.getElementById("galleryBtn").onclick = () => {
  photoInput.removeAttribute("capture");
  photoInput.click();
};

photoInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  fileName.innerText = file ? file.name : "";
});

// MAIN SAVE
document.getElementById("activateBtn").onclick = async () => {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();

  const status = document.getElementById("status");

  if (!name || !phone) {
    status.innerText = "Please fill in pet name and primary contact";
    return;
  }

  const id = generateId();
  let photoURL = "";

  try {

    // ================= UPLOAD IMAGE =================
    const file = photoInput.files[0];

    if (file) {

      status.innerText = "Uploading image...";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", "arkforge-pets");

      const xhr = new XMLHttpRequest();

      xhr.open("POST", "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload");

      const response = await new Promise((resolve, reject) => {

        xhr.onload = () => resolve(JSON.parse(xhr.responseText));
        xhr.onerror = () => reject("Upload failed");

        xhr.send(formData);

      });

      photoURL = response.secure_url;
    }

    // ================= BUILD FIRESTORE DATA =================

    const data = {
      name,
      phone
    };

    if (phone2) {
      data.phone2 = phone2;
    }

    // 🔥 IMPORTANT FIX (prevents placeholder being overwritten)
    if (photoURL) {
      data.photo = photoURL;
    }

    await setDoc(doc(db, "pets", id), data);

    const url = `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`;

    status.innerHTML = `
      <b>Activated!</b><br><br>
      <b>ID:</b> ${id}<br><br>
      <b>URL:</b><br>
      <a href="${url}" target="_blank">${url}</a>
    `;

  } catch (e) {
    console.log(e);
    status.innerText = "Error: " + e.message;
  }

};

</script>

</body>
</html>
