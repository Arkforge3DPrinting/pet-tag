<!DOCTYPE html>
<html>
<head>
  <title>Arkforge Admin Dashboard v5</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    h2 { margin-bottom: 12px; }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filters button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #ddd;
      cursor: pointer;
      font-weight: bold;
    }

    .filters button.active {
      background: #3b82f6;
      color: white;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .badges { margin-bottom: 10px; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      margin-right: 5px;
    }

    .green { background: #dcfce7; color: #166534; }
    .red { background: #fee2e2; color: #991b1b; }
    .orange { background: #ffedd5; color: #9a3412; }
    .blue { background: #dbeafe; color: #1d4ed8; }
    .purple { background: #ede9fe; color: #5b21b6; }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .row input {
      flex: 1;
      min-width: 200px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .buttons button {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .saveBtn { background: #3b82f6; color: white; }
    .disableBtn { background: #7c3aed; color: white; }
    .deleteBtn { background: #ef4444; color: white; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 12px;
    }

    .leftSide img {
      max-width: 110px;
      border-radius: 10px;
      border: 2px solid #eee;
    }

  </style>
</head>

<body>

<h2>🐾 Arkforge Admin Dashboard</h2>

<input id="search" placeholder="Search Tag ID or Pet Name...">

<div class="filters">

  <button class="active" onclick="setFilter('all', this)">All</button>
  <button onclick="setFilter('inactive', this)">Unactivated</button>
  <button onclick="setFilter('active', this)">Activated</button>
  <button onclick="setFilter('disabled', this)">Disabled</button>
  <button onclick="setFilter('missingPhoto', this)">No Photo</button>
  <button onclick="setFilter('missingSecondary', this)">No Secondary</button>

</div>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  addDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIza...",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let allPets = [];
let currentFilter = "all";
let currentSearch = "";

const listDiv = document.getElementById("list");

/* AUTH */
onAuthStateChanged(auth, (user) => {
  if (!user) return (window.location.href = "login.html");
  listen();
});

/* DATA */
function listen() {
  onSnapshot(collection(db, "pets"), (snap) => {
    allPets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

/* SEARCH */
document.getElementById("search").addEventListener("input", (e) => {
  currentSearch = e.target.value.toLowerCase();
  render();
});

/* FILTER */
window.setFilter = (f, btn) => {
  currentFilter = f;
  document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
};

/* AUDIT LOG */
async function audit(action, petId, details = "") {
  await addDoc(collection(db, "auditLogs"), {
    action,
    petId,
    details,
    timestamp: new Date().toISOString()
  });
}

/* QR */
function makeQR(id, el) {
  new QRCode(el, {
    text: `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`,
    width: 90,
    height: 90
  });
}

/* RENDER */
function render() {
  listDiv.innerHTML = "";

  const filtered = allPets.filter(p => {

    const match =
      p.id.toLowerCase().includes(currentSearch) ||
      (p.name || "").toLowerCase().includes(currentSearch);

    if (!match) return false;

    switch (currentFilter) {
      case "inactive": return !p.activatedAt;
      case "active": return !!p.activatedAt;
      case "disabled": return p.status === "disabled";
      case "missingPhoto": return !p.photo;
      case "missingSecondary": return !p.phone2;
      default: return true;
    }
  });

  filtered.forEach(p => {

    const badges = [];

    if (p.status === "disabled") {
      badges.push(`<span class="badge purple">Disabled</span>`);
    } else if (p.activatedAt) {
      badges.push(`<span class="badge green">Active</span>`);
    } else {
      badges.push(`<span class="badge red">Inactive</span>`);
    }

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="meta"><b>${p.id}</b></div>

      <div class="badges">${badges.join("")}</div>

      <div class="row">
        <input id="name-${p.id}" value="${p.name || ""}" placeholder="Pet Name">
        <input id="phone-${p.id}" value="${p.phone || ""}" placeholder="Primary">
        <input id="phone2-${p.id}" value="${p.phone2 || ""}" placeholder="Secondary">
      </div>

      <div class="footer">
        <div class="leftSide">
          ${p.photo ? `<img src="${p.photo}">` : ""}
        </div>
        <div id="qr-${p.id}"></div>
      </div>

      <div class="buttons">
        <button class="saveBtn" onclick="save('${p.id}')">Save</button>

        <button class="disableBtn" onclick="toggle('${p.id}', '${p.status || ""}')">
          ${p.status === "disabled" ? "Re-enable" : "Disable"}
        </button>
      </div>
    `;

    listDiv.appendChild(div);

    setTimeout(() => {
      const el = document.getElementById("qr-" + p.id);
      if (el) {
        el.innerHTML = "";
        makeQR(p.id, el);
      }
    });

  });
}

/* SAVE */
window.save = async (id) => {
  const p = allPets.find(x => x.id === id);

  await updateDoc(doc(db, "pets", id), {
    name: document.getElementById("name-" + id).value,
    phone: document.getElementById("phone-" + id).value,
    phone2: document.getElementById("phone2-" + id).value
  });

  await audit("edit", id);
};

/* DISABLE / RESTORE */
window.toggle = async (id, status) => {

  const disable = status !== "disabled";

  await updateDoc(doc(db, "pets", id), {
    status: disable ? "disabled" : "active"
  });

  await audit(disable ? "disabled" : "enabled", id);
};

</script>

</body>
</html>
