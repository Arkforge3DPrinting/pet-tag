<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 14px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 4px 0;
    }

    p {
      font-size: 15px;
      color: #666;
      margin: 0 0 10px 0;
    }

    #petPhoto {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      margin: 10px auto;
      display: none;
      border: 4px solid #fff;
      box-shadow: 0 0 0 3px #3b82f6, 0 6px 18px rgba(0,0,0,0.15);
    }

    /* LABELS */
    .label {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #888;
      margin-top: 16px;
      margin-bottom: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 6px;
    }

    /* SINGLE COLUMN MODE */
    .single {
      grid-template-columns: 1fr !important;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease;
      color: white;
    }

    button:active {
      transform: scale(0.97);
    }

    /* PRIMARY */
    #callBtn { background: #28c76f; }
    #textBtn { background: #3b82f6; }
    #locBtn  { background: #ff9f43; }

    /* SECONDARY */
    #callBtn2 { background: #1f9d55; }
    #textBtn2 { background: #2563eb; }
    #locBtn2  { background: #f59e0b; }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }

    #secondaryWrap {
      display: none;
    }

  </style>
</head>

<body>

<div class="container">

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <img id="petPhoto">

  <!-- CALL -->
  <div class="label">Call</div>
  <div id="callGrid" class="grid">
    <button id="callBtn">📞 Primary</button>
    <button id="callBtn2">📞 Secondary</button>
  </div>

  <!-- TEXT -->
  <div class="label">Text</div>
  <div id="textGrid" class="grid">
    <button id="textBtn">💬 Primary</button>
    <button id="textBtn2">💬 Secondary</button>
  </div>

  <!-- LOCATION -->
  <div class="label">Send Location</div>
  <div id="locGrid" class="grid">
    <button id="locBtn">📍 Primary</button>
    <button id="locBtn2">📍 Secondary</button>
  </div>

  <div class="footer">
    Powered by Arkforge 3D Printing ®
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function setSingleMode(grid) {
  grid.classList.add("single");
}

async function loadPet() {

  const id = new URLSearchParams(window.location.search).get("id");

  if (!id) {
    document.getElementById("title").innerText = "No pet ID found";
    return;
  }

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) {
    document.getElementById("title").innerText = "Error loading pet";
    return;
  }

  const pet = snap.data();

  document.getElementById("title").innerText = "🐾 You found " + pet.name;
  document.getElementById("message").innerText = "Help me get home safely";

  if (pet.photo) {
    const img = document.getElementById("petPhoto");
    img.src = pet.photo;
    img.style.display = "block";
  }

  const primary = pet.phone && pet.phone.trim() !== "";
  const secondary = pet.phone2 && pet.phone2.trim() !== "";

  // ================= PRIMARY =================

  document.getElementById("callBtn").onclick = () =>
    window.location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick = () =>
    window.open(
      `sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
      "_self"
    );

  document.getElementById("locBtn").onclick = () => {

    navigator.geolocation.getCurrentPosition((pos) => {

      const msg =
        "I found your pet " +
        pet.name +
        ". Location: https://maps.google.com/?q=" +
        pos.coords.latitude + "," + pos.coords.longitude;

      window.open(
        `sms:${pet.phone}?body=${encodeURIComponent(msg)}`,
        "_self"
      );

    });

  };

  // ================= SECONDARY =================

  const call2 = document.getElementById("callBtn2");
  const text2 = document.getElementById("textBtn2");
  const loc2  = document.getElementById("locBtn2");

  if (!secondary) {

    // ❌ no backup → remove secondary UI completely
    call2.remove();
    text2.remove();
    loc2.remove();

  } else {

    call2.onclick = () =>
      window.location.href = "tel:" + pet.phone2;

    text2.onclick = () =>
      window.open(
        `sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
        "_self"
      );

    loc2.onclick = () => {

      navigator.geolocation.getCurrentPosition((pos) => {

        const msg =
          "I found your pet " +
          pet.name +
          ". Location: https://maps.google.com/?q=" +
          pos.coords.latitude + "," + pos.coords.longitude;

        window.open(
          `sms:${pet.phone2}?body=${encodeURIComponent(msg)}`,
          "_self"
        );

      });

    };

  }

  // ================= AUTO SINGLE-COLUMN MODE =================

  if (!secondary) {

    setSingleMode(document.getElementById("callGrid"));
    setSingleMode(document.getElementById("textGrid"));
    setSingleMode(document.getElementById("locGrid"));

  }

}

loadPet();

</script>

</body>
</html>
