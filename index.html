<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
      color: #222;
    }

    #scanIntro {
      position: fixed;
      inset: 0;
      background: rgba(245, 247, 250, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      animation: fadeOut 1.2s ease forwards;
      animation-delay: 2.8s;
    }

    .scanCircle {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      box-shadow: 0 0 25px rgba(59,130,246,0.25);
      animation: pulse 1.2s infinite;
      position: relative;
    }

    .scanCircle::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(59,130,246,0.15);
      animation: ripple 1.6s infinite;
    }

    .scanText {
      margin-top: 14px;
      font-weight: bold;
      color: #3b82f6;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: linear-gradient(180deg, #ffffff, #fbfcfd);
      padding: 16px;
      border-radius: 22px;
      border: 1px solid rgba(59,130,246,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
      position: relative;
    }

    h1 { font-size: 24px; margin: 0 0 6px 0; }

    p { font-size: 15px; color: #666; margin: 0 0 10px 0; }

#petPhoto {
  width: 100%;
  max-width: 240px;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 18px;
  margin: 10px auto;

  /* remove harsh border */
  border: none;

  /* soft premium base glow */
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35),
              0 10px 25px rgba(0, 0, 0, 0.08);

  animation: petGlow 2.8s ease-in-out infinite;
}

/* subtle breathing green glow */
@keyframes petGlow {
  0% {
    box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25),
                0 0 10px rgba(34, 197, 94, 0.15),
                0 10px 25px rgba(0, 0, 0, 0.08);
  }
  50% {
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.45),
                0 0 18px rgba(34, 197, 94, 0.25),
                0 10px 25px rgba(0, 0, 0, 0.10);
  }
  100% {
    box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25),
                0 0 10px rgba(34, 197, 94, 0.15),
                0 10px 25px rgba(0, 0, 0, 0.08);
  }
}

    .single { grid-template-columns: 1fr !important; }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    button:disabled { opacity: 0.7; }

    #callBtn, #callBtn2 { background: #28c76f; }
    #textBtn, #textBtn2 { background: #3b82f6; }
    #locBtn, #locBtn2 { background: #ff9f43; }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }

    #locked {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }

    .tagbox {
      margin-top: 14px;
      padding: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      text-align: left;
    }

    .tagcode {
      font-family: monospace;
      font-size: 15px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      word-break: break-all;
    }

    .tagbtn {
      display: block;
      margin-top: 10px;
      padding: 12px;
      text-align: center;
      background: #3b82f6;
      color: white;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
}

.gps-status {
  display: none;
  margin-top: 8px;
  text-align: center;
  font-size: 12px;
  color: #22c55e;
  font-weight: bold;
  letter-spacing: 2px;
  opacity: 0.8;
}

.gps-text {
  display: none;
  margin-top: 3px;
  text-align: center;
  font-size: 11px;
  color: #777;
  opacity: 0.9;
}
  </style>
</head>

<body>

<div id="scanIntro">
  <div class="scanCircle"></div>
  <div class="scanText">Scanning ArkLink Tag...</div>
</div>

<div id="locked">
  <h2>🐾 Tag Not Activated</h2>
  <p>This pet tag must be activated before contact details are available.</p>

  <div class="tagbox">
    <div class="tagcode" id="tagCode"></div>
    <a id="tagLinkBtn" class="tagbtn" target="_blank">🔗 Activate This Tag</a>
  </div>
</div>

<div class="container" id="main">

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <img id="petPhoto">
  <div id="microchipText"></div>

  <div id="btnGrid" class="grid">

    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call Secondary</button>

    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text Secondary</button>

    <button id="locBtn">📍 Send Location</button>
    <button id="locBtn2">📍 Send Location Secondary</button>

  </div>
  <div id="gpsStatus" class="gps-status">●○○</div>
<div id="gpsText" class="gps-text">Acquiring your location...</div>
  <div class="footer">Powered by ArkLink Pet ID ®</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");
const locked = document.getElementById("locked");

if (!id) {
  locked.style.display = "block";
  document.getElementById("tagCode").innerText = "INVALID";
  throw new Error("Missing ID");
}

document.getElementById("tagCode").innerText = id;
document.getElementById("tagLinkBtn").href =
  "https://arkforge3dprinting.github.io/pet-tag/activate.html?id=" + id;

/* =========================
   GPS FIX (REUSABLE)
   ========================= */

function getGPS() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("No GPS"));
      return;
    }

    const timeout = setTimeout(() => reject(new Error("timeout")), 12000);

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        clearTimeout(timeout);
        resolve(pos);
      },
      (err) => {
        clearTimeout(timeout);
        reject(err);
      },
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
  });
}

let gpsBusy = false;

/* =========================
   MAIN LOAD
   ========================= */

async function loadPet() {

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) {
    locked.style.display = "block";
    return;
  }

  const pet = snap.data();

  if (pet.status !== "active") {
    locked.style.display = "block";
    return;
  }

  main.style.display = "block";

  document.getElementById("title").innerText =
    "🐾 You found " + (pet.name || "a pet");

  document.getElementById("message").innerText =
    "Help get " + (pet.name || "this pet") + " home safely.";

  if (pet.microchip) {
    document.getElementById("microchipText").innerHTML =
      "Microchip: <b>" + pet.microchip + "</b>";
  }

  if (pet.photo) {
    const img = document.getElementById("petPhoto");
    img.src = pet.photo;
  }

 function bindGPS(btnId, phone, label) {
  const btn = document.getElementById(btnId);

  btn.onclick = async () => {
    if (gpsBusy) return;
    gpsBusy = true;

    const gpsStatus = document.getElementById("gpsStatus");
    const gpsText = document.getElementById("gpsText");

    const frames = ["●○○", "●●○", "●●●"];
    let frame = 0;

    gpsStatus.innerText = frames[0];
    gpsStatus.style.display = "block";
    gpsText.style.display = "block";

    const gpsAnimation = setInterval(() => {
      frame = (frame + 1) % frames.length;
      gpsStatus.innerText = frames[frame];
    }, 350);

    btn.disabled = true;
    btn.innerText = "📡 Acquiring GPS...";

    try {
      const pos = await getGPS();

      const msg =
        "I found " + pet.name +
        ". Location: https://maps.google.com/?q=" +
        pos.coords.latitude + "," + pos.coords.longitude;

      window.open(
        `sms:${phone}?body=${encodeURIComponent(msg)}`,
        "_self"
      );

    } catch (e) {
      alert("Unable to get GPS location.");
    } finally {
      clearInterval(gpsAnimation);

      gpsStatus.style.display = "none";
      gpsText.style.display = "none";

      btn.disabled = false;
      btn.innerText = label;
      gpsBusy = false;
    }
  };
}

  document.getElementById("callBtn").onclick =
    () => window.location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick =
    () => window.open(`sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`, "_self");

  bindGPS("locBtn", pet.phone, "📍 Send Location");

  if (pet.phone2 && pet.phone2.trim()) {
    document.getElementById("callBtn2").onclick =
      () => window.location.href = "tel:" + pet.phone2;

    document.getElementById("textBtn2").onclick =
      () => window.open(`sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`, "_self");

    bindGPS("locBtn2", pet.phone2, "📍 Send Location Secondary");

  } else {
    document.getElementById("callBtn2").style.display = "none";
    document.getElementById("textBtn2").style.display = "none";
    document.getElementById("locBtn2").style.display = "none";
    document.getElementById("btnGrid").classList.add("single");
  }
}

loadPet();
</script>

</body>
</html>
