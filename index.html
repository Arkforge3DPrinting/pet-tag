<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 14px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 4px 0;
    }

    p {
      font-size: 15px;
      color: #666;
      margin: 0 0 10px 0;
    }

    #petPhoto {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      margin: 10px auto;
      display: none;
      border: 4px solid #fff;
      box-shadow: 0 0 0 3px #3b82f6, 0 6px 18px rgba(0,0,0,0.15);
    }

    .label {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #888;
      margin-top: 16px;
      margin-bottom: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 6px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease;
      color: white;
    }

    button:active {
      transform: scale(0.97);
    }

    /* colors */
    #callBtn, #callBtn2 { background: #28c76f; }
    #textBtn, #textBtn2 { background: #3b82f6; }
    #locBtn, #locBtn2   { background: #ff9f43; }

  </style>
</head>

<body>

<div class="container">

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <img id="petPhoto">

  <!-- CALL -->
  <div class="label">Call</div>
  <div id="callGrid" class="grid">
    <button id="callBtn"></button>
    <button id="callBtn2"></button>
  </div>

  <!-- TEXT -->
  <div class="label">Text</div>
  <div id="textGrid" class="grid">
    <button id="textBtn"></button>
    <button id="textBtn2"></button>
  </div>

  <!-- LOCATION -->
  <div class="label">Send Location</div>
  <div id="locGrid" class="grid">
    <button id="locBtn"></button>
    <button id="locBtn2"></button>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function setLabels(primary, secondary, hasSecondary) {

  const callBtn = document.getElementById("callBtn");
  const callBtn2 = document.getElementById("callBtn2");

  const textBtn = document.getElementById("textBtn");
  const textBtn2 = document.getElementById("textBtn2");

  const locBtn = document.getElementById("locBtn");
  const locBtn2 = document.getElementById("locBtn2");

  if (!hasSecondary) {

    callBtn.innerText = "📞 Call";
    textBtn.innerText = "💬 Text";
    locBtn.innerText  = "📍 Location";

    callBtn2.remove();
    textBtn2.remove();
    locBtn2.remove();

  } else {

    callBtn.innerText = "📞 Call Primary";
    textBtn.innerText = "💬 Text Primary";
    locBtn.innerText  = "📍 Send Location Primary";

    callBtn2.innerText = "📞 Call Secondary";
    textBtn2.innerText = "💬 Text Secondary";
    locBtn2.innerText  = "📍 Send Location Secondary";

  }
}

async function loadPet() {

  const id = new URLSearchParams(window.location.search).get("id");

  if (!id) return;

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) return;

  const pet = snap.data();

  document.getElementById("title").innerText = "🐾 You found " + pet.name;
  document.getElementById("message").innerText = "Help me get home safely";

  if (pet.photo) {
    const img = document.getElementById("petPhoto");
    img.src = pet.photo;
    img.style.display = "block";
  }

  const primary = pet.phone;
  const secondary = pet.phone2 && pet.phone2.trim() !== "";

  // ================= LABEL SYSTEM =================
  setLabels(primary, secondary, secondary);

  // ================= PRIMARY =================

  document.getElementById("callBtn").onclick = () =>
    window.location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick = () =>
    window.open(`sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`, "_self");

  document.getElementById("locBtn").onclick = () => {

    navigator.geolocation.getCurrentPosition((pos) => {

      const msg =
        "I found your pet " +
        pet.name +
        ". Location: https://maps.google.com/?q=" +
        pos.coords.latitude + "," + pos.coords.longitude;

      window.open(`sms:${pet.phone}?body=${encodeURIComponent(msg)}`, "_self");

    });

  };

  // ================= SECONDARY =================

  if (!secondary) return;

  document.getElementById("callBtn2").onclick = () =>
    window.location.href = "tel:" + pet.phone2;

  document.getElementById("textBtn2").onclick = () =>
    window.open(`sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`, "_self");

  document.getElementById("locBtn2").onclick = () => {

    navigator.geolocation.getCurrentPosition((pos) => {

      const msg =
        "I found your pet " +
        pet.name +
        ". Location: https://maps.google.com/?q=" +
        pos.coords.latitude + "," + pos.coords.longitude;

      window.open(`sms:${pet.phone2}?body=${encodeURIComponent(msg)}`, "_self");

    });

  };

}

loadPet();

</script>

</body>
</html>
