<!DOCTYPE html>
<html>
<head>
  <title>Create Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial;
      background: #f4f6f8;
      margin: 0;
      padding: 18px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #app { display: none; }
    #loginBox { display: none; }

    .title {
      font-size: 20px;
      margin-bottom: 12px;
    }

    #loading {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="card">

  <div id="loading">Checking session...</div>

  <!-- LOGIN -->
  <div id="loginBox">
    <div class="title">🔐 Login - Create Tag</div>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>
    <p id="loginStatus"></p>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="title">🐾 Create Pet Tag</div>

    <input id="name" placeholder="Pet Name">
    <input id="phone" placeholder="Primary Phone">
    <input id="phone2" placeholder="Secondary (optional)">

    <button id="createBtn">Create Tag</button>
    <p id="result"></p>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

await setPersistence(auth, browserLocalPersistence);

const loginBox = document.getElementById("loginBox");
const appBox = document.getElementById("app");
const loading = document.getElementById("loading");

let authResolved = false;

/* 🔥 FIX: proper auth boot sequence */
onAuthStateChanged(auth, (user) => {

  authResolved = true;
  loading.style.display = "none";

  if (user) {
    loginBox.style.display = "none";
    appBox.style.display = "block";
  } else {
    loginBox.style.display = "block";
    appBox.style.display = "none";
  }

});

/* LOGIN */
document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const status = document.getElementById("loginStatus");

  try {
    await signInWithEmailAndPassword(auth, email, password);
    status.innerText = "Success...";
  } catch (e) {
    status.innerText = e.message;
  }
};

/* ID GEN */
function idGen(len = 10) {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  return Array.from({ length: len }, () =>
    chars[Math.floor(Math.random() * chars.length)]
  ).join("");
}

/* DEFAULT IMAGE */
const defaultPhoto =
  "https://res.cloudinary.com/ddsp7ps7p/image/upload/v1776062761/placeholderpaw_a29ok1.jpg";

/* CREATE */
document.getElementById("createBtn").onclick = async () => {

  if (!authResolved) {
    alert("Auth still loading...");
    return;
  }

  if (!auth.currentUser) {
    alert("Not logged in");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();

  if (!name || !phone) return alert("Missing fields");

  const id = idGen();

  try {

    await setDoc(doc(db, "pets", id), {
      name,
      phone,
      phone2: phone2 || "",
      photo: defaultPhoto,
      status: "inactive",
      createdAt: new Date().toISOString()
    });

    document.getElementById("result").innerText =
      "Created: " + id;

  } catch (e) {
    alert(e.message);
  }
};

</script>

</body>
</html>
