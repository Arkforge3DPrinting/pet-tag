<!DOCTYPE html>
<html>
<head>
  <title>Create Pet Tag</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 18px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin: 0 0 10px 0;
      text-align: center;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    .full { grid-column: span 2; }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      background: #3b82f6;
      color: white;
    }

    #result {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>Create Pet Tag</h2>

  <div class="grid">

    <input id="name" placeholder="Pet Name" class="full">
    <input id="phone" placeholder="Primary Phone">
    <input id="phone2" placeholder="Secondary (optional)">

    <button id="generateBtn" class="full">Generate & Save</button>

  </div>

  <div id="result"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;

/* IMPORTANT: persist session */
await setPersistence(auth, browserLocalPersistence);

/* DO NOT BLOCK PAGE ON LOAD */
onAuthStateChanged(auth, (user) => {
  currentUser = user;
});

/* ID GENERATOR */
function idGen(len = 10) {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  return Array.from({ length: len }, () =>
    chars[Math.floor(Math.random() * chars.length)]
  ).join("");
}

/* CREATE */
document.getElementById("generateBtn").onclick = async () => {

  // 🔥 re-check auth at click time (IMPORTANT FIX)
  if (!auth.currentUser) {
    alert("You are not logged in. Please refresh or sign in again.");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();

  if (!name || !phone) {
    alert("Enter name + phone");
    return;
  }

  const id = idGen();

  const url =
    `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`;

  try {

    await setDoc(doc(db, "pets", id), {
      name,
      phone,
      phone2: phone2 || "",
      photo: "https://res.cloudinary.com/ddsp7ps7p/image/upload/v1776062761/placeholderpaw_a29ok1.jpg",
      status: "inactive",
      createdAt: new Date().toISOString()
    });

    document.getElementById("result").innerHTML =
      `<b>ID:</b> ${id}<br>${url}`;

  } catch (err) {
    alert("Create failed: " + err.message);
  }
};

</script>

</body>
</html>
