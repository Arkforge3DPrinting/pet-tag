<!DOCTYPE html>
<html>
<head>
  <title>Arkforge Control Hub</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      background: #f4f6f8;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #111827;
      color: white;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .nav {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      background: #1f2937;
    }

    .nav:hover {
      background: #374151;
    }

    .nav.active {
      background: #3b82f6;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .panel {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .panel.active {
      display: block;
    }

    button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      font-weight: bold;
    }

  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="brand">🐾 Control Hub</div>

  <div class="nav active" onclick="openTab('create', this)">
    ➕ Create
  </div>

  <div class="nav" onclick="openTab('activate', this)">
    🔐 Activate
  </div>

  <div class="nav" onclick="openTab('database', this)">
    📦 Database
  </div>

  <div class="nav" onclick="openTab('qr', this)">
    📱 QR Tools
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <!-- CREATE -->
  <div id="create" class="panel active">
    <h2>Create Tag</h2>
    <p>This is your create tool embedded view.</p>

    <button onclick="window.location.href='create.html'">
      Open Full Tool (optional)
    </button>
  </div>

  <!-- ACTIVATE -->
  <div id="activate" class="panel">
    <h2>Activate Tag</h2>
    <p>This will eventually be embedded activation form.</p>

    <button onclick="window.location.href='activate.html'">
      Open Full Tool
    </button>
  </div>

  <!-- DATABASE -->
  <div id="database" class="panel">
    <h2>Database</h2>
    <p>Your admin dashboard can be pasted directly here later.</p>

    <button onclick="window.location.href='admin.html'">
      Open Full Dashboard
    </button>
  </div>

  <!-- QR -->
  <div id="qr" class="panel">
    <h2>QR Tools</h2>
    <p>Placeholder for QR generator tools.</p>
  </div>

</div>

<script>

function openTab(id, el) {

  // panels
  document.querySelectorAll('.panel')
    .forEach(p => p.classList.remove('active'));

  document.getElementById(id)
    .classList.add('active');

  // nav state
  document.querySelectorAll('.nav')
    .forEach(n => n.classList.remove('active'));

  el.classList.add('active');

}

</script>

</body>
</html>
