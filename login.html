<!DOCTYPE html>
<html>
<head>
  <title>Admin Login Portal</title>
</head>

<body style="font-family: Arial; text-align:center; padding:40px;">

<h2>🔐 Admin Login Portal</h2>

<input id="email" placeholder="Email" style="padding:8px; width:250px;"><br><br>
<input id="password" type="password" placeholder="Password" style="padding:8px; width:250px;"><br><br>

<button id="loginBtn" style="padding:10px 20px;">Login</button>

<p id="status" style="margin-top:20px;"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "517154779272",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

console.log("Login page loaded");

// BUTTON HANDLER
document.getElementById("loginBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const status = document.getElementById("status");

  status.innerText = "Logging in...";

  try {

    const userCredential = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    console.log("Login success:", userCredential.user.email);

    status.innerText = "Login successful! Redirecting...";

    setTimeout(() => {
      window.location.href = "admin.html";
    }, 800);

  } catch (error) {

    console.log("LOGIN ERROR:", error);

    status.innerText = error.code + " - " + error.message;
  }

});

</script>

</body>
</html>
