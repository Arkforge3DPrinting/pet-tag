<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h2 {
      margin-bottom: 4px;
    }

    .tagid {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    #photoInput {
      display: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-bottom: 10px;
      transition: opacity 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .camera {
      background: #ff9f43;
    }

    .gallery {
      background: #3b82f6;
    }

    .activate {
      background: #3b82f6;
      font-size: 18px;
    }

    .tos-box {
      text-align: left;
      font-size: 13px;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      margin: 12px 0;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Activate Pet Tag</h2>

  <div class="tagid">
    Tag ID:
    <span id="tagIdDisplay"></span>
  </div>

  <input id="name" placeholder="Pet Name">

  <input id="phone" placeholder="Primary Contact Number">

  <input id="phone2" placeholder="Secondary Contact (optional)">

  <input type="file" id="photoInput" accept="image/*">

  <button class="btn camera" id="cameraBtn">
    📷 Take Photo
  </button>

  <button class="btn gallery" id="galleryBtn">
    📁 Choose Photo
  </button>

  <div class="tos-box">
    <label>
      <input type="checkbox" id="tosCheckbox">

      I agree to Terms of Service and understand this profile may be publicly visible when scanned.
    </label>
  </div>

  <button class="btn activate" id="activateBtn">
    Activate
  </button>

  <div id="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* WAIT FOR AUTH (IMPORTANT FIX) */
let currentUser = null;

await new Promise((resolve) => {
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    resolve(user);
  });
});

const urlId = new URLSearchParams(window.location.search).get("id");
const status = document.getElementById("status");
const activateBtn = document.getElementById("activateBtn");

if (!urlId) {
  status.innerText = "❌ Invalid link";
  throw new Error("Missing ID");
}

/* ACTIVATE */
activateBtn.onclick = async () => {

  activateBtn.disabled = true;
  activateBtn.innerText = "Activating...";

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const phone2 = document.getElementById("phone2").value.trim();

  if (!name || !phone) {
    status.innerText = "Fill required fields";
    activateBtn.disabled = false;
    activateBtn.innerText = "Activate";
    return;
  }

  const ref = doc(db, "pets", urlId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    status.innerText = "Tag not found";
    return;
  }

  const existing = snap.data();

  await setDoc(ref, {
    name,
    phone,
    phone2: phone2 || existing.phone2 || "",
    photo: existing.photo,
    status: "active",
    activatedAt: new Date().toISOString()
  }, { merge: true });

  status.innerText = "✅ Activated!";
};

</script>

</body>
</html>
