<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 14px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px 0;
    }

    p {
      font-size: 15px;
      color: #666;
      margin: 0 0 10px 0;
    }

    #petPhoto {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      margin: 10px auto;
      display: none;
      border: 4px solid #fff;
      box-shadow:
        0 0 0 3px #3b82f6,
        0 6px 18px rgba(0,0,0,0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .single {
      grid-template-columns: 1fr !important;
      justify-items: center;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: opacity 0.15s ease;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #callBtn,
    #callBtn2 {
      background: #28c76f;
    }

    #textBtn,
    #textBtn2 {
      background: #3b82f6;
    }

    #locBtn,
    #locBtn2 {
      background: #ff9f43;
    }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }

    /* LOCK SCREEN */
    #locked {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }

    /* TAG BOX */
    .tagbox {
      margin-top: 14px;
      padding: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      text-align: left;
    }

    .tagbox-title {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .tagcode {
      font-family: monospace;
      font-size: 15px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      word-break: break-all;
    }

    .tagbtn {
      display: block;
      margin-top: 10px;
      padding: 12px;
      text-align: center;
      background: #3b82f6;
      color: white;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    .tagbtn:hover {
      background: #2563eb;
    }
  </style>
</head>

<body>

<!-- LOCK SCREEN -->
<div id="locked">

  <h2>🐾 Tag Not Activated</h2>

  <p>
    This pet tag must be activated before contact details are available.
  </p>

  <div class="tagbox">

    <div class="tagbox-title">
      🆔 Tag Code
    </div>

    <div class="tagcode" id="tagCode"></div>

    <a id="tagLinkBtn" class="tagbtn" target="_blank">
      🔗 Activate This Tag
    </a>

  </div>

</div>

<!-- MAIN VIEW -->
<div class="container" id="main">

  <h1 id="title">Loading...</h1>

  <p id="message"></p>

  <img id="petPhoto">

  <div id="btnGrid" class="grid">

    <button id="callBtn"></button>
    <button id="callBtn2"></button>

    <button id="textBtn"></button>
    <button id="textBtn2"></button>

    <button id="locBtn"></button>
    <button id="locBtn2"></button>

  </div>

  <div class="footer">
    Powered by Arkforge 3D Printing ®
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const id =
  new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");
const locked = document.getElementById("locked");

const baseUrl =
  "https://arkforge3dprinting.github.io/pet-tag/activate.html?id=" + id;

if (!id) {

  locked.style.display = "block";

  document.getElementById("tagCode").innerText = "INVALID";

  throw new Error("Missing ID");
}

/* TAG DISPLAY */

document.getElementById("tagCode").innerText = id;

const btn = document.getElementById("tagLinkBtn");

btn.href = baseUrl;

/* UI HELPERS */

function showLocked() {
  locked.style.display = "block";
}

function showMain() {
  main.style.display = "block";
}

function setSingleMode() {
  document.getElementById("btnGrid")
    .classList.add("single");
}

function unsetSingleMode() {
  document.getElementById("btnGrid")
    .classList.remove("single");
}

function hideEl(id) {

  const el = document.getElementById(id);

  if (el) {
    el.style.display = "none";
  }
}

function showEl(id) {

  const el = document.getElementById(id);

  if (el) {
    el.style.display = "";
  }
}

/* LOAD PET */

async function loadPet() {

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) {

    showLocked();

    return;
  }

  const pet = snap.data();
if (pet.status === "disabled") {

  document.body.innerHTML = `

    <div style="
      max-width:420px;
      margin:auto;
      margin-top:40px;
      background:white;
      padding:24px;
      border-radius:18px;
      text-align:center;
      font-family:Arial;
      box-shadow:0 6px 20px rgba(0,0,0,0.08);
    ">

      <h2>⚠ Profile Disabled</h2>

      <p>
        This pet profile has been disabled
        for violating Arkforge Terms of Service.
      </p>

      <p>
        Please contact Arkforge 3D Printing
        if you believe this is an error.
      </p>

    </div>

  `;

  return;
}
  /* BLOCK INACTIVE TAGS */

  if (pet.status !== "active") {

    showLocked();

    return;
  }

  showMain();

  document.getElementById("title").innerText =
    "🐾 You found " + pet.name;

  document.getElementById("message").innerText =
    `Help get ${pet.name} home safely.`;

  /* PHOTO */

  if (pet.photo) {

    const img = document.getElementById("petPhoto");

    img.src = pet.photo;

    img.style.display = "block";
  }

  const secondaryExists =
    pet.phone2 &&
    pet.phone2.trim() !== "";

  /* BUTTON LABELS */

  document.getElementById("callBtn").innerText =
    "📞 Call";

  document.getElementById("textBtn").innerText =
    "💬 Text";

  document.getElementById("locBtn").innerText =
    "📍 Send Location";

  /* PRIMARY CALL */

  document.getElementById("callBtn").onclick = () =>
    window.location.href = "tel:" + pet.phone;

  /* PRIMARY TEXT */

  document.getElementById("textBtn").onclick = () =>
    window.open(
      `sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
      "_self"
    );

  /* PRIMARY GPS */

  document.getElementById("locBtn").onclick = () => {

    const btn = document.getElementById("locBtn");

    btn.disabled = true;
    btn.innerText = "📡 Acquiring GPS...";

    navigator.geolocation.getCurrentPosition(

      (pos) => {

        const msg =
          "I found " + pet.name +
          ". Location: https://maps.google.com/?q=" +
          pos.coords.latitude +
          "," +
          pos.coords.longitude;

        btn.disabled = false;
        btn.innerText = "📍 Send Location";

        window.open(
          `sms:${pet.phone}?body=${encodeURIComponent(msg)}`,
          "_self"
        );

      },

      (err) => {

        btn.disabled = false;
        btn.innerText = "📍 Send Location";

        alert("Unable to get GPS location.");

        console.error(err);

      },

      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }

    );

  };

  /* NO SECONDARY */

  if (!secondaryExists) {

    hideEl("callBtn2");
    hideEl("textBtn2");
    hideEl("locBtn2");

    setSingleMode();

    return;
  }

  /* SECONDARY EXISTS */

  showEl("callBtn2");
  showEl("textBtn2");
  showEl("locBtn2");

  unsetSingleMode();

  document.getElementById("callBtn2").innerText =
    "📞 Call Secondary";

  document.getElementById("textBtn2").innerText =
    "💬 Text Secondary";

  document.getElementById("locBtn2").innerText =
    "📍 Send Location Secondary";

  /* SECONDARY CALL */

  document.getElementById("callBtn2").onclick = () =>
    window.location.href = "tel:" + pet.phone2;

  /* SECONDARY TEXT */

  document.getElementById("textBtn2").onclick = () =>
    window.open(
      `sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`,
      "_self"
    );

  /* SECONDARY GPS */

  document.getElementById("locBtn2").onclick = () => {

    const btn = document.getElementById("locBtn2");

    btn.disabled = true;
    btn.innerText = "📡 Acquiring GPS...";

    navigator.geolocation.getCurrentPosition(

      (pos) => {

        const msg =
          "I found " + pet.name +
          ". Location: https://maps.google.com/?q=" +
          pos.coords.latitude +
          "," +
          pos.coords.longitude;

        btn.disabled = false;
        btn.innerText = "📍 Send Location Secondary";

        window.open(
          `sms:${pet.phone2}?body=${encodeURIComponent(msg)}`,
          "_self"
        );

      },

      (err) => {

        btn.disabled = false;
        btn.innerText = "📍 Send Location Secondary";

        alert("Unable to get GPS location.");

        console.error(err);

      },

      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }

    );

  };

}

loadPet();

</script>

</body>
</html>
