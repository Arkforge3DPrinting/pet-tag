<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Update Pet Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>

* {
  box-sizing:border-box;
}


:root {

  --green:#22c55e;
  --green-dark:#16a34a;

  --black:#111827;

  --grey:#6b7280;

  --border:#e5e7eb;

}



/* PAGE */

body {

  margin:0;

  padding:20px;

  min-height:100vh;


  font-family:

    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;


  color:var(--black);


  background:

    linear-gradient(
      180deg,
      #ffffff,
      #f3f4f6
    );

}



/* APP */

.app {

  max-width:460px;

  margin:auto;

  opacity:0;

  transition:opacity .35s ease;

}


/* BRAND */

.brandHeader {


  text-align:center;


  margin-bottom:20px;


}



.brand {


  font-size:34px;


  font-weight:900;


  letter-spacing:-1px;


}


.ark {

  color:#111827;

}


.link {

  color:var(--green);

}


.subtitle {


  margin-top:4px;


  color:#6b7280;


  font-size:14px;


  font-weight:600;


}



/* PET CARD */

.petCard {


  background:white;


  border-radius:30px;


  padding:24px;


  display:flex;


  align-items:center;


  gap:20px;


  border:1px solid #e5e7eb;


  box-shadow:


    0 15px 40px rgba(0,0,0,.08);


}



/* PET IMAGE */

.petImageWrap {


  flex-shrink:0;


}



.petImageWrap {

  width:120px;
  height:120px;

  border-radius:50%;

  padding:5px;

  background:#e5e7eb;

  transition:.35s ease;

}


#preview {

  width:100%;

  height:100%;

  border-radius:50%;

  object-fit:cover;

  background:#f3f4f6;

  border:4px solid white;

}
    .petImageWrap.safe {

  background:#22c55e;

  box-shadow:

    0 0 15px rgba(34,197,94,.7),

    0 0 35px rgba(34,197,94,.4);

}


.petImageWrap.lost {

  background:#ef4444;

  box-shadow:

    0 0 15px rgba(239,68,68,.7),

    0 0 35px rgba(239,68,68,.4);

}


/* PET DETAILS */

.petIdentity h1 {


  margin:0 0 8px;


  font-size:26px;


  letter-spacing:-.5px;


}



.tag {


  font-size:13px;


  color:#6b7280;


  font-weight:700;


}



/* PANELS */

.panel {


  margin-top:16px;


  background:white;


  border-radius:24px;


  padding:20px;


  border:

    1px solid #e5e7eb;


  box-shadow:


    0 10px 30px rgba(0,0,0,.05);


}



/* TITLES */

.sectionTitle {


  display:flex;


  align-items:center;


  gap:10px;


  font-weight:800;


  font-size:15px;


  margin-bottom:16px;


}



/* INPUTS */

label {


  display:block;


  margin-bottom:7px;


  font-size:13px;


  font-weight:700;


  color:#374151;


}



input {


  width:100%;


  height:50px;


  padding:0 15px;


  border-radius:15px;


  border:

    1px solid #d1d5db;


  background:#fafafa;


  font-size:15px;


  margin-bottom:14px;


}



input:focus {


  outline:none;


  border-color:var(--green);


  background:white;


  box-shadow:


    0 0 0 4px rgba(34,197,94,.12);


}



input:disabled {


  color:#6b7280;


}



/* BUTTON BASE */

button {


  border:none;


  cursor:pointer;


  width:100%;


  height:50px;


  border-radius:16px;


  font-weight:800;


  font-size:15px;


  color:white;


  transition:.2s;


}



button:active {


  transform:scale(.97);


}



/* STATUS */


.statusButtons {


  display:flex;


  gap:12px;


}



.statusButtons button {


  flex:1;


}



.safeBtn {


  background:

    linear-gradient(
      135deg,
      #22c55e,
      #16a34a
    );


  opacity:.45;


}



.lostBtn {


  background:

    linear-gradient(
      135deg,
      #ef4444,
      #dc2626
    );


  opacity:.45;


}



.statusActive {


  opacity:1!important;


  transform:translateY(-2px);


}



.statusActive.safeBtn {


  box-shadow:


    0 10px 25px rgba(34,197,94,.35);


}



.statusActive.lostBtn {


  box-shadow:


    0 10px 25px rgba(239,68,68,.35);


}



/* NAME REQUEST */

.requestBtn {


  background:#111827;


}



.saveBtn {


  background:

    linear-gradient(
      135deg,
      #22c55e,
      #15803d
    );


}



.finalSave {


  margin-top:20px;


  height:58px;


  font-size:16px;


  box-shadow:


    0 15px 30px rgba(34,197,94,.3);


}



/* PHOTO BUTTONS */

.photoActions {


  display:flex;


  gap:12px;


}



.secondaryBtn {


  background:#111827;


  flex:1;


}



/* FILE */

#fileInput {


  display:none;


}



#fileInfo {


  text-align:center;


  margin:10px;


  color:#6b7280;


  font-size:12px;


}



#uploadBarWrap {


  height:8px;


  background:#e5e7eb;


  border-radius:99px;


  overflow:hidden;


  display:none;


}



#uploadBar {


  height:100%;


  background:var(--green);


}



/* PENDING */

.pending {


  text-align:center;


  color:#6b7280;


  font-size:13px;


}



.spaceTop {


  margin-top:15px;


}



/* SUCCESS */


.successOverlay {


  position:fixed;


  inset:0;


  display:none;


  align-items:center;


  justify-content:center;


  background:rgba(255,255,255,.92);


  backdrop-filter:blur(12px);


  z-index:999;


}



.successBox {


  text-align:center;


}



.check {


  width:100px;


  height:100px;


  border-radius:50%;


  border:5px solid var(--green);


  display:flex;


  justify-content:center;


  align-items:center;


  margin:auto;


}



.tick {


  color:var(--green);


  font-size:48px;


}



.successBox h3 {


  color:var(--green);


  margin-top:20px;


}



.successBox p {


  color:#6b7280;


}



#redirectCountdown {


  color:var(--green);


  font-size:22px;


  font-weight:900;


}



</style>
</head>

<body>

<div class="app" id="main">

  <header class="brandHeader">
    <div class="brand">
      <span class="ark">ARK</span><span class="link">LINK</span>
    </div>
    <div class="subtitle">
      Update Pet Details
    </div>
  </header>


  <!-- PET IDENTITY CARD -->

  <section class="petCard">

<div class="petImageWrap" id="petImageWrap">
  <img id="preview">
</div>

    <div class="petIdentity">

      <h1 id="petNameLabel">
        Loading...
      </h1>

      <div class="tag">
        <i class="fa-solid fa-wifi"></i>
        ID:
        <span id="tagIdLabel"></span>
      </div>

    </div>

  </section>



  <!-- STATUS -->

  <section class="panel statusPanel">

    <div class="sectionTitle">
      <i class="fa-solid fa-heart-circle-check"></i>
      Pet Status
    </div>


    <div class="statusButtons">

      <button
        id="safeBtn"
        class="safeBtn"
        onclick="setStatus('safe')">

        <i class="fa-solid fa-circle-check"></i>
        Safe

      </button>


      <button
        id="lostBtn"
        class="lostBtn"
        onclick="setStatus('lost')">

        <i class="fa-solid fa-triangle-exclamation"></i>
        Lost

      </button>

    </div>

  </section>



  <!-- CONTACT -->

  <section class="panel">

    <div class="sectionTitle">
      <i class="fa-solid fa-phone"></i>
      Contact Details
    </div>


    <label>
      Primary Phone
    </label>

    <input id="phone">


    <label>
      Secondary Phone
    </label>

    <input id="phone2">

  </section>




  <!-- IDENTIFICATION -->

  <section class="panel">

    <div class="sectionTitle">
      <i class="fa-solid fa-id-card"></i>
      Identification
    </div>


    <label>
      Current Pet Name
    </label>


    <input
      id="currentPetName"
      disabled>



    <button
      class="requestBtn"
      onclick="showNameRequest()">

      <i class="fa-solid fa-pen"></i>
      Request Name Edit

    </button>



    <div
      id="nameRequestBox"
      style="display:none;margin-top:12px;">


      <input
        id="requestedPetName"
        placeholder="Enter requested new name">


      <button
        class="saveBtn"
        onclick="submitNameRequest()">

        Submit Request

      </button>


    </div>


    <div
      id="pendingNameText"
      class="pending">
    </div>




    <label class="spaceTop">

      <i class="fa-solid fa-microchip"></i>

      Microchip

    </label>


    <input id="microchipInput">


  </section>




  <!-- PHOTO -->

  <section class="panel">


    <div class="sectionTitle">

      <i class="fa-solid fa-camera"></i>

      Update Photo

    </div>



    <div class="photoActions">


      <button
        type="button"
        class="secondaryBtn"
        onclick="openCamera()">

        <i class="fa-solid fa-camera"></i>

        Camera

      </button>



      <button
        type="button"
        class="secondaryBtn"
        onclick="openGallery()">

        <i class="fa-solid fa-upload"></i>

        Upload

      </button>


    </div>



    <input
      type="file"
      id="fileInput"
      accept="image/*">



    <div id="fileInfo"></div>



    <div id="uploadBarWrap">

      <div id="uploadBar"></div>

    </div>


  </section>




  <!-- SAVE -->

  <button
    class="saveBtn finalSave"
    onclick="save()">

    <i class="fa-solid fa-check"></i>

    Save Pet Profile

  </button>



</div>





<!-- SUCCESS -->

<div class="successOverlay" id="successOverlay">


  <div class="successBox">


    <div class="check">

      <i class="fa-solid fa-check tick"></i>

    </div>



    <h3>
      Changes Saved Successfully
    </h3>


    <p>

      Redirecting in

      <span id="redirectCountdown">
        5
      </span>

      seconds...

    </p>


  </div>


</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(location.search).get("id");
const main = document.getElementById("main");

let ref;
let petData = null;
let selectedFile = null;

/* ALWAYS SHOW CONTAINER EVEN IF JS FAILS */
window.addEventListener("DOMContentLoaded", () => {
  main.style.opacity = "1";
});

/* INIT */
function init() {
  try {
    if (!id) {
      document.getElementById("petNameLabel").innerText = "Missing ID";
      main.style.opacity = "1";
      return;
    }

    ref = doc(db, "pets", id);
    document.getElementById("tagIdLabel").innerText = id;

    load();
  } catch (e) {
    console.error(e);
    main.style.opacity = "1";
  }
}

/* LOAD */
async function load() {
  try {
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      document.getElementById("petNameLabel").innerText = "Not found";
      main.style.opacity = "1";
      return;
    }

    petData = snap.data();
    
document.getElementById("lostBtn")
  .classList.remove("statusActive");

document.getElementById("safeBtn")
  .classList.remove("statusActive");

if (petData.petStatus === "lost") {
  document.getElementById("lostBtn")
    .classList.add("statusActive");
} else {
  document.getElementById("safeBtn")
    .classList.add("statusActive");
}
    const imageWrap =
document.getElementById("petImageWrap");

imageWrap.classList.remove("safe","lost");

imageWrap.classList.add(
  petData.petStatus === "lost"
  ? "lost"
  : "safe"
);
    const status = String(petData.status || "").toLowerCase().trim();

    if (status === "inactive") {
      document.body.innerHTML = `
        <div style="text-align:center;padding:40px;font-family:Arial;">
          <h2>INVALID TAG. NOT ACTIVATED.</h2>
          <a href="https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}">
            <button style="padding:14px 20px;background:#3b82f6;color:white;border:none;border-radius:10px;margin-top:10px;">
              Activate Tag
            </button>
          </a>
        </div>`;
      return;
    }

document.getElementById("petNameLabel").innerText =
petData.name || "";

document.getElementById("currentPetName").value =
petData.name || "";


if (petData.pendingNameChangeStatus === "pending") {

document.getElementById("pendingNameText").innerText =
"Pending request: " + petData.pendingNameChange;

}
    document.getElementById("phone").value = petData.phone || "";
    document.getElementById("phone2").value = petData.phone2 || "";
    console.log("petNameInput check:", document.getElementById("petNameInput"));
    document.getElementById("currentPetName").value = petData.name || "";
    document.getElementById("microchipInput").value = petData.microchip || "";
    document.getElementById("preview").src = petData.photo || "";

    main.style.opacity = "1";
  } catch (e) {
    console.error(e);
    main.style.opacity = "1";
  }
}

/* STATUS */
window.setStatus = async (status) => {

  await updateDoc(ref, {
    petStatus: status,
    updatedAt: new Date()
  });

  document.getElementById("lostBtn")
    .classList.toggle("statusActive", status === "lost");

  document.getElementById("safeBtn")
    .classList.toggle("statusActive", status === "safe");
  const imageWrap =
document.getElementById("petImageWrap");

imageWrap.classList.remove("safe","lost");

imageWrap.classList.add(status);
};

/* FILE SELECT */
document.getElementById("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  selectedFile = file;

  document.getElementById("fileInfo").innerText =
    file.name + " • " + (file.size / 1024 / 1024).toFixed(2) + " MB";

  document.getElementById("preview").src = URL.createObjectURL(file);

  if (file.size > 5 * 1024 * 1024) {
    selectedFile = await compressImage(file, 0.75);
  }
});

/* UPLOAD */
function upload(file) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", "arkforge-pets");

    const xhr = new XMLHttpRequest();

    const wrap = document.getElementById("uploadBarWrap");
    const bar = document.getElementById("uploadBar");

    wrap.style.display = "block";
    bar.style.width = "0%";

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        bar.style.width = (e.loaded / e.total) * 100 + "%";
      }
    };

    xhr.onload = () => {
      const data = JSON.parse(xhr.responseText);
      if (!data.secure_url) return reject("fail");
      resolve(data.secure_url);
    };

    xhr.onerror = () => reject("error");

    xhr.open("POST", "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload");
    xhr.send(form);
  });
}
window.showNameRequest = () => {

document.getElementById("nameRequestBox")
.style.display = "block";

};
window.submitNameRequest = async () => {

const requested =
document.getElementById("requestedPetName")
.value.trim();


if (!requested) {
alert("Please enter a requested name");
return;
}


await updateDoc(ref, {

pendingNameChange: requested,

pendingNameChangeStatus: "pending",

pendingNameChangeDate: new Date()

});


alert("Name change request submitted");

location.reload();

};

/* SAVE */
window.save = async () => {
  try {
    let photo = petData.photo || "";

    if (selectedFile) {
      photo = await upload(selectedFile);
    }

    await updateDoc(ref, {
     
      microchip: document.getElementById("microchipInput").value,
      phone: document.getElementById("phone").value,
      phone2: document.getElementById("phone2").value,
      photo,
      updatedAt: new Date()
    });

document.getElementById("successOverlay").style.display = "flex";

let seconds = 5;

const countdown = document.getElementById("redirectCountdown");
countdown.innerText = seconds;

const timer = setInterval(() => {
  seconds--;
  countdown.innerText = seconds;

  if (seconds <= 0) {
    clearInterval(timer);
    window.location.href = `index.html?id=${id}`;
  }
}, 1000);

  } catch (e) {
    console.error(e);
    alert("Save failed");
  }
};

/* CAMERA / GALLERY */
window.openCamera = () => {
  const i = document.getElementById("fileInput");
  i.setAttribute("capture", "environment");
  i.click();
};

window.openGallery = () => {
  const i = document.getElementById("fileInput");
  i.removeAttribute("capture");
  i.click();
};

/* COMPRESSION */
function compressImage(file, quality) {
  return new Promise((resolve) => {
    const r = new FileReader();

    r.onload = (e) => {
      const img = new Image();

      img.onload = () => {
        const c = document.createElement("canvas");
        const ctx = c.getContext("2d");

        const scale = Math.min(1, 1600 / img.width);

        c.width = img.width * scale;
        c.height = img.height * scale;

        ctx.drawImage(img, 0, 0, c.width, c.height);

        c.toBlob((b) => {
          resolve(new File([b], file.name, {
            type: "image/jpeg",
            lastModified: Date.now()
          }));
        }, "image/jpeg", quality);
      };

      img.src = e.target.result;
    };

    r.readAsDataURL(file);
  });
}

init();
</script>

</body>
</html>
