<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard v6</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    h2 { margin-bottom: 12px; }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filters button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #ddd;
      cursor: pointer;
      font-weight: bold;
    }

    .filters button.active {
      background: #3b82f6;
      color: white;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .badges { margin-bottom: 10px; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      margin-right: 5px;
      margin-bottom: 5px;
    }

    .green { background: #dcfce7; color: #166534; }
    .red { background: #fee2e2; color: #991b1b; }
    .orange { background: #ffedd5; color: #9a3412; }
    .blue { background: #dbeafe; color: #1d4ed8; }
    .purple { background: #ede9fe; color: #5b21b6; }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .row input {
      flex: 1;
      min-width: 220px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .buttons button {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .saveBtn { background: #3b82f6; color: white; }
    .deleteBtn { background: #ef4444; color: white; }
    .restoreBtn { background: #22c55e; color: white; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 12px;
      gap: 10px;
    }

    .leftSide img {
      max-width: 110px;
      border-radius: 10px;
      border: 2px solid #eee;
    }

    .qrSide {
      margin-left: auto;
      display: flex;
      justify-content: flex-end;
    }

  </style>
</head>

<body>

<h2>🐾 Arkforge Admin Dashboard</h2>

<input id="search" placeholder="Search Tag ID or Pet Name...">

<div class="filters">
  <button class="active" onclick="setFilter('all', this)">All</button>
  <button onclick="setFilter('inactive', this)">Unactivated</button>
  <button onclick="setFilter('active', this)">Activated</button>
  <button onclick="setFilter('disabled', this)">Disabled</button>
  <button onclick="setFilter('deleted', this)">Deleted</button>
</div>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const listDiv = document.getElementById("list");

let allPets = [];
let currentSearch = "";
let currentFilter = "all";

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  listen();
});

function listen() {
  onSnapshot(collection(db, "pets"), (snap) => {
    allPets = [];
    snap.forEach(d => allPets.push({ id: d.id, ...d.data() }));
    render();
  });
}

document.getElementById("search").addEventListener("input", (e) => {
  currentSearch = e.target.value.toLowerCase();
  render();
});

window.setFilter = (filter, btn) => {
  currentFilter = filter;

  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  render();
};

function qr(id, el) {
  new QRCode(el, {
    text: `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`,
    width: 90,
    height: 90
  });
}

function render() {

  listDiv.innerHTML = "";

  const filtered = allPets.filter(p => {

    const match =
      p.id.toLowerCase().includes(currentSearch) ||
      (p.name || "").toLowerCase().includes(currentSearch);

    if (!match) return false;

    switch (currentFilter) {

      case "inactive":
        return !p.activatedAt && !p.status;

      case "active":
        return !!p.activatedAt && p.status !== "disabled";

      case "disabled":
        return p.status === "disabled";

      case "deleted":
        return p.status === "deleted";

      default:
        return true;
    }
  });

  filtered.forEach(p => {

    const badges = [];

    if (p.status === "disabled") {
      badges.push(`<span class="badge purple">Disabled</span>`);
    } else if (p.status === "deleted") {
      badges.push(`<span class="badge red">Deleted</span>`);
    } else if (p.activatedAt) {
      badges.push(`<span class="badge green">Activated</span>`);
    } else {
      badges.push(`<span class="badge red">Unactivated</span>`);
    }

    if (!p.photo || p.photo.includes("placeholderpaw")) {
      badges.push(`<span class="badge orange">No Photo</span>`);
    }

    if (!p.phone2) {
      badges.push(`<span class="badge blue">No Secondary</span>`);
    }

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="meta"><b>Tag ID:</b> ${p.id}</div>

      <div class="badges">${badges.join("")}</div>

      <div class="row">
        <input id="name-${p.id}" value="${p.name || ""}" placeholder="Pet Name">
        <input id="phone-${p.id}" value="${p.phone || ""}" placeholder="Primary">
        <input id="phone2-${p.id}" value="${p.phone2 || ""}" placeholder="Secondary">
      </div>

      <div class="footer">
        <div class="leftSide">
          ${p.photo ? `<img src="${p.photo}">` : ""}
        </div>
        <div class="qrSide"><div id="qr-${p.id}"></div></div>
      </div>

      <div class="buttons">

        <button class="saveBtn" onclick="save('${p.id}')">💾 Save</button>

        ${
          p.status === "deleted"
          ? `<button class="restoreBtn" onclick="restore('${p.id}')">♻ Restore</button>`
          : `<button class="deleteBtn" onclick="softDelete('${p.id}')">🗑 Delete</button>`
        }

      </div>
    `;

    listDiv.appendChild(div);

    setTimeout(() => {
      const el = document.getElementById("qr-" + p.id);
      if (el) {
        el.innerHTML = "";
        qr(p.id, el);
      }
    });
  });
}

window.save = async (id) => {
  await updateDoc(doc(db, "pets", id), {
    name: document.getElementById("name-" + id).value,
    phone: document.getElementById("phone-" + id).value,
    phone2: document.getElementById("phone2-" + id).value
  });
};

/* SOFT DELETE */
window.softDelete = async (id) => {

  const confirmDelete = confirm("Move this tag to Deleted?");
  if (!confirmDelete) return;

  const pet = allPets.find(p => p.id === id);

  await setDoc(doc(db, "deleted", id), {
    ...pet,
    status: "deleted",
    deletedAt: new Date().toISOString()
  });

  await updateDoc(doc(db, "pets", id), {
    status: "deleted"
  });
};

/* RESTORE */
window.restore = async (id) => {

  const petSnap = await getDoc(doc(db, "deleted", id));

  if (!petSnap.exists()) return;

  const pet = petSnap.data();

  await setDoc(doc(db, "pets", id), {
    ...pet,
    status: "",
    deletedAt: null
  });

  await deleteDoc(doc(db, "deleted", id));
};

</script>

</body>
</html>
