<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* --- SAME UI (unchanged for stability) --- */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  padding: 18px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #ffffff 0%, #eef4ff 35%, #dfe9f7 100%);
  color: #111827;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 20%, rgba(52,199,89,.12), transparent 30%),
    radial-gradient(circle at 80% 10%, rgba(59,130,246,.12), transparent 30%),
    radial-gradient(circle at 50% 100%, rgba(255,159,10,.10), transparent 40%);
}

.container,
#locked {
  max-width: 460px;
  margin: auto;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.8);
  border-radius: 34px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.04);
  overflow: hidden;
}

.container { display: none; }
#locked { display: none; padding: 26px; text-align: center; }

.hero {
  padding: 30px 22px 10px;
  text-align: center;
  position: relative;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(52,199,89,0.14);
  color: #1c7a39;
  padding: 10px 16px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 18px;
  animation: pulse 2.4s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

#petPhoto {
  width: 250px;
  height: 250px;
  object-fit: cover;
  border-radius: 34px;
  margin: 10px auto 18px;
  display: none;
  border: 6px solid white;
  box-shadow: 0 18px 40px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,255,255,0.9);
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding: 0 18px 18px;
}

.single { grid-template-columns: 1fr !important; }

button {
  border: none;
  border-radius: 22px;
  padding: 16px 12px;
  min-height: 78px;
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: 0.18s ease;
}

button:hover { transform: translateY(-3px); }
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.7; transform: none; }

#callBtn,#callBtn2 { background: linear-gradient(180deg,#34c759,#28a745); }
#textBtn,#textBtn2 { background: linear-gradient(180deg,#0a84ff,#0066d6); }
#locBtn,#locBtn2 { background: linear-gradient(180deg,#ff9f0a,#e68500); }

.footer {
  text-align: center;
  padding: 10px 0 18px;
  font-size: 12px;
  color: #9ca3af;
}

.notice {
  margin: 0 18px 18px;
  padding: 14px;
  border-radius: 18px;
  background: rgba(59,130,246,0.08);
  border: 1px solid rgba(59,130,246,0.15);
  text-align: center;
  font-weight: 600;
}
</style>

</head>

<body>

<div id="locked">
  <h2>🐾 Tag Not Activated</h2>
  <p>This pet tag must be activated before contact details are available.</p>
</div>

<div class="container" id="main">

  <div class="hero">
    <div class="status-pill">🐾 Help Me Get Home</div>
    <img id="petPhoto">
    <h1 id="title">Loading...</h1>
    <p id="message"></p>
  </div>

  <div class="notice">
    If you found this pet, please contact the owner immediately.
  </div>

  <div id="btnGrid" class="grid">

    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Backup</button>

    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Backup</button>

    <button id="locBtn">📍 Send Location</button>
    <button id="locBtn2">📍 Backup Location</button>

  </div>

  <div class="footer">
    Powered by Arkforge 3D Printing ®
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");
const locked = document.getElementById("locked");

/* ---------------- SOUND ---------------- */
function playPing() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();

    const o = ctx.createOscillator();
    const g = ctx.createGain();

    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);

    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);

    o.connect(g);
    g.connect(ctx.destination);

    o.start();
    o.stop(ctx.currentTime + 0.3);
  } catch {}
}

/* ---------------- GPS HELPERS ---------------- */

function setLoading(btn, text) {
  btn.disabled = true;
  btn.dataset.original = btn.innerText;
  btn.innerText = text;
}

function resetBtn(btn, text) {
  btn.disabled = false;
  btn.innerText = text;
}

/* ---------------- SAFE GPS WRAPPER ---------------- */

function handleGPS(phone, btn, label) {

  // prevent stale handlers / double firing issues
  if (!navigator.geolocation) {
    alert("GPS not supported");
    return;
  }

  setLoading(btn, "📡 Getting location...");

  navigator.geolocation.getCurrentPosition(pos => {

    playPing();

    const msg =
      "I found " + window.petName +
      ". Location: https://maps.google.com/?q=" +
      pos.coords.latitude + "," + pos.coords.longitude;

    resetBtn(btn, label);

    // slight delay fixes iOS SMS race bug
    setTimeout(() => {
      window.open(`sms:${phone}?body=${encodeURIComponent(msg)}`, "_self");
    }, 150);

  }, () => {

    resetBtn(btn, label);
    alert("Unable to get GPS location.");
  }, {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
  });
}

/* ---------------- MAIN ---------------- */

if (!id) {
  locked.style.display = "block";
  throw new Error("Missing ID");
}

async function loadPet() {

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) {
    locked.style.display = "block";
    return;
  }

  const pet = snap.data();
  window.petName = pet.name || "this pet";

  if (pet.status !== "active") {
    locked.style.display = "block";
    return;
  }

  main.style.display = "block";

  document.getElementById("title").innerText = "🐾 You found " + window.petName;
  document.getElementById("message").innerText = "Help get " + window.petName + " home safely.";

  const img = document.getElementById("petPhoto");
  if (pet.photo) {
    img.src = pet.photo;
    img.style.display = "block";
  }

  const hasSecondary = pet.phone2 && pet.phone2.trim() !== "";

  /* PRIMARY */
  document.getElementById("callBtn").onclick = () => location.href = "tel:" + pet.phone;
  document.getElementById("textBtn").onclick = () =>
    window.open(`sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + window.petName)}`, "_self");

  document.getElementById("locBtn").onclick = (e) =>
    handleGPS(pet.phone, e.currentTarget, "📍 Send Location");

  /* SECONDARY */
  if (hasSecondary) {

    document.getElementById("callBtn2").onclick = () => location.href = "tel:" + pet.phone2;

    document.getElementById("textBtn2").onclick = () =>
      window.open(`sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + window.petName)}`, "_self");

    document.getElementById("locBtn2").onclick = (e) =>
      handleGPS(pet.phone2, e.currentTarget, "📍 Backup Location");

  } else {
    document.getElementById("callBtn2").style.display = "none";
    document.getElementById("textBtn2").style.display = "none";
    document.getElementById("locBtn2").style.display = "none";
  }
}

loadPet();
</script>

</body>
</html>
