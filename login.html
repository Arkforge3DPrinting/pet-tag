<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>

<body style="font-family: Arial; text-align:center; padding:40px;">

<h2>Admin Login</h2>

<input id="email" placeholder="Email" style="padding:10px; width:250px;"><br><br>
<input id="password" type="password" placeholder="Password" style="padding:10px; width:250px;"><br><br>

<button id="loginBtn" style="padding:10px 20px;">Login</button>

<p id="status"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Firebase config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    document.getElementById("status").innerText = "Logging in...";

    await signInWithEmailAndPassword(auth, email, password);

    document.getElementById("status").innerText = "Success! Redirecting...";

    window.location.href = "updatedb.html";

  } catch (err) {
    console.log(err);
    document.getElementById("status").innerText = "Login failed";
  }
};
</script>

</body>
</html>
