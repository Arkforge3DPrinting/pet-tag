<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArkLink Pet — Smart NFC Tags That Bring Pets Home</title>
<meta name="description" content="ArkLink Pet NFC tags use smart geo-location alerts to dramatically increase the chance your lost pet is returned home, fast." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#FFF6EC;
    --cream-2:#FFEAD2;
    --coral:#FF7A59;
    --coral-dark:#E85A3A;
    --yellow:#FFC857;
    --navy:#1F3A5F;
    --navy-soft:#3A5378;
    --sage:#7BB48F;
    --ink:#222;
    --shadow:0 10px 30px rgba(31,58,95,.12);
    --shadow-lg:0 20px 50px rgba(31,58,95,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:var(--cream);
    color:var(--navy);
    line-height:1.6;
    overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--navy);line-height:1.15}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,200,87,.18) 0 14px, transparent 15px),
      radial-gradient(circle at 85% 70%, rgba(123,180,143,.15) 0 18px, transparent 19px),
      radial-gradient(circle at 60% 15%, rgba(255,122,89,.12) 0 12px, transparent 13px),
      radial-gradient(circle at 25% 85%, rgba(255,122,89,.10) 0 16px, transparent 17px);
    background-size:600px 600px;
  }

  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(255,246,236,.85);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(31,58,95,.08);
  }
  .nav-inner{
    max-width:1200px;margin:0 auto;padding:18px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .logo{
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;
    display:flex;align-items:center;gap:10px;color:var(--navy);
  }
  .logo-dot{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,var(--coral),var(--yellow));
    display:grid;place-items:center;color:#fff;font-size:18px;
  }
  .nav-links{display:flex;gap:8px;align-items:center}
  .nav-links a{padding:10px 16px;border-radius:999px;font-weight:600}
  .nav-links a:hover{background:var(--cream-2)}
  .nav-links a.active{background:var(--navy);color:var(--cream)}
  .nav-cta{
    background:var(--coral);color:#fff !important;
    padding:11px 20px !important;border-radius:999px;
  }

  .hero{
    position:relative;z-index:1;
    max-width:1200px;margin:0 auto;padding:80px 24px 60px;
    display:grid;grid-template-columns:1.05fr .95fr;gap:60px;
  }

  .hero h1{font-size:clamp(40px,6vw,68px);margin:18px 0 20px}
  .hero p.lead{font-size:19px;color:var(--navy-soft);max-width:540px}

  .cta-row{display:flex;gap:14px;flex-wrap:wrap}
  .btn{padding:16px 28px;border-radius:999px;font-weight:700}
  .btn-primary{background:var(--coral);color:#fff}
  .btn-ghost{border:2px solid var(--navy)}

  .section{max-width:1200px;margin:0 auto;padding:80px 24px}

  footer{
    background:var(--navy);color:var(--cream);
    padding:50px 24px 30px;margin-top:60px;
  }

  /* =========================
     MOBILE FIX (ADDED ONLY)
     ========================= */
  @media (max-width:900px){

    .hero{
      grid-template-columns:1fr;
      gap:30px;
      padding:60px 20px 40px;
    }

    .hero p.lead{
      margin-left:auto;
      margin-right:auto;
    }

    .cta-row{
      justify-content:center;
    }

    .nav-inner{
      flex-wrap:wrap;
    }

    .nav-links{
      flex-wrap:wrap;
      justify-content:center;
      width:100%;
    }
  }

</style>
</head>

<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="./index.html" class="logo">🐾 ArkLink Pet</a>

    <div class="nav-links">
      <a href="./index.html" class="active">Home</a>
      <a href="./store.html">Store</a>
      <a href="./about.html">About</a>
      <a href="./store.html" class="nav-cta">Buy Tag</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div>
    <h1>Bring them home faster — every wag, every time.</h1>
    <p class="lead">
      ArkLink Pet is a tiny NFC tag that helps reunite lost pets with their owners fast.
    </p>

    <div class="cta-row">
      <a href="./store.html" class="btn btn-primary">Get Your Tag →</a>
      <a href="#how" class="btn btn-ghost">How it works</a>
    </div>
  </div>
</header>

<section class="section" id="how">
  <h2>How it works</h2>
</section>

<footer>
  <div>
    <a href="./index.html">Home</a><br>
    <a href="./store.html">Store</a><br>
    <a href="./about.html">About</a>
  </div>
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
</script>

</body>
</html>
