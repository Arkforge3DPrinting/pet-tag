<!DOCTYPE html>
<html>
<head>
  <title>Activate Pet Tag</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 14px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    h2 {
      margin: 6px 0 14px;
      font-weight: 600;
    }

    .tagid {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
      word-break: break-all;
    }

    /* STEP SYSTEM */
    .step {
      display: none;
      animation: slide 280ms ease;
    }

    .step.active {
      display: block;
    }

    @keyframes slide {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    #photoInput { display: none; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      margin-top: 8px;
    }

    .primary { background: #3b82f6; }
    .secondary { background: #ff9f43; }

    .tos {
      font-size: 13px;
      text-align: left;
      margin: 12px 0;
      background: #fafafa;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #eee;
    }

    /* subtle progress */
    .progress {
      height: 6px;
      background: #eee;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
      display: none;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#22c55e,#16a34a);
      transition: width 250ms ease;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #444;
      min-height: 18px;
    }

    .success {
      font-size: 18px;
      font-weight: 600;
      color: #0a7a2f;
      margin-top: 10px;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">

  <h2>Activate Pet Tag</h2>

  <div class="tagid">
    Tag ID: <span id="tagIdDisplay"></span>
  </div>

  <!-- STEP 1 -->
  <div class="step active" id="step1">
    <input id="name" placeholder="Pet Name">
    <input id="phone" placeholder="Primary Contact Number">
    <input id="phone2" placeholder="Secondary Contact (optional)">

    <div class="tos">
      <label>
        <input type="checkbox" id="tosCheckbox">
        I agree to Terms of Service
      </label>
    </div>

    <button class="btn primary" id="next1">Continue</button>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="step2">
    <input type="file" id="photoInput" accept="image/*">

    <button class="btn secondary" id="cameraBtn">📷 Take Photo</button>
    <button class="btn primary" id="galleryBtn">📁 Choose Photo</button>

    <button class="btn primary" id="next2">Continue</button>
  </div>

  <!-- STEP 3 -->
  <div class="step" id="step3">
    <div class="status" id="status">Ready to activate</div>

    <div class="progress" id="progress">
      <div class="bar" id="bar"></div>
    </div>

    <button class="btn primary" id="activateBtn">Activate Tag</button>
  </div>

  <!-- SUCCESS -->
  <div class="step" id="step4">
    <div class="success">✓ Your tag is now active</div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6b...",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
});

const db = getFirestore(app);

const urlId = new URLSearchParams(location.search).get("id");

document.getElementById("tagIdDisplay").innerText = urlId || "Invalid";

/* STEP NAV */
function showStep(n){
  for(let i=1;i<=4;i++){
    document.getElementById("step"+i).classList.remove("active");
  }
  document.getElementById("step"+n).classList.add("active");
}

/* CAMERA */
const photoInput = document.getElementById("photoInput");

document.getElementById("cameraBtn").onclick=()=>{
  photoInput.setAttribute("capture","environment");
  photoInput.click();
};

document.getElementById("galleryBtn").onclick=()=>{
  photoInput.removeAttribute("capture");
  photoInput.click();
};

/* CONTROLS */
document.getElementById("next1").onclick=()=>{
  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const tos=document.getElementById("tosCheckbox").checked;

  if(!name||!phone) return alert("Fill required fields");
  if(!tos) return alert("Accept Terms");

  showStep(2);
};

document.getElementById("next2").onclick=()=>{
  showStep(3);
};

/* COMPRESSION */
async function compress(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas");
        const scale=Math.min(1,Math.sqrt((2*1024*1024)/file.size));
        c.width=img.width*scale;
        c.height=img.height*scale;
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>res(new File([b],"img.jpg",{type:"image/jpeg"})),"image/jpeg",0.85);
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

/* CONFETTI */
function boom(){
  const c=document.getElementById("confetti");
  const ctx=c.getContext("2d");
  c.width=innerWidth;
  c.height=innerHeight;

  let p=[];
  for(let i=0;i<80;i++){
    p.push({x:Math.random()*c.width,y:Math.random()*-c.height,v:2+Math.random()*3,r:3});
  }

  (function anim(){
    ctx.clearRect(0,0,c.width,c.height);
    p.forEach(o=>{
      ctx.beginPath();
      ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
      ctx.fillStyle=`hsl(${Math.random()*360},80%,60%)`;
      ctx.fill();
      o.y+=o.v;
    });
    if(p.some(o=>o.y<c.height)) requestAnimationFrame(anim);
  })();
}

/* ACTIVATE */
document.getElementById("activateBtn").onclick = async ()=>{

  const status=document.getElementById("status");
  const bar=document.getElementById("bar");
  const progress=document.getElementById("progress");

  progress.style.display="block";

  try{

    const ref=doc(db,"pets",urlId);
    const snap=await getDoc(ref);
    if(!snap.exists()) throw new Error("Tag not found");

    let file=photoInput.files[0];
    let photoURL="";

    status.innerText="Preparing photo...";
    bar.style.width="20%";

    if(file){
      file=await (async f=>{
        const r=new FileReader();
        return new Promise(res=>{
          r.onload=e=>{
            const img=new Image();
            img.onload=()=>{
              const c=document.createElement("canvas");
              const s=Math.min(1,Math.sqrt((2*1024*1024)/f.size));
              c.width=img.width*s;
              c.height=img.height*s;
              c.getContext("2d").drawImage(img,0,0,c.width,c.height);
              c.toBlob(b=>res(new File([b],"img.jpg",{type:"image/jpeg"})),"image/jpeg",0.85);
            };
            img.src=e.target.result;
          };
          r.readAsDataURL(f);
        });
      })(file);

      status.innerText="Uploading photo...";
      bar.style.width="50%";

      const form=new FormData();
      form.append("file",file);
      form.append("upload_preset","arkforge-pets");

      const res=await fetch("https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload",{method:"POST",body:form});
      const data=await res.json();
      photoURL=data.secure_url;
    }

    status.innerText="Saving...";
    bar.style.width="80%";

    const ex=snap.data();

    const name=document.getElementById("name").value.trim();
    const phone=document.getElementById("phone").value.trim();
    const phone2=document.getElementById("phone2").value.trim();

    await setDoc(ref,{
      name,
      phone,
      phone2,
      microchip:document.getElementById("microchip").value.trim()||ex.microchip||"",
      photo:photoURL||ex.photo||"",
      status:"active",
      activatedAt:new Date().toISOString()
    },{merge:true});

    bar.style.width="100%";

    showStep(4);
    boom();

    setTimeout(()=>{
      location.href=`https://arkforge3dprinting.github.io/pet-tag/index.html?id=${urlId}`;
    },2500);

  }catch(e){
    alert(e.message);
  }
};

</script>

</body>
</html>
