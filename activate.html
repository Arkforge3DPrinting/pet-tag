<!DOCTYPE html>
<html>
<body style="font-family: Arial; text-align:center; padding:20px;">

<h2>Activate Your Pet Tag</h2>

<input id="name" placeholder="Pet Name"><br><br>
<input id="phone" placeholder="Your Phone Number"><br><br>

<button id="activateBtn">Activate</button>

<p id="status"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "517154779272",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

document.getElementById("activateBtn").onclick = async () => {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  if (!name || !phone) {
    document.getElementById("status").innerText = "Fill all fields";
    return;
  }

  try {
    await setDoc(doc(db, "pets", id), {
      name,
      phone
    });

    document.getElementById("status").innerText = "Activated successfully!";
  } catch (e) {
    console.log(e);
    document.getElementById("status").innerText = "Already activated or error.";
  }
};
</script>

</body>
</html>
