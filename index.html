<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 14px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }

    h1 { font-size: 24px; margin: 0 0 6px 0; }

    p { font-size: 15px; color: #666; margin: 0 0 10px 0; }

    #petPhoto {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      margin: 10px auto;
      display: none;
      border: 4px solid #fff;
      box-shadow: 0 0 0 3px #3b82f6, 0 6px 18px rgba(0,0,0,0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .single {
      grid-template-columns: 1fr !important;
      justify-items: center;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    #callBtn, #callBtn2 { background: #28c76f; }
    #textBtn, #textBtn2 { background: #3b82f6; }
    #locBtn, #locBtn2   { background: #ff9f43; }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }

    /* LOCK SCREEN */
    #locked {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }

    .tagbox {
      margin-top: 14px;
      padding: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      text-align: left;
    }

    .tagbox-title {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .tagcode {
      font-family: monospace;
      font-size: 15px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      word-break: break-all;
    }

    .taghint {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>

<!-- 🔒 LOCK SCREEN -->
<div id="locked">

  <h2>🐾 Tag Not Activated</h2>

  <p>
    This pet tag must be activated before contact details are available.
  </p>

  <div class="tagbox">

    <div class="tagbox-title">🆔 Tag Code</div>

    <div class="tagcode" id="tagCode"></div>

    <div class="taghint">
      If you don’t have the packaging, quote this code when contacting support.
    </div>

  </div>

</div>

<!-- 🔓 MAIN VIEW -->
<div class="container" id="main">

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <img id="petPhoto">

  <div id="btnGrid" class="grid">

    <button id="callBtn"></button>
    <button id="callBtn2"></button>

    <button id="textBtn"></button>
    <button id="textBtn2"></button>

    <button id="locBtn"></button>
    <button id="locBtn2"></button>

  </div>

  <div class="footer">
    Powered by Arkforge 3D Printing ®
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");
const locked = document.getElementById("locked");

if (!id) {
  locked.style.display = "block";
  document.getElementById("tagCode").innerText = "INVALID";
  throw new Error("Missing ID");
}

function showLocked() {
  locked.style.display = "block";
}

function showMain() {
  main.style.display = "block";
}

function setSingleMode() {
  document.getElementById("btnGrid").classList.add("single");
}

function removeEl(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

async function loadPet() {

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) {
    document.getElementById("tagCode").innerText = id;
    showLocked();
    return;
  }

  const pet = snap.data();

  // 🔒 BLOCK UNACTIVATED
  if (pet.status !== "active") {
    document.getElementById("tagCode").innerText = id;
    showLocked();
    return;
  }

  showMain();

  document.getElementById("title").innerText =
    "🐾 You found " + pet.name;

  document.getElementById("message").innerText =
    `Help get ${pet.name} home safely.`;

  if (pet.photo) {
    const img = document.getElementById("petPhoto");
    img.src = pet.photo;
    img.style.display = "block";
  }

  const secondaryExists = pet.phone2 && pet.phone2.trim() !== "";

  document.getElementById("callBtn").innerText = "📞 Call";
  document.getElementById("textBtn").innerText = "💬 Text";
  document.getElementById("locBtn").innerText  = "📍 Send Location";

  document.getElementById("callBtn2").innerText = "📞 Call Secondary";
  document.getElementById("textBtn2").innerText = "💬 Text Secondary";
  document.getElementById("locBtn2").innerText  = "📍 Send Location Secondary";

  document.getElementById("callBtn").onclick = () =>
    window.location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick = () =>
    window.open(`sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`, "_self");

  document.getElementById("locBtn").onclick = () => {

    navigator.geolocation.getCurrentPosition((pos) => {

      const msg =
        "I found " + pet.name +
        ". Location: https://maps.google.com/?q=" +
        pos.coords.latitude + "," + pos.coords.longitude;

      window.open(`sms:${pet.phone}?body=${encodeURIComponent(msg)}`, "_self");

    });

  };

  if (!secondaryExists) {
    removeEl("callBtn2");
    removeEl("textBtn2");
    removeEl("locBtn2");
    setSingleMode();
    return;
  }

  document.getElementById("callBtn2").onclick = () =>
    window.location.href = "tel:" + pet.phone2;

  document.getElementById("textBtn2").onclick = () =>
    window.open(`sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`, "_self");

  document.getElementById("locBtn2").onclick = () => {

    navigator.geolocation.getCurrentPosition((pos) => {

      const msg =
        "I found " + pet.name +
        ". Location: https://maps.google.com/?q=" +
        pos.coords.latitude + "," + pos.coords.longitude;

      window.open(`sms:${pet.phone2}?body=${encodeURIComponent(msg)}`, "_self");

    });

  };

}

loadPet();

</script>

</body>
</html>
