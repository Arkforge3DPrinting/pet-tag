<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 12px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: auto;

      background: white;

      padding: 14px;

      border-radius: 20px;

      box-shadow: 0 6px 20px rgba(0,0,0,0.08);

      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 2px;
      line-height: 1.15;
    }

    p {
      font-size: 16px;
      color: #666;
      margin-top: 0;
      margin-bottom: 8px;
    }

    #petPhoto {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      margin: 8px auto;
      display: none;
      border: 4px solid #ffffff;
      box-shadow: 0 0 0 3px #3b82f6, 0 6px 18px rgba(0,0,0,0.15);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #callBtn { background: #28c76f; }
    #textBtn { background: #3b82f6; }
    #locBtn { background: #ff9f43; }

    /* secondary styling */
    #callBtn2 { background: #1f9d55; }
    #textBtn2 { background: #2563eb; }
    #locBtn2 { background: #f59e0b; }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }

  </style>
</head>

<body>

<div class="container">

  <h1 id="title">Loading...</h1>

  <p id="message"></p>

  <img id="petPhoto">

  <div class="button-group">

    <!-- PRIMARY -->
    <button id="callBtn">📞 Call Owner</button>
    <button id="textBtn">💬 Text Owner</button>
    <button id="locBtn">📍 Share My Location</button>

    <!-- SECONDARY (hidden until needed) -->
    <button id="callBtn2" style="display:none;">📞 Call Secondary Contact</button>
    <button id="textBtn2" style="display:none;">💬 Text Secondary Contact</button>
    <button id="locBtn2" style="display:none;">📍 Share Location to Secondary</button>

  </div>

  <div class="footer">
    Powered by Arkforge 3D Printing ®
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadPet() {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) {
    document.getElementById("title").innerText = "No pet ID found";
    return;
  }

  const snap = await getDoc(doc(db, "pets", id));

  if (!snap.exists()) {
    document.getElementById("title").innerText = "Error loading pet information";
    return;
  }

  const pet = snap.data();

  document.getElementById("title").innerText =
    "🐾 You found " + pet.name;

  document.getElementById("message").innerText =
    "Help me get home safely";

  // PHOTO
  if (pet.photo) {
    const img = document.getElementById("petPhoto");
    img.src = pet.photo;
    img.style.display = "block";
  }

  // =========================
  // PRIMARY CONTACT
  // =========================

  document.getElementById("callBtn").onclick = () => {
    window.location.href = "tel:" + pet.phone;
  };

  document.getElementById("textBtn").onclick = () => {
    const msg = "Hi, I found your pet " + pet.name;

    const smsLink =
      `sms:${pet.phone}?body=${encodeURIComponent(msg)}`;

    window.open(smsLink, "_self");
  };

  document.getElementById("locBtn").onclick = () => {

    const btn = document.getElementById("locBtn");

    btn.disabled = true;
    btn.innerText = "📡 Getting Location...";

    navigator.geolocation.getCurrentPosition(

      (pos) => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        const msg =
          "Hi, I found your pet " +
          pet.name +
          ". My location: https://maps.google.com/?q=" +
          lat + "," + lon;

        window.open(
          `sms:${pet.phone}?body=${encodeURIComponent(msg)}`,
          "_self"
        );

        reset();

      },

      () => {
        alert("Location failed or denied.");
        reset();
      }

    );

    function reset() {
      btn.disabled = false;
      btn.innerText = "📍 Share My Location";
    }
  };

  // =========================
  // SECONDARY CONTACT (NEW)
  // =========================

  if (pet.phone2 && pet.phone2.trim() !== "") {

    const show = (id) =>
      document.getElementById(id).style.display = "block";

    show("callBtn2");
    show("textBtn2");
    show("locBtn2");

    document.getElementById("callBtn2").onclick = () => {
      window.location.href = "tel:" + pet.phone2;
    };

    document.getElementById("textBtn2").onclick = () => {
      const msg =
        "Hi, I found your pet " + pet.name +
        " (secondary contact)";

      window.open(
        `sms:${pet.phone2}?body=${encodeURIComponent(msg)}`,
        "_self"
      );
    };

    document.getElementById("locBtn2").onclick = () => {

      if (!navigator.geolocation) {
        alert("Geolocation not supported.");
        return;
      }

      navigator.geolocation.getCurrentPosition((pos) => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        const msg =
          "Hi, I found your pet " +
          pet.name +
          ". My location: https://maps.google.com/?q=" +
          lat + "," + lon;

        window.open(
          `sms:${pet.phone2}?body=${encodeURIComponent(msg)}`,
          "_self"
        );

      });

    };

  }

}

loadPet();

</script>

</body>
</html>
