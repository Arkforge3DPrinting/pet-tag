<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard v6 (Audit Upgrade)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    h2 { margin-bottom: 12px; }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filters button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #ddd;
      cursor: pointer;
      font-weight: bold;
    }

    .filters button.active {
      background: #3b82f6;
      color: white;
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 14px;
    }

    .card {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-right: 5px;
    }

    .green { background:#dcfce7; color:#166534; }
    .red { background:#fee2e2; color:#991b1b; }
    .purple { background:#ede9fe; color:#5b21b6; }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row input {
      flex: 1;
      min-width: 180px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .buttons button {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .saveBtn { background:#3b82f6; color:white; }
    .disableBtn { background:#7c3aed; color:white; }

    .footer {
      display:flex;
      justify-content:space-between;
      margin-top:10px;
    }

    .footer img {
      width:90px;
      border-radius:10px;
    }

    .auditBox {
      background:white;
      padding:12px;
      border-radius:14px;
      height:80vh;
      overflow:auto;
      box-shadow:0 4px 14px rgba(0,0,0,0.06);
    }

    .auditItem {
      font-size: 12px;
      border-bottom: 1px solid #eee;
      padding: 8px 0;
    }

  </style>
</head>

<body>

<h2>🐾 Arkforge Admin Dashboard</h2>

<input id="search" placeholder="Search ID, name, phone...">

<div class="filters">
  <button class="active" onclick="setFilter('all', this)">All</button>
  <button onclick="setFilter('active', this)">Active</button>
  <button onclick="setFilter('inactive', this)">Inactive</button>
  <button onclick="setFilter('disabled', this)">Disabled</button>
</div>

<div class="layout">

  <div id="list"></div>

  <div class="auditBox">
    <b>Audit Log</b>
    <div id="auditList"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  getDoc,
  updateDoc,
  setDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let pets = [];
let audit = [];
let filter = "all";

const listDiv = document.getElementById("list");
const auditDiv = document.getElementById("auditList");

onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
  listen();
});

function listen() {

  onSnapshot(collection(db, "pets"), snap => {
    pets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });

  onSnapshot(collection(db, "audit"), snap => {
    audit = snap.docs.map(d => d.data());
    audit.sort((a,b) => b.timestamp.localeCompare(a.timestamp));
    renderAudit();
  });
}

document.getElementById("search").addEventListener("input", e => {
  window.search = e.target.value.toLowerCase();
  render();
});

window.setFilter = (f, btn) => {
  filter = f;
  document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
};

async function log(action, petId, data) {
  const ref = doc(collection(db, "audit"));
  await setDoc(ref, {
    action,
    petId,
    data,
    timestamp: new Date().toISOString()
  });
}

/* SAVE WITH FIELD DIFF */
window.savePet = async (id) => {

  const ref = doc(db, "pets", id);
  const snap = await getDoc(ref);

  const before = snap.data();

  const after = {
    name: document.getElementById("name-" + id).value,
    phone: document.getElementById("phone-" + id).value,
    phone2: document.getElementById("phone2-" + id).value
  };

  await updateDoc(ref, after);

  const changes = [];

  for (const k in after) {
    if ((before?.[k] || "") !== (after[k] || "")) {
      changes.push({ field: k, from: before?.[k] || "", to: after[k] });
    }
  }

  if (changes.length) {
    await log("updated", id, { changes });
  }
};

/* DISABLE / ENABLE */
window.toggleDisable = async (id, status) => {

  const ref = doc(db, "pets", id);
  const snap = await getDoc(ref);

  const before = snap.data();

  const disabling = status !== "disabled";

  const after = { status: disabling ? "disabled" : "active" };

  await updateDoc(ref, after);

  await log(after.status, id, {
    from: before.status || "active",
    to: after.status
  });
};

function makeQR(id, el) {
  new QRCode(el, {
    text: `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`,
    width: 90,
    height: 90
  });
}

function render() {

  listDiv.innerHTML = "";

  const s = window.search || "";

  const filtered = pets.filter(p => {

    const match =
      p.id.includes(s) ||
      (p.name || "").toLowerCase().includes(s) ||
      (p.phone || "").includes(s) ||
      (p.phone2 || "").includes(s);

    if (!match) return false;

    if (filter === "active") return !!p.activatedAt && p.status !== "disabled";
    if (filter === "inactive") return !p.activatedAt;
    if (filter === "disabled") return p.status === "disabled";

    return true;
  });

  filtered.forEach(p => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="meta"><b>${p.id}</b></div>

      <div class="row">
        <input id="name-${p.id}" value="${p.name || ""}">
        <input id="phone-${p.id}" value="${p.phone || ""}">
        <input id="phone2-${p.id}" value="${p.phone2 || ""}">
      </div>

      <div class="footer">
        ${p.photo ? `<img src="${p.photo}">` : ""}
        <div id="qr-${p.id}"></div>
      </div>

      <div class="buttons">
        <button class="saveBtn" onclick="savePet('${p.id}')">Save</button>
        <button class="disableBtn" onclick="toggleDisable('${p.id}','${p.status || ""}')">
          ${p.status === "disabled" ? "Re-enable" : "Disable"}
        </button>
      </div>
    `;

    listDiv.appendChild(div);

    setTimeout(() => {
      const qr = document.getElementById("qr-" + p.id);
      if (qr) makeQR(p.id, qr);
    }, 0);
  });
}

function renderAudit() {

  auditDiv.innerHTML = "";

  audit.slice(0, 150).forEach(a => {

    const div = document.createElement("div");
    div.className = "auditItem";

    let text = "";

    if (a.data?.changes) {
      text = a.data.changes.map(c =>
        `${c.field}: ${c.from} → ${c.to}`
      ).join("<br>");
    } else {
      text = JSON.stringify(a.data);
    }

    div.innerHTML = `
      <b>${a.action}</b> (${a.petId})<br>
      ${text}<br>
      <small>${a.timestamp}</small>
    `;

    auditDiv.appendChild(div);
  });
}

</script>

</body>
</html>
