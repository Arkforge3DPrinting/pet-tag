<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  getDoc,
  setDoc,
  query
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* =========================
   FIREBASE INIT
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* =========================
   STATE
========================= */

let pets = [];
let filter = "all";
let search = "";
let currentUser = null;

const listDiv = document.getElementById("list");

/* =========================
   AUTH GATE (CRITICAL FIX)
========================= */

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  // ONLY START FIRESTORE AFTER AUTH IS CONFIRMED
  startFirestore();
});

/* =========================
   FIRESTORE STARTER
========================= */

function startFirestore() {

  const petsQuery = query(collection(db, "pets"));

  onSnapshot(petsQuery, (snap) => {

    pets = [];

    snap.forEach(d => {
      pets.push({ id: d.id, ...d.data() });
    });

    render();
  });
}

/* =========================
   SEARCH
========================= */

document.getElementById("search").addEventListener("input", (e) => {
  search = (e.target.value || "").toLowerCase();
  render();
});

/* =========================
   FILTER
========================= */

window.setFilter = (f, btn) => {
  filter = f;

  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  render();
};

/* =========================
   SAVE PET
========================= */

window.savePet = async (id) => {

  const ref = doc(db, "pets", id);
  const snap = await getDoc(ref);

  const before = snap.data();

  const after = {
    name: document.getElementById("name-" + id).value,
    phone: document.getElementById("phone-" + id).value,
    phone2: document.getElementById("phone2-" + id).value
  };

  await updateDoc(ref, after);
};

/* =========================
   DISABLE / ENABLE
========================= */

window.toggleDisable = async (id) => {

  const ref = doc(db, "pets", id);
  const snap = await getDoc(ref);

  const data = snap.data();

  const newStatus =
    data.status === "disabled" ? "active" : "disabled";

  await updateDoc(ref, { status: newStatus });
};

/* =========================
   RENDER
========================= */

function render() {

  listDiv.innerHTML = "";

  const s = search || "";

  const filtered = pets.filter(p => {

    const match =
      (p.id || "").includes(s) ||
      (p.name || "").toLowerCase().includes(s) ||
      (p.phone || "").includes(s) ||
      (p.phone2 || "").includes(s);

    if (!match) return false;

    if (filter === "active")
      return p.status === "active";

    if (filter === "inactive")
      return !p.status || p.status === "inactive";

    if (filter === "disabled")
      return p.status === "disabled";

    return true;
  });

  if (filtered.length === 0) {
    listDiv.innerHTML = "<p>No pets found.</p>";
    return;
  }

  filtered.forEach(p => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="meta"><b>${p.id}</b></div>

      <div class="row">
        <input id="name-${p.id}" value="${p.name || ""}">
        <input id="phone-${p.id}" value="${p.phone || ""}">
        <input id="phone2-${p.id}" value="${p.phone2 || ""}">
      </div>

      <div class="buttons">
        <button onclick="savePet('${p.id}')">Save</button>
        <button onclick="toggleDisable('${p.id}')">
          ${p.status === "disabled" ? "Re-enable" : "Disable"}
        </button>
      </div>
    `;

    listDiv.appendChild(div);
  });
}

</script>
