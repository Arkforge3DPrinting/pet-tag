<!DOCTYPE html>
<html>
<head>
  <title>Login Debug</title>
</head>

<body>

<h2>Login Test</h2>

<input id="email" placeholder="email"><br><br>
<input id="password" type="password" placeholder="password"><br><br>

<button id="btn">Login</button>

<p id="status">Page loaded</p>

<script type="module">

window.addEventListener("DOMContentLoaded", async () => {

  document.getElementById("status").innerText = "JS running...";

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "arkforge-pets.firebaseapp.com",
    projectId: "arkforge-pets"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.getElementById("status").innerText = "Firebase loaded";

  document.getElementById("btn").onclick = async () => {

    document.getElementById("status").innerText = "Attempting login...";

    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById("email").value,
        document.getElementById("password").value
      );

      document.getElementById("status").innerText = "SUCCESS";

    } catch (e) {
      console.log(e);
      document.getElementById("status").innerText = "FAILED";
    }
  };

});

</script>

</body>
</html>
