<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard v6</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    h2 { margin-bottom: 12px; }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filters button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #ddd;
      cursor: pointer;
      font-weight: bold;
    }

    .filters button.active {
      background: #3b82f6;
      color: white;
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 14px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .badges { margin-bottom: 10px; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      margin-right: 5px;
    }

    .green { background: #dcfce7; color: #166534; }
    .red { background: #fee2e2; color: #991b1b; }
    .orange { background: #ffedd5; color: #9a3412; }
    .blue { background: #dbeafe; color: #1d4ed8; }
    .purple { background: #ede9fe; color: #5b21b6; }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row input {
      flex: 1;
      min-width: 160px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .buttons button {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .saveBtn { background: #3b82f6; color: white; }
    .disableBtn { background: #7c3aed; color: white; }
    .deleteBtn { background: #ef4444; color: white; }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      align-items: flex-end;
    }

    .footer img {
      width: 90px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .auditBox {
      background: white;
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      height: 80vh;
      overflow: auto;
    }

    .auditItem {
      font-size: 12px;
      border-bottom: 1px solid #eee;
      padding: 6px 0;
    }
  </style>
</head>

<body>

<h2>🐾 Admin Dashboard</h2>

<input id="search" placeholder="Search ID, name, phone...">

<div class="filters">
  <button class="active" onclick="setFilter('all', this)">All</button>
  <button onclick="setFilter('active', this)">Active</button>
  <button onclick="setFilter('inactive', this)">Inactive</button>
  <button onclick="setFilter('disabled', this)">Disabled</button>
</div>

<div class="layout">

  <div id="list"></div>

  <div class="auditBox">
    <b>Audit Log</b>
    <div id="auditList"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  setDoc,
  getDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let pets = [];
let audit = [];
let filter = "all";
let search = "";

const listDiv = document.getElementById("list");
const auditDiv = document.getElementById("auditList");

/* AUTH */
onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
  listen();
});

/* LISTEN */
function listen() {

  onSnapshot(collection(db, "pets"), snap => {
    pets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });

  onSnapshot(collection(db, "audit"), snap => {
    audit = snap.docs.map(d => d.data());
    audit.sort((a,b) => (b.timestamp || "").localeCompare(a.timestamp || ""));
    renderAudit();
  });
}

/* SEARCH */
document.getElementById("search").addEventListener("input", e => {
  search = e.target.value.toLowerCase();
  render();
});

/* FILTER */
window.setFilter = (f, btn) => {
  filter = f;
  document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
};

/* QR */
function makeQR(id, el) {
  const url = `https://arkforge3dprinting.github.io/pet-tag/activate.html?id=${id}`;
  new QRCode(el, { text: url, width: 90, height: 90 });
}

/* AUDIT */
async function log(action, petId, before, after) {
  const ref = doc(collection(db, "audit"));
  await setDoc(ref, {
    action,
    petId,
    before,
    after,
    timestamp: new Date().toISOString()
  });
}

/* SAVE */
window.savePet = async (id) => {

  const ref = doc(db, "pets", id);
  const before = (await getDoc(ref)).data();

  const after = {
    name: document.getElementById("name-" + id).value,
    phone: document.getElementById("phone-" + id).value,
    phone2: document.getElementById("phone2-" + id).value
  };

  await updateDoc(ref, after);

  await log("updated", id, before, after);
};

/* DISABLE */
window.toggleDisable = async (id, status) => {

  const ref = doc(db, "pets", id);
  const before = (await getDoc(ref)).data();

  const disabling = status !== "disabled";

  const after = { status: disabling ? "disabled" : "active" };

  await updateDoc(ref, after);

  await log(after.status, id, before, after);
};

/* DELETE (RESTORED HARD DELETE) */
window.deletePet = async (id) => {

  if (!confirm("Delete this pet permanently?")) return;

  const before = (await getDoc(doc(db, "pets", id))).data();

  await deleteDoc(doc(db, "pets", id));

  await log("deleted", id, before, null);
};

/* RENDER PETS */
function render() {

  listDiv.innerHTML = "";

  const f = pets.filter(p => {

    const s = search;

    const match =
      p.id.toLowerCase().includes(s) ||
      (p.name || "").toLowerCase().includes(s) ||
      (p.phone || "").includes(s) ||
      (p.phone2 || "").includes(s);

    if (!match) return false;

    if (filter === "active") return p.activatedAt && p.status !== "disabled";
    if (filter === "inactive") return !p.activatedAt;
    if (filter === "disabled") return p.status === "disabled";

    return true;
  });

  f.forEach(p => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="meta"><b>${p.id}</b></div>

      <div class="badges">
        ${
          p.status === "disabled"
            ? `<span class="badge purple">Disabled</span>`
            : p.activatedAt
              ? `<span class="badge green">Active</span>`
              : `<span class="badge red">Inactive</span>`
        }
      </div>

      <div class="row">
        <input id="name-${p.id}" value="${p.name || ""}">
        <input id="phone-${p.id}" value="${p.phone || ""}">
        <input id="phone2-${p.id}" value="${p.phone2 || ""}">
      </div>

      <div class="footer">
        ${p.photo ? `<img src="${p.photo}">` : ""}
        <div id="qr-${p.id}"></div>
      </div>

      <div class="buttons">
        <button class="saveBtn" onclick="savePet('${p.id}')">Save</button>
        <button class="disableBtn" onclick="toggleDisable('${p.id}','${p.status || ""}')">
          ${p.status === "disabled" ? "Re-enable" : "Disable"}
        </button>
        <button class="deleteBtn" onclick="deletePet('${p.id}')">Delete</button>
      </div>
    `;

    listDiv.appendChild(div);

    setTimeout(() => {
      const qr = document.getElementById("qr-" + p.id);
      if (qr) makeQR(p.id, qr);
    }, 0);

  });
}

/* AUDIT */
function renderAudit() {

  auditDiv.innerHTML = "";

  audit.slice(0, 200).forEach(a => {

    const div = document.createElement("div");
    div.className = "auditItem";

    div.innerHTML = `
      <b>${a.action}</b><br>
      ${a.petId}<br>
      <small>${a.timestamp}</small>
    `;

    auditDiv.appendChild(div);
  });
}

</script>

</body>
</html>
