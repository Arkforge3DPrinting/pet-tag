<!DOCTYPE html>
<html>
<head>
  <title>Create Pet Tag</title>
</head>

<body style="font-family: Arial; text-align:center; padding:20px;">

<h2>Create NFC Pet Tag</h2>

<input id="name" placeholder="Pet Name"><br><br>
<input id="phone" placeholder="Owner Phone"><br><br>
<input id="microchip" placeholder="Microchip"><br><br>

<button id="generateBtn">Generate & Save</button>

<p id="result"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔢 ID generator
function generateId(length = 10) {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  let id = "";
  for (let i = 0; i < length; i++) {
    id += chars[Math.floor(Math.random() * chars.length)];
  }
  return id;
}

// 🚀 SAVE BUTTON
document.getElementById("generateBtn").onclick = async () => {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const microchip = document.getElementById("microchip").value;
  const photo = document.getElementById("photo").value;

  const result = document.getElementById("result");

  if (!name || !phone) {
    result.innerText = "Please enter pet name and phone";
    return;
  }

  const id = generateId();

  try {

    await setDoc(doc(db, "pets", id), {
      name,
      phone,
      microchip: microchip || "",
      photo: photo || ""
    });

    const url = `https://arkforge3dprinting.github.io/pet-tag/?id=${id}`;

    result.innerHTML = `
      <b>Saved!</b><br><br>
      <b>ID:</b> ${id}<br><br>
      <b>URL:</b><br>
      <a href="${url}" target="_blank">${url}</a>
    `;

  } catch (e) {
    console.log("SAVE ERROR:", e);
    result.innerText = e.code + " - " + e.message;
  }

};

</script>

</body>
</html>
