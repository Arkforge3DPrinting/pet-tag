    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;

      color: white;

      margin-top: 8px;

    .lostBtn { background:#ef4444; }
    .safeBtn { background:#28c76f; }
    .saveBtn { background:#3b82f6; }

    #preview {
      width:160px;
      height:160px;
      border-radius:18px;
      object-fit:cover;
      border:3px solid #22c55e55;
      display:block;
      margin:auto;
    }

    input[type="file"] { display:none; }

    .statusBox {
      text-align:center;
      padding:10px;
      border-radius:12px;
      font-weight:bold;
      margin-top:10px;
    }

    .safe { background:#eafff1; color:#1a7f3c; }
    .lost { background:#ffecec; color:#a31212; }

    .successMsg {
      display:none;
      text-align:center;
      font-weight:bold;
      color:#16a34a;
      margin-top:10px;
    }
    .editBtn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;

}

    .actionBtn {

    .editLink {

}
    .saveBtn {

}
    #uploadBarWrap {
  width: 100%;
  height: 8px;
  background: #e5e7eb;
  border-radius: 999px;
  margin-top: 10px;
  overflow: hidden;
  display: none;
}

#uploadBar {
  height: 100%;
  width: 0%;
  background: #3b82f6;
  transition: width 0.2s ease;
}

    .successMsg {
  display: none;
  opacity: 1;
  transition: opacity 1s ease;
  text-align: center;
  font-weight: bold;
  color: #16a34a;
  margin-top: 10px;
}

</head>

<body>

<div class="container">

  <h1>ArkLink - Update Pet Details v1.8 - Progress bar/save lock for upload</h1>

  <div class="contextBox">
    You are editing: <span id="petNameLabel">Loading...</span><br>
    Tag ID: <span id="tagIdLabel"></span>
  </div>

  <div id="statusDisplay" class="statusBox">Loading...</div>

  <div class="section">
    <label>Status</label>
    <button class="lostBtn" onclick="setStatus('lost')">
  <i class="fa-solid fa-xmark"></i> Mark Lost
  </button>
  <button class="safeBtn" onclick="setStatus('safe')">
  <i class="fa-solid fa-check"></i> Mark Safe
</button>
  </div>

  <div class="section">
    <label>Primary Phone</label>
    <input id="phone">

    <label>Secondary Phone</label>
    <input id="phone2">
  </div>
  
<!-- EDIT BUTTONS FOR CHIP/NAME -->
  <div class="section">
    <label>Pet Name</label>
    <input id="petNameInput" readonly>
 <div class="editLink" onclick="togglePetNameEdit()">✏️ Edit name</div>
  </div>

  <div class="section">
    <label>Microchip</label>
    <input id="microchipInput" readonly>
   <div class="editLink" onclick="toggleMicrochipEdit()">✏️ Edit microchip</div>
  </div>
<div class="section">
  <label>Photo</label>

  <!-- IMAGE PREIVEW -->
  <img id="preview">

  <input
  type="file"
  id="fileInput"
  accept="image/*"
  style="display:none;"
>
  <div id="uploadContainer" style="display:none; margin-top:10px;">
  <progress id="uploadProgress" value="0" max="100" style="width:100%;"></progress>
  <div id="uploadText" style="text-align:center; font-size:12px; margin-top:4px;">
    Uploading... 0%
  </div>
</div>

  <div style="display:flex; gap:10px; margin-top:10px;">
    <button type="button" class="primaryBtn" onclick="openCamera()">
      <i class="fa-solid fa-camera"></i> Camera
    </button>

    <button type="button" class="primaryBtn" onclick="openGallery()">
      <i class="fa-solid fa-upload"></i> Upload
    </button>
  </div>

  <input type="file" id="fileInput" accept="image/*">

  <!-- PROGRESS BAR -->
  <div id="uploadBarWrap">
    <div id="uploadBar"></div>
  </div>

  <div id="fileInfo"></div>
</div>
  <div class="saveWrap">
  <button id="saveBtn" class="saveBtn primaryBtn" onclick="save()">
    <i class="fa-solid fa-floppy-disk"></i> Save Changes
  </button>
</div>

  <div class="successMsg" id="successMsg">Save successfull. Please reload the page for additional changes.</div>

</div>

<script type="module">
console.log("SCRIPT STARTED");
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");
console.log("ID FROM URL:", id);
let ref = null;
let petData = null;
let selectedFile = null;
let previewURL = null;

/* ================= SAFE INIT ================= */
function init() {
  if (!id) {
    console.error("Missing ID in URL");
    document.getElementById("statusDisplay").innerText = "Missing ID";
    return;
  }

  ref = doc(db, "pets", id);
  document.getElementById("tagIdLabel").innerText = id;

  console.log("Firestore ref created:", ref.path);
getDoc(ref).then(snap => {
  console.log("TEST SNAPSHOT:", snap.exists());
});
  load();
}
/* ================= LOAD ================= */
async function load() {
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    document.getElementById("statusDisplay").innerText = "Pet not found";
    return;
  }

  petData = snap.data();

  document.getElementById("petNameLabel").innerText = petData.name || "";
  document.getElementById("phone").value = petData.phone || "";
  document.getElementById("phone2").value = petData.phone2 || "";
  document.getElementById("petNameInput").value = petData.name || "";
  document.getElementById("microchipInput").value = petData.microchip || "";
  document.getElementById("preview").src = petData.photo || "";

  updateStatus();
}

/* ================= STATUS ================= */
window.setStatus = async (status) => {
  await updateDoc(ref, {
    petStatus: status,
    updatedAt: new Date()
  });

  petData.petStatus = status;
  updateStatus();
};

function updateStatus() {
  const box = document.getElementById("statusDisplay");

  if (!petData) return;

  const lost = petData.petStatus === "lost";
  box.className = "statusBox " + (lost ? "lost" : "safe");
  box.innerText = lost ? "LOST" : "SAFE";
}

/* ================= TOGGLES ================= */
window.togglePetNameEdit = () => {
  const i = document.getElementById("petNameInput");
  i.readOnly = !i.readOnly;
  i.focus();
};

window.toggleMicrochipEdit = () => {
  const i = document.getElementById("microchipInput");
  i.readOnly = !i.readOnly;
  i.focus();
};

/* ================= FILE ================= */
document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (file && file.size > 15 * 1024 * 1024) {
  alert("Please choose an image smaller than 10 MB.");
  e.target.value = "";
  return;
}
  if (!file) return;

  selectedFile = file;

  if (previewURL) URL.revokeObjectURL(previewURL);

  previewURL = URL.createObjectURL(file);
  document.getElementById("preview").src = previewURL;
});

/* ================= CLOUDINARY ================= */
function upload(file) {
  return new Promise((resolve, reject) => {

    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", "arkforge-pets");

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload");

    const progressBar = document.getElementById("uploadProgress");
    const progressText = document.getElementById("uploadText");
    const progressContainer = document.getElementById("uploadContainer");

    if (progressContainer) progressContainer.style.display = "block";

    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;

      const percent = Math.round((e.loaded / e.total) * 100);

      if (progressBar) progressBar.value = percent;
      if (progressText) progressText.textContent = `Uploading... ${percent}%`;
    };

    xhr.onload = () => {
      try {
        const data = JSON.parse(xhr.responseText);

        if (!data.secure_url) {
          reject("Upload failed");
          return;
        }

        if (progressText) progressText.textContent = "Upload complete!";

        setTimeout(() => {
          if (progressContainer) progressContainer.style.display = "none";
        }, 500);

        resolve(data.secure_url);

      } catch (err) {
        reject("Bad response");
      }
    };

    xhr.onerror = () => reject("Network error");

    xhr.send(form);
  });
}
/* =================PROGRESS BAR ================= */

const progressText = document.getElementById("uploadText");
const progressContainer = document.getElementById("uploadContainer");

progressContainer.style.display = "block";

    progressBar.value = 100;
progressText.textContent = "Upload complete!";

}, 1000)

  }
};

      try {
        const data = JSON.parse(xhr.responseText);

        if (!data.secure_url) {
          reject("Upload failed");
          return;
        }

        bar.style.width = "100%";

        setTimeout(() => {
          barWrap.style.display = "none";
        }, 500);

        resolve(data.secure_url);

      } catch (err) {
        reject("Invalid response");
      }
    };

    xhr.onerror = () => reject("Network error");

    xhr.open("POST", "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload");
    xhr.send(form);
  });
}
/* ================= SAVE ================= */
window.save = async () => {
  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  btn.textContent = "⏳ Saving...";

  try {
    let photo = petData.photo || "";

    if (selectedFile) {
      photo = await upload(selectedFile);
    }

    await updateDoc(ref, {
      name: document.getElementById("petNameInput").value,
      microchip: document.getElementById("microchipInput").value,
      phone: document.getElementById("phone").value,
      phone2: document.getElementById("phone2").value,
      photo,
      updatedAt: new Date()
    });

    await load(); // refresh UI properly

    const msg = document.getElementById("successMsg");
    msg.style.display = "block";

    setTimeout(() => {
      msg.style.display = "none";
    }, 2000);

    selectedFile = null;
    previewURL = null;

  } catch (e) {
    console.error(e);
    alert("Save failed");
  } finally {
    btn.disabled = false;
    btn.textContent = "💾 Save Changes";
  }
};

/* ================= START HERE ================= */
init();

</script>

</body>
</html>
