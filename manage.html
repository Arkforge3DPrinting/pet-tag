<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Manage Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
    }

    .container {
      max-width: 460px;
      margin: auto;
      background: #fff;
      padding: 16px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .contextBox {
      text-align:center;
      background:#eef6ff;
      padding:10px;
      border-radius:12px;
      font-weight:bold;
      margin-bottom: 10px;
    }

    .section {
      margin-top: 12px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
    }

    /* ✅ FIXED LABEL ALIGNMENT */
    label {
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;   /* PERFECT vertical centering */
      gap: 8px;
      line-height: 1;
      margin-bottom: 6px;
    }

    label i {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      color: white;
      margin-top: 8px;
    }

    .lostBtn { background:#ef4444; }
    .safeBtn { background:#28c76f; }
    .saveBtn { background:#3b82f6; }

    #preview {
      width:160px;
      height:160px;
      border-radius:18px;
      object-fit:cover;
      display:block;
      margin:auto;
    }

    #fileInput { display:none; }

    .primaryBtn {
      flex:1;
      padding:12px;
      border-radius:14px;
      border:none;
      cursor:pointer;
      font-weight:600;
      color:white;
      background:#3b82f6;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .btnRow {
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    #uploadBarWrap {
      display:none;
      width:100%;
      height:8px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
      margin-top:10px;
    }

    #uploadBar {
      height:100%;
      width:0%;
      background:#3b82f6;
    }

    .success {
      text-align:center;
      font-weight:bold;
      color:#16a34a;
      margin-top:10px;
      display:none;
    }

    #fileInfo {
      text-align:center;
      font-size:12px;
      color:#666;
      margin-top:6px;
    }
  </style>
</head>

<body>

<div class="container" id="main">

  <h2 style="text-align:center;">ArkForge Pet ID</h2>

  <div class="contextBox">
    You are editing:<br>
    <span id="petNameLabel">Loading...</span><br>
    <small>ID: <span id="tagIdLabel"></span></small>
  </div>

  <div class="section">
    <label><i class="fa-solid fa-heart-crack"></i> Status</label>
    <button class="lostBtn" onclick="setStatus('lost')">Mark Lost</button>
    <button class="safeBtn" onclick="setStatus('safe')">Mark Safe</button>
  </div>

  <div class="section">
    <label><i class="fa-solid fa-phone"></i> Primary Phone</label>
    <input id="phone">

    <label><i class="fa-solid fa-phone"></i> Secondary Phone</label>
    <input id="phone2">
  </div>

  <div class="section">
    <label><i class="fa-solid fa-dog"></i> Pet Name</label>
    <input id="petNameInput" readonly>

    <label><i class="fa-solid fa-microchip"></i> Microchip</label>
    <input id="microchipInput" readonly>
  </div>

  <div class="section">
    <label><i class="fa-solid fa-image"></i> Photo</label>

    <img id="preview">

    <div id="fileInfo"></div>

    <input type="file" id="fileInput" accept="image/*">

    <div class="btnRow">
      <button type="button" class="primaryBtn" onclick="openCamera()">
        <i class="fa-solid fa-camera"></i> Camera
      </button>

      <button type="button" class="primaryBtn" onclick="openGallery()">
        <i class="fa-solid fa-upload"></i> Upload
      </button>
    </div>

    <div id="uploadBarWrap">
      <div id="uploadBar"></div>
    </div>

    <div class="success" id="uploadSuccess">Image uploaded successfully</div>
  </div>

  <button class="saveBtn" onclick="save()">Save Changes</button>

  <div class="success" id="saveSuccess">Saved successfully</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(location.search).get("id");
const main = document.getElementById("main");

let ref;
let petData;
let selectedFile = null;

/* INIT */
function init() {
  if (!id) {
    document.getElementById("petNameLabel").innerText = "Missing ID";
    main.style.opacity = "1";
    return;
  }

  ref = doc(db, "pets", id);
  document.getElementById("tagIdLabel").innerText = id;
  load();
}

/* LOAD */
async function load() {
  const snap = await getDoc(ref);
  if (!snap.exists()) return;

  petData = snap.data();

  document.getElementById("petNameLabel").innerText = petData.name || "";
  document.getElementById("phone").value = petData.phone || "";
  document.getElementById("phone2").value = petData.phone2 || "";
  document.getElementById("petNameInput").value = petData.name || "";
  document.getElementById("microchipInput").value = petData.microchip || "";
  document.getElementById("preview").src = petData.photo || "";

  main.style.opacity = "1";
}

/* STATUS */
window.setStatus = async (status) => {
  await updateDoc(ref, {
    petStatus: status,
    updatedAt: new Date()
  });
};

/* FILE */
document.getElementById("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const sizeMB = (file.size / 1024 / 1024).toFixed(2);
  document.getElementById("fileInfo").innerText =
    `${file.name} • ${sizeMB} MB`;

  selectedFile = file;
  document.getElementById("preview").src = URL.createObjectURL(file);
});

/* CAMERA */
window.openCamera = () => {
  const i = document.getElementById("fileInput");
  i.setAttribute("capture","environment");
  i.click();
};

/* GALLERY */
window.openGallery = () => {
  const i = document.getElementById("fileInput");
  i.removeAttribute("capture");
  i.click();
};

/* SAVE */
window.save = async () => {
  await updateDoc(ref, {
    name: document.getElementById("petNameInput").value,
    microchip: document.getElementById("microchipInput").value,
    phone: document.getElementById("phone").value,
    phone2: document.getElementById("phone2").value,
    updatedAt: new Date()
  });

  document.getElementById("saveSuccess").style.display = "block";

  setTimeout(() => location.reload(), 500);
};

init();
</script>

</body>
</html>
