<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ArkForge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#1e1e1e;
    font-family:Arial,sans-serif;
    color:white;
    text-align:center;
}

/* FULLSCREEN OVERLAY */
.start-screen{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:#0b0b0b;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

button{
    padding:16px 28px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN CONTENT */
.content{
    opacity:0.2;
    pointer-events:none;
    transition:0.4s;
}

.content.active{
    opacity:1;
    pointer-events:auto;
}

/* OUTER FIXED STABLE CIRCLE */
.circle{
    width:180px;
    height:180px;
    border-radius:50%;
    background:#22c55e;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

/* ABSOLUTE ANIMATED LAYER (THIS FIXES SHIFT) */
.circle-inner{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    transform-origin:center;
    transform:scale(0);
}

/* TICK */
.tick{
    width:80px;
    height:80px;
}

/* TEXT */
.message{
    margin-top:30px;
    font-size:20px;
}

.amount{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
    color:#4ade80;
}

.bank{
    margin-top:20px;
    font-size:14px;
    color:#a1a1aa;
}

.tap{
    margin-top:25px;
    font-size:14px;
    color:#facc15;
}

/* ANIMATIONS */
@keyframes pop{
    0%{transform:scale(0);}
    80%{transform:scale(1.15);}
    100%{transform:scale(1);}
}

@keyframes tick{
    from{transform:scale(0); opacity:0;}
    to{transform:scale(1); opacity:1;}
}
</style>
</head>

<body>

<div class="start-screen" id="startScreen">
    <div>
        <h2>ARKFORGE 3D PRINTING</h2>
        <p>CLICK BELOW TO GET STARTED</p>
        <button onclick="start()">LET'S GO!</button>
    </div>
</div>

<div class="content" id="content">

    <div class="circle">
        <div class="circle-inner" id="circleInner">
            <svg class="tick" id="tick" viewBox="0 0 100 100">
                <path d="M20 55 L40 75 L80 30"
                      fill="none"
                      stroke="white"
                      stroke-width="10"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <div class="message">$500.00 AUD successfully sent to</div>
    <div class="amount">Mr. Timothy Alexander</div>

    <div class="bank">
        BSB: 602-323 / Account: 938477190
    </div>
    <div class="bank">
        NAB BANK AUSTRALIA
    </div>

    <div class="tap">
        Transaction complete
    </div>

</div>

<audio id="success" preload="auto">
    <source src="https://arkforge3dprinting.github.io/pet-tag/success.mp3" type="audio/mpeg">
</audio>

<script>
function start(){
    const audio = document.getElementById("success");

    document.getElementById("startScreen").style.display = "none";

    const content = document.getElementById("content");
    const circleInner = document.getElementById("circleInner");
    const tick = document.getElementById("tick");

    content.classList.add("active");

    // HARD RESET transform state (important fix)
    circleInner.style.transform = "scale(0)";
    tick.style.transform = "scale(0)";

    // force reflow so animation actually starts clean
    void circleInner.offsetWidth;

    circleInner.style.animation = "pop 0.4s ease-out forwards";
    tick.style.animation = "tick 0.35s 0.35s forwards";

    audio.play().catch(() => {});
}
</script>

</body>
</html>
