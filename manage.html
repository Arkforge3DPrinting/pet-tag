<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Manage Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    
   body {
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
  margin: 0;
  padding: 12px;
  color: #222;
}

.container {
  max-width: 460px;
  margin: auto;
  background: #fff;
  padding: 16px;
  border-radius: 22px;
  border: 1px solid rgba(59,130,246,0.15);
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h1 { text-align:center; font-size:22px; }

.contextBox {
  margin: 10px 0;
  padding: 10px;
  border-radius: 12px;
  background: #eef6ff;
  text-align: center;
  font-weight: bold;
}

.section {
  margin-top: 14px;
  padding: 12px;
  background: #f9fafb;
  border-radius: 18px;
  border: 1px solid #e5e7eb;
  text-align: center;
}

label {
  font-size:12px;
  font-weight:bold;
  display:block;
  margin-bottom:6px;
}

/* INPUTS (consistent + soft) */
input {
  width: 100%;
  max-width: 360px;
  display: block;
  margin: 0 auto 10px auto;
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid #e5e7eb;
  background: #fff;
  box-sizing: border-box;
  font-size: 14px;
  transition: 0.15s ease;
}

input:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

/* STATUS BUTTONS (PILLS FIXED) */
.lostBtn,
.safeBtn {
  width: 100%;
  padding: 12px 14px;
  border-radius: 999px; /* 👈 pill shape */
  border: none;
  font-weight: 600;
  cursor: pointer;
  color: white;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: 0.15s ease;
}

.lostBtn { background:#ef4444; }
.safeBtn { background:#28c76f; }

.lostBtn:hover { background:#dc2626; transform: translateY(-1px); }
.safeBtn:hover { background:#22c55e; transform: translateY(-1px); }

/* CAMERA / UPLOAD */
.btnRow {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.primaryBtn {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  color: white;
  background: #3b82f6;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.primaryBtn:hover {
  background: #2563eb;
}

/* EDIT LINKS */
.editLink {
  font-size: 13px;
  color: #3b82f6;
  cursor: pointer;
  font-weight: 600;
  margin-top: 6px;
  text-align: center;
  user-select: none;
}

.editLink:hover {
  color: #2563eb;
  text-decoration: underline;
}

/* SAVE BUTTON */
.saveWrap {
  display: flex;
  justify-content: center;
  margin-top: 14px;
}

.saveBtn {
  width: 55%;
  max-width: 240px;
  padding: 14px;
  border-radius: 18px;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: #3b82f6;
  color: white;
  border: none;
  font-weight: 600;
}

/* IMAGE */
#preview {
  width:160px;
  height:160px;
  border-radius:18px;
  object-fit:cover;
  border:3px solid #22c55e55;
  display:block;
  margin:auto;
}

/* FILE INPUT */
input[type="file"] { display:none; }

/* STATUS BOX */
.statusBox {
  text-align:center;
  padding:10px;
  border-radius:12px;
  font-weight:bold;
  margin-top:10px;
}

.safe { background:#eafff1; color:#1a7f3c; }
.lost { background:#ffecec; color:#a31212; }

/* PROGRESS BAR */
#uploadBarWrap {
  width: 100%;
  height: 8px;
  background: #e5e7eb;
  border-radius: 999px;
  margin-top: 10px;
  overflow: hidden;
}

#uploadBar {
  height: 100%;
  width: 0%;
  background: #3b82f6;
  transition: width 0.2s ease;
}
    .successMsg {
  margin-top: 22px;
  padding-bottom: 10px;
  text-align: center;
  font-weight: bold;
  color: #16a34a;
}
  </style>
</head>

<body>

<div class="container">

  <h1>ArkLink - Update Pet Details v1.2</h1>

  <div class="contextBox">
    You are editing: <span id="petNameLabel">Loading...</span><br>
    Tag ID: <span id="tagIdLabel"></span>
  </div>

  <div id="statusDisplay" class="statusBox">Loading...</div>

  <div class="section">
    <label>Status</label>
    <button class="lostBtn" onclick="setStatus('lost')">
  <i class="fa-solid fa-xmark"></i> Mark Lost
  </button>
  <button class="safeBtn" onclick="setStatus('safe')">
  <i class="fa-solid fa-check"></i> Mark Safe
</button>
  </div>

  <div class="section">
    <label>Primary Phone</label>
    <input id="phone">

    <label>Secondary Phone</label>
    <input id="phone2">
  </div>

  <div class="section">
    <label>Pet Name</label>
    <input id="petNameInput" readonly>
 <div class="editLink" onclick="togglePetNameEdit()">✏️ Edit name</div>
  </div>

  <div class="section">
    <label>Microchip</label>
    <input id="microchipInput" readonly>
   <div class="editLink" onclick="toggleMicrochipEdit()">✏️ Edit microchip</div>
  </div>
<div class="section">
  <label>Photo</label>

  <img id="preview">

  <input
  type="file"
  id="fileInput"
  accept="image/*"
  style="display:none;"
>

  <div class="btnRow">
    <button type="button" class="primaryBtn" onclick="openCamera()">
      <i class="fa-solid fa-camera"></i> Camera
    </button>

    <button type="button" class="primaryBtn" onclick="openGallery()">
      <i class="fa-solid fa-upload"></i> Upload
    </button>
  </div>

  <input type="file" id="fileInput" accept="image/*">

  <!-- PROGRESS BAR -->
  <div id="uploadBarWrap">
    <div id="uploadBar"></div>
  </div>

  <div id="fileInfo"></div>
</div>
  <div class="saveWrap">
  <button id="saveBtn" class="saveBtn primaryBtn" onclick="save()">
    <i class="fa-solid fa-floppy-disk"></i> Save Changes
  </button>
</div>

  <div class="successMsg" id="successMsg">Save successfull. Please reload the page for additional changes.</div>

</div>
  

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

let ref = null;
let petData = null;
let selectedFile = null;
let previewURL = null;

/* ================= SAFE INIT ================= */
function init() {
  if (!id) {
    document.getElementById("statusDisplay").innerText = "Missing ID";
    return;
  }

  ref = doc(db, "pets", id);
  document.getElementById("tagIdLabel").innerText = id;

  load();
}

/* ================= LOAD ================= */
async function load() {
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    document.getElementById("statusDisplay").innerText = "Pet not found";
    return;
  }

  petData = snap.data();

  document.getElementById("petNameLabel").innerText = petData.name || "";
  document.getElementById("phone").value = petData.phone || "";
  document.getElementById("phone2").value = petData.phone2 || "";
  document.getElementById("petNameInput").value = petData.name || "";
  document.getElementById("microchipInput").value = petData.microchip || "";
  document.getElementById("preview").src = petData.photo || "";

  updateStatus();
}

/* ================= STATUS ================= */
window.setStatus = async (status) => {
  await updateDoc(ref, {
    petStatus: status,
    updatedAt: new Date()
  });

  petData.petStatus = status;
  updateStatus();
};

function updateStatus() {
  const box = document.getElementById("statusDisplay");

  if (!petData) return;

  const lost = petData.petStatus === "lost";
  box.className = "statusBox " + (lost ? "lost" : "safe");
  box.innerText = lost ? "LOST" : "SAFE";
}

/* ================= TOGGLES ================= */
window.togglePetNameEdit = () => {
  const i = document.getElementById("petNameInput");
  i.readOnly = !i.readOnly;
  i.focus();
};

window.toggleMicrochipEdit = () => {
  const i = document.getElementById("microchipInput");
  i.readOnly = !i.readOnly;
  i.focus();
};

/* ================= FILE ================= */
document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  selectedFile = file;

  if (previewURL) URL.revokeObjectURL(previewURL);

  previewURL = URL.createObjectURL(file);
  document.getElementById("preview").src = previewURL;
});

/* ================= CLOUDINARY ================= */
function upload(file) {
  return new Promise((resolve, reject) => {

    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", "arkforge-pets");

    const xhr = new XMLHttpRequest();

    const barWrap = document.getElementById("uploadBarWrap");
    const bar = document.getElementById("uploadBar");

    barWrap.style.display = "block";
    bar.style.width = "0%";

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = (e.loaded / e.total) * 100;
        bar.style.width = percent + "%";
      }
    };

    xhr.onload = () => {
      try {
        const data = JSON.parse(xhr.responseText);

        if (!data.secure_url) {
          reject("Upload failed");
          return;
        }

        bar.style.width = "100%";

        setTimeout(() => {
          barWrap.style.display = "none";
        }, 500);

        resolve(data.secure_url);

      } catch (err) {
        reject("Invalid response");
      }
    };

    xhr.onerror = () => reject("Network error");

    xhr.open("POST", "https://api.cloudinary.com/v1_1/ddsp7ps7p/image/upload");
    xhr.send(form);
  });
}
/* ================= SAVE ================= */
window.save = async () => {
  const btn = document.getElementById("saveBtn");
  btn.disabled = true;

  try {
    let photo = petData.photo || "";

    if (selectedFile) {
      photo = await upload(selectedFile);
    }

    await updateDoc(ref, {
      name: document.getElementById("petNameInput").value,
      microchip: document.getElementById("microchipInput").value,
      phone: document.getElementById("phone").value,
      phone2: document.getElementById("phone2").value,
      photo,
      updatedAt: new Date()
    });

    document.getElementById("successMsg").style.display = "block";

  } catch (e) {
    console.error(e);
    alert("Save failed");
  } finally {
    btn.disabled = false;
  }
};
window.openCamera = () => {
  const input = document.getElementById("fileInput");
  input.setAttribute("capture", "environment");
  input.click();
};

window.openGallery = () => {
  const input = document.getElementById("fileInput");
  input.removeAttribute("capture");
  input.click();
};

/* ================= START HERE ================= */
init();

</script>

</body>
</html>
