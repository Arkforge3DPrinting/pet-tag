<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ArkLink</title>

<style>
/* =========================
   ARKLINK SAFE UI SYSTEM v1
   DROP-IN FULL PAGE VERSION
   NON-DESTRUCTIVE
   ========================= */

/* BASE */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #f5f7fb;
  color: #1c1c1e;
}

/* Prevent layout collapse issues */
* {
  box-sizing: border-box;
}

/* =========================
   SAFE PAGE LAYOUT HELPERS
   (ONLY ACTIVATES IF YOU ALREADY HAVE THESE CLASSES)
   ========================= */

.container,
.content,
.wrapper,
.main {
  max-width: 520px;
  margin: 0 auto;
  padding: 14px;
}

/* =========================
   CARD ENHANCEMENT SYSTEM
   ONLY ENHANCES EXISTING BLOCKS
   ========================= */

.card,
.box,
.panel,
section,
div.card,
div.box {
  background: #ffffff;
  border-radius: 16px;
  padding: 14px;
  margin: 10px 0;
  box-shadow: 0 10px 24px rgba(0,0,0,0.06);
  border: 1px solid rgba(0,0,0,0.04);
}

/* =========================
   TYPOGRAPHY POLISH (SAFE)
   ========================= */

h1, h2, h3 {
  margin: 10px 0;
  letter-spacing: -0.02em;
}

p {
  line-height: 1.5;
  color: #3a3a3c;
}

/* =========================
   IMAGE IMPROVEMENT (SAFE)
   ========================= */

img {
  max-width: 100%;
  height: auto;
  border-radius: 14px;
}

/* =========================
   BADGES / STATUS ELEMENTS
   ========================= */

.badge,
.tag,
.label {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  background: #eafaf1;
  color: #118a3a;
}

/* live indicator dot */
.dot,
.status-dot,
.live {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #34c759;
  display: inline-block;
  box-shadow: 0 0 10px rgba(52,199,89,0.45);
}

/* =========================
   BUTTON SYSTEM (SAFE ONLY)
   ========================= */

.button,
.cta,
a.button {
  display: block;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  text-align: center;
  font-weight: 600;
  text-decoration: none;
  margin-top: 10px;
  transition: transform 0.15s ease;
}

/* primary action */
.primary {
  background: #007aff;
  color: white !important;
  box-shadow: 0 10px 22px rgba(0,122,255,0.18);
}

/* secondary action */
.secondary {
  background: #f2f2f7;
  color: #1c1c1e !important;
}

/* subtle interaction */
.button:hover,
.cta:hover {
  transform: translateY(-1px);
}

/* =========================
   OPTIONAL SAFE CENTERING
   ========================= */

.center {
  text-align: center;
}

/* =========================
   MOBILE OPTIMISATION
   ========================= */

@media (max-width: 480px) {
  .container,
  .content,
  .wrapper,
  .main {
    padding: 10px;
  }

  .card,
  .box,
  .panel,
  section {
    margin: 8px 0;
    padding: 12px;
  }
}
</style>

</head>

<body>

<!--
  IMPORTANT:
  This file does NOT define structure.
  It only enhances whatever your existing index.html already renders via JS (?id=...)

  Your existing ArkLink logic remains untouched.
-->

</body>
</html>
