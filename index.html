<!DOCTYPE html>
<html>
<head>
  <title>Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 16px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: auto;

      background: white;

      padding: 18px;

      border-radius: 20px;

      box-shadow: 0 6px 20px rgba(0,0,0,0.08);

      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    p {
      font-size: 17px;
      color: #666;
      margin-bottom: 10px;
    }

    #petPhoto {
      width: 100%;
      max-width: 260px;

      aspect-ratio: 1 / 1;

      object-fit: cover;

      border-radius: 20px;

      margin: 14px auto;

      display: none;

      border: 4px solid #ffffff;

      box-shadow:
        0 0 0 3px #3b82f6,
        0 6px 18px rgba(0,0,0,0.15);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    button {
      width: 100%;
      padding: 16px;

      border: none;
      border-radius: 14px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;

      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #callBtn {
      background: #28c76f;
    }

    #textBtn {
      background: #3b82f6;
    }

    #locBtn {
      background: #ff9f43;
    }

    .footer {
      margin-top: 20px;
      font-size: 13px;
      color: #999;
    }

  </style>
</head>

<body>

<div class="container">

  <h1 id="title">Loading...</h1>

  <p id="message"></p>

  <img id="petPhoto">

  <div class="button-group">
    <button id="callBtn">📞 Call Owner</button>
    <button id="textBtn">💬 Text Owner</button>
    <button id="locBtn">📍 Share My Location</button>
  </div>

  <div class="footer">
    Powered by Arkforge 3D Printing ®
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadPet() {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) {

    document.getElementById("title").innerText =
      "No pet ID found";

    return;
  }

  const snap = await getDoc(doc(db, "pets", id));

  if (snap.exists()) {

    const pet = snap.data();

    document.getElementById("title").innerText =
      "🐾 You found " + pet.name;

    document.getElementById("message").innerText =
      "Help me get home safely";

    // PHOTO
    if (pet.photo) {

      const img = document.getElementById("petPhoto");

      img.src = pet.photo;

      img.style.display = "block";
    }

    // CALL BUTTON
    document.getElementById("callBtn").onclick = () => {

      window.location.href =
        "tel:" + pet.phone;

    };

    // TEXT BUTTON
    document.getElementById("textBtn").onclick = () => {

      window.location.href =
        "sms:" +
        pet.phone +
        "?body=" +
        encodeURIComponent(
          "Hi, I found your pet " + pet.name
        );

    };

    // LOCATION BUTTON
    document.getElementById("locBtn").onclick = () => {

      const locBtn =
        document.getElementById("locBtn");

      // Prevent spam clicking
      locBtn.disabled = true;
      locBtn.innerText = "📡 Getting Location...";

      if (!navigator.geolocation) {

        alert(
          "Geolocation is not supported on this device."
        );

        locBtn.disabled = false;
        locBtn.innerText =
          "📍 Share My Location";

        return;
      }

      navigator.geolocation.getCurrentPosition(

        // SUCCESS
        (pos) => {

          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          const msg =
            "Hi, I found your pet " +
            pet.name +
            ". My location: https://maps.google.com/?q=" +
            lat +
            "," +
            lon;

          window.location.href =
            "sms:" +
            pet.phone +
            "?body=" +
            encodeURIComponent(msg);

          // Reset button
          setTimeout(() => {

            locBtn.disabled = false;

            locBtn.innerText =
              "📍 Share My Location";

          }, 2000);

        },

        // ERROR
        (err) => {

          console.error(err);

          alert(
            "Could not get your location. Please enable GPS/location permissions and try again."
          );

          locBtn.disabled = false;

          locBtn.innerText =
            "📍 Share My Location";

        },

        // OPTIONS
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    };

  } else {

    document.getElementById("title").innerText =
      "Error loading pet information";

    document.getElementById("message").innerText =
      "Please contact Arkforge3DPrinting@outlook.com";

  }

}

loadPet();

</script>

</body>
</html>
