<!DOCTYPE html>
<html>
<head>
  <title>Create Pet Tag</title>
</head>

<body style="font-family: Arial; text-align:center; padding:20px;">

<h2>Create NFC Pet Tag</h2>

<input id="name" placeholder="Pet Name"><br><br>
<input id="phone" placeholder="Owner Phone"><br><br>

<button id="generateBtn">Generate & Save</button>

<p id="result"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// YOUR REAL CONFIG HERE
const firebaseConfig = {
  apiKey: "517154779272",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
  storageBucket: "arkforge-pets.firebasestorage.app",
  messagingSenderId: "517154779272",
  appId: "1:517154779272:web:4f7e09601bc327b57faf3d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ID generator
function generateId(length = 10) {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  let id = "";
  for (let i = 0; i < length; i++) {
    id += chars[Math.floor(Math.random() * chars.length)];
  }
  return id;
}

document.getElementById("generateBtn").onclick = async () => {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  if (!name || !phone) {
    document.getElementById("result").innerText = "Enter name and phone";
    return;
  }

  const id = generateId();

  try {
    await setDoc(doc(db, "pets", id), {
      name: name,
      phone: phone
    });

    const url = `https://arkforge3dprinting.github.io/pet-tag/?id=${id}`;

    document.getElementById("result").innerHTML =
      `<b>Saved!</b><br><br>
       <b>ID:</b> ${id}<br><br>
       <b>URL:</b><br>${url}`;

  } catch (e) {
    console.log(e);
    document.getElementById("result").innerText = "Error saving!";
  }

};
</script>

</body>
</html>
