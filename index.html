<!DOCTYPE html>
<html>
<head>
  <title>ArkLink Pet ID - Found Pet</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #e9f0f7, #f4f6f8);
      margin: 0;
      padding: 12px;
      color: #222;
    }

    #scanIntro {
      position: fixed;
      inset: 0;
      background: rgba(245, 247, 250, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      animation: fadeOut 1.2s ease forwards;
      animation-delay: 2.8s;
    }

    .scanCircle {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 3px solid #3b82f6;
      box-shadow: 0 0 25px rgba(59,130,246,0.25);
      animation: pulse 1.2s infinite;
      position: relative;
    }

    .scanCircle::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(59,130,246,0.15);
      animation: ripple 1.6s infinite;
    }

    .scanText {
      margin-top: 14px;
      font-weight: bold;
      color: #3b82f6;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: linear-gradient(180deg, #ffffff, #fbfcfd);
      padding: 16px;
      border-radius: 22px;
      border: 1px solid rgba(59,130,246,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
      position: relative;
    }

    h1 { font-size: 24px; margin: 0 0 6px 0; }
    p { font-size: 15px; color: #666; margin: 0 0 10px 0; }

    .photoWrap {
      position: relative;
      display: inline-block;
    }

    #petPhoto {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 18px;
      margin: 10px auto;
      transition: 0.3s ease;
    }

    /* SAFE (GREEN) */
    .safePhoto {
      animation: petGlowGreen 3s ease-in-out infinite;
      box-shadow:
        0 0 0 2px rgba(34, 197, 94, 0.25),
        0 8px 22px rgba(0,0,0,0.08);
    }

    @keyframes petGlowGreen {
      0% { box-shadow: 0 0 0 2px rgba(34,197,94,0.18), 0 8px 20px rgba(0,0,0,0.08); }
      50% { box-shadow: 0 0 0 4px rgba(34,197,94,0.35), 0 0 16px rgba(34,197,94,0.25); }
      100% { box-shadow: 0 0 0 2px rgba(34,197,94,0.18), 0 8px 20px rgba(0,0,0,0.08); }
    }

    /* LOST (RED PULSE) */
    .lostPhoto {
      animation: petGlowRed 1.6s ease-in-out infinite;
    }

    @keyframes petGlowRed {
      0% { box-shadow: 0 0 0 2px rgba(239,68,68,0.25), 0 8px 20px rgba(0,0,0,0.08); }
      50% { box-shadow: 0 0 0 5px rgba(239,68,68,0.65), 0 0 18px rgba(239,68,68,0.45); }
      100% { box-shadow: 0 0 0 2px rgba(239,68,68,0.25), 0 8px 20px rgba(0,0,0,0.08); }
    }

    .statusBadge {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      color: white;
      z-index: 10;
    }

    .status-lost { background: #ef4444; }
    .status-safe { background: #22c55e; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .single { grid-template-columns: 1fr !important; }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    #callBtn, #callBtn2 { background: #28c76f; }
    #textBtn, #textBtn2 { background: #3b82f6; }
    #locBtn, #locBtn2 { background: #ff9f43; }

    .hidden { display: none !important; }
  </style>
</head>

<body>

<div id="scanIntro">
  <div class="scanCircle"></div>
  <div class="scanText">Scanning ArkLink Tag...</div>
</div>

<div id="locked"></div>

<div class="container" id="main">

  <h1 id="title">Loading...</h1>
  <p id="message"></p>

  <div class="photoWrap">
    <div id="statusBadge" class="statusBadge hidden"></div>
    <img id="petPhoto">
  </div>

  <div id="btnGrid" class="grid">
    <button id="callBtn">📞 Call</button>
    <button id="callBtn2">📞 Call Secondary</button>
    <button id="textBtn">💬 Text</button>
    <button id="textBtn2">💬 Text Secondary</button>
    <button id="locBtn">📍 Send Location</button>
    <button id="locBtn2">📍 Send Location Secondary</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCxFKSE6bXM06hVVswiRN_S9FO2NpDKEHc",
  authDomain: "arkforge-pets.firebaseapp.com",
  projectId: "arkforge-pets",
});

const db = getFirestore(app);

const id = new URLSearchParams(window.location.search).get("id");

const main = document.getElementById("main");

let gpsBusy = false;

function getGPS() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject);
  });
}

function bindGPS(btnId, phone, pet) {
  const btn = document.getElementById(btnId);

  btn.onclick = async () => {
    if (gpsBusy) return;
    gpsBusy = true;

    btn.disabled = true;
    btn.innerText = "📡 Acquiring GPS...";

    try {
      const pos = await getGPS();

      const msg =
        "I found " + pet.name +
        ". Location: https://maps.google.com/?q=" +
        pos.coords.latitude + "," + pos.coords.longitude;

      window.open(`sms:${phone}?body=${encodeURIComponent(msg)}`, "_self");

    } finally {
      btn.disabled = false;
      gpsBusy = false;
      btn.innerText = "📍 Send Location";
    }
  };
}

async function loadPet() {

  const snap = await getDoc(doc(db, "pets", id));
  if (!snap.exists()) return;

  const pet = snap.data();

  main.style.display = "block";

  document.getElementById("title").innerText = "🐾 You found " + pet.name;
  document.getElementById("message").innerText = "Help get them home safely.";

  const photo = document.getElementById("petPhoto");
  const badge = document.getElementById("statusBadge");

  const status = pet.petStatus || "safe";

  badge.classList.remove("hidden");

  if (status === "lost") {
    badge.innerText = "🔴 LOST";
    badge.classList.add("status-lost");
    photo.classList.add("lostPhoto");
  } else {
    badge.innerText = "🟢 SAFE";
    badge.classList.add("status-safe");
    photo.classList.add("safePhoto");
  }

  if (pet.photo) photo.src = pet.photo;

  /* ===== BUTTONS RESTORED ===== */

  document.getElementById("callBtn").onclick =
    () => window.location.href = "tel:" + pet.phone;

  document.getElementById("textBtn").onclick =
    () => window.open(`sms:${pet.phone}?body=${encodeURIComponent("I found your pet " + pet.name)}`, "_self");

  bindGPS("locBtn", pet.phone, pet);

  if (pet.phone2 && pet.phone2.trim()) {

    document.getElementById("callBtn2").onclick =
      () => window.location.href = "tel:" + pet.phone2;

    document.getElementById("textBtn2").onclick =
      () => window.open(`sms:${pet.phone2}?body=${encodeURIComponent("I found your pet " + pet.name)}`, "_self");

    bindGPS("locBtn2", pet.phone2, pet);

  } else {
    document.getElementById("btnGrid").classList.add("single");

    ["callBtn2","textBtn2","locBtn2"].forEach(id =>
      document.getElementById(id).classList.add("hidden")
    );
  }
}

loadPet();
</script>

</body>
</html>
